name: Deploy to GAS

on:
  push:
    branches:
      - main
    # Only Apps Script changes need a GAS deploy. Screen changes are served by Cloudflare Pages.
    paths:
      - 'gas/**'
      - 'tests/gas-sources.test.mjs'
      - 'docs/migration/import-report.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test GAS sources
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create .clasprc.json
        run: echo '${{ secrets.CLASPRC_JSON_KEY }}' > ~/.clasprc.json

      # Only gas/ is pushed to Apps Script. The frontend and docs live elsewhere in this repository.
      - name: Create .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"gas"}' > .clasp.json

      - name: Push to GAS
        run: clasp push --force

      - name: Deploy to GAS
        run: clasp deploy --deploymentId ${{ secrets.DEPLOYMENT_ID }}
