<script>
    // 読み込み中は2種類だけ（docs/design/universe-design-system.md 17章）。
    //   形が分かる中身を待つ … 中身と同じ形の .ui-skeleton
    //   形が分からない短い待ち … renderUniverseLoading()：細いくるくると日本語の文
    // 色は指定できない。英語（LOADING…）を渡されても日本語で出す。
    function renderUniverseLoading(label) {
      const raw = typeof label === 'string' ? label.trim() : '';
      const text = !raw || /^LOADING/i.test(raw) ? '読み込み中…' : raw;
      return '<div class="ui-loading universe-loading" role="status" aria-live="polite"><span>' + escapeHtml(text) + '</span></div>';
    }

    // 番号つきの行（renderUniverseIndexRows）を待つ間のスケルトン。行と同じ高さ・本数で出す。
    function renderUniverseIndexSkeleton(count, extraClass) {
      const row = '<div class="ui-index-row" aria-hidden="true"><span class="ui-skeleton" style="width:56px;height:44px"></span><span class="ui-index-copy"><span class="ui-skeleton" style="width:46%;height:16px"></span><span class="ui-skeleton" style="width:78%;height:12px;margin-top:10px"></span></span><span></span></div>';
      let rows = '';
      for (let i = 0; i < (count || 4); i++) rows += row;
      return '<div class="ui-list' + (extraClass ? ' ' + extraClass : '') + '" role="status" aria-busy="true" aria-label="読み込み中">' + rows + '</div>';
    }

    function closeOnBackdrop(event, id) {
      if (event.target && event.target.id === id) {
        if (id === 'settingsOverlay') closeSettings();
      }
    }

    function showToast(message = '保存しました') {
      if (!toastRegion) return;

      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }

      toastRegion.innerHTML = `
        <div class="universe-toast" role="status">
          ${escapeHtml(message)}
        </div>
      `;

      toastTimer = setTimeout(() => {
        const toast = toastRegion.querySelector('.universe-toast');
        if (!toast) return;

        toast.classList.add('toast-out');

        setTimeout(() => {
          toastRegion.innerHTML = '';
          toastTimer = null;
        }, 180);
      }, 1800);
    }

</script>
