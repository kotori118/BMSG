<style>
  /* 読み込み中・スケルトン・通知の共通部品（色はトークン） */
  :root { --u-skeleton-base: var(--ui-panel); --u-skeleton-line: var(--ui-panel-2); --u-skeleton-shine: var(--ui-line); }

  :is(.state-card, .profile-members-state, .karaoke-history-empty, .lyrics-empty) { border-radius: var(--ui-radius); }

  /* スケルトン：枠は本物のまま、中身だけ流れる面 */
  :is(.skeleton-block, .profile-member-skeleton) { position: relative; overflow: hidden; background: var(--ui-panel-2); }
  :is(.skeleton-block, .profile-member-skeleton)::after { content: ""; position: absolute; inset: 0; transform: translateX(-110%); background: linear-gradient(90deg, transparent, var(--ui-line), transparent); animation: universeSkeletonSweep 1.35s ease-in-out infinite; }
  @keyframes universeSkeletonSweep { to { transform: translateX(115%); } }

  /* 通知（トースト）：塗りの帯 */
  .universe-toast {
    min-height: 52px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: var(--ui-radius);
    background: var(--ui-active-bg);
    color: var(--ui-active-text);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    font-weight: 700;
    letter-spacing: .06em;
    opacity: 0;
    transform: translateY(10px);
    animation: toast-in 190ms var(--ui-ease) forwards;
  }
  .universe-toast.toast-out { animation: toast-out 170ms var(--ui-ease) forwards; }
  @keyframes toast-in { to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

  /* 処理中のくるくる（本当に待つときだけ） */
  .universe-loading, .profile-detail-loading, .profile-map-loading, .profile-search-loading, .karaoke-loading, .lyrics-loading, .profile-management-loading, .image-management-loading, .slm-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-label);
    font-weight: 700;
    letter-spacing: .12em;
  }
  .universe-spinner, .profile-detail-spinner, .profile-map-spinner, .profile-search-spinner, .karaoke-loading::before, .lyrics-loading::before, .profile-management-loading::before, .image-management-loading::before, .slm-loading::before {
    box-sizing: border-box;
    width: 18px;
    height: 18px;
    flex: none;
    border: 2px solid var(--ui-line);
    border-top-color: var(--ui-text);
    border-right-color: var(--ui-text);
    border-radius: 50%;
    animation: universeSpinner .8s linear infinite;
  }
  .karaoke-loading::before, .lyrics-loading::before, .profile-management-loading::before, .image-management-loading::before, .slm-loading::before { content: ""; }
  .karaoke-loading.is-shared::before, .lyrics-loading.is-shared::before { display: none; content: none; }
  :is(.profile-management-loading, .image-management-loading, .slm-loading) { min-height: 72px; padding: 24px 0; text-align: center; }
  @keyframes universeSpinner { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    :is(.skeleton-block, .profile-member-skeleton)::after { display: none; }
    .universe-spinner, .profile-detail-spinner, .profile-map-spinner, .profile-search-spinner, .karaoke-loading::before, .lyrics-loading::before, .profile-management-loading::before, .image-management-loading::before, .slm-loading::before { animation: none; }
  }
</style>
<script>
    function normalizeUniverseLoadingAccent(value) {
      const color = String(value || '').trim();
      return /^#[0-9a-f]{6}$/i.test(color) ? color : '#9cecff';
    }

    function renderUniverseLoading(label, accent) {
      const safeAccent = normalizeUniverseLoadingAccent(accent);
      const hasLabel = label !== false && label !== null;
      // Screens still pass the old English label; show Japanese everywhere.
      const raw = hasLabel ? String(label || '') : '';
      const text = hasLabel ? (!raw || /^LOADING\.*$/i.test(raw) ? '読み込み中…' : raw) : '';
      const safeLabel = typeof escapeHtml === 'function' ? escapeHtml(text) : text;
      return '<div class="universe-loading" role="status" aria-live="polite" style="--loading-accent:' + safeAccent + '"><span class="universe-spinner" aria-hidden="true"></span>' + (hasLabel ? '<span>' + safeLabel + '</span>' : '') + '</div>';
    }

    function closeOnBackdrop(event, id) {
      if (event.target && event.target.id === id) {
        if (id === 'settingsOverlay') closeSettings();
      }
    }

    function showToast(message = '保存しました') {
      if (!toastRegion) return;

      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }

      toastRegion.innerHTML = `
        <div class="universe-toast" role="status">
          ${escapeHtml(message)}
        </div>
      `;

      toastTimer = setTimeout(() => {
        const toast = toastRegion.querySelector('.universe-toast');
        if (!toast) return;

        toast.classList.add('toast-out');

        setTimeout(() => {
          toastRegion.innerHTML = '';
          toastTimer = null;
        }, 180);
      }, 1800);
    }

</script>
