<style>
  /* ポーカーの並べ方。見た目は部品 .ui-*、カードの絵柄は下の data-content */
  .poker-page { max-width: 980px; margin: 0 auto; padding-top: 74px; padding-bottom: 50px; }
  @media (max-width: 680px) { .poker-page { padding-top: 70px; } }
  .poker-header { display: flex; align-items: center; justify-content: flex-start; gap: 14px; margin-bottom: 24px; }
  .poker-header > div { min-width: 0; }
  .poker-header .title { margin: 0; }
  .poker-home-btn { order: -1; flex: none; margin: 0; }
  .poker-app { min-height: 440px; }

  /* 選ぶ画面：番号つきの行（renderUniverseIndexRows）と、見出しつきの区切り */
  .poker-section { display: grid; gap: 10px; padding: 18px 0; }
  .poker-section-label { margin: 18px 0 10px; }
  .poker-section > .poker-section-label { margin: 0; }
  .poker-section-head { display: flex; align-items: center; justify-content: flex-start; gap: 14px; margin: 0 0 18px; }
  .poker-section-head > div { min-width: 0; }
  .poker-section-head h2 { margin: 0; text-align: left; }

  /* 部屋・参加 */
  .poker-panel { padding: 18px; }
  .poker-panel + .poker-panel { margin-top: 14px; }
  .poker-panel-label { display: block; margin-bottom: 10px; }
  .poker-join { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .poker-input { min-width: 0; height: 50px; box-sizing: border-box; padding: 0 16px; text-align: center; }
  .poker-join .ui-btn { min-width: 110px; }
  .poker-room-meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .poker-player-list { display: grid; gap: 8px; margin: 16px 0; }
  .poker-player-row { display: flex; align-items: center; justify-content: space-between; min-height: 50px; padding: 0 14px; }
  .poker-actions { display: flex; gap: 10px; margin-top: 16px; }
  .poker-actions .ui-btn { flex: 1; min-height: 50px; padding: 10px 14px; }
  .poker-actions.is-stack { flex-direction: column; }
  .poker-status { margin: 8px 0 16px; text-align: center; }
  .poker-status strong { display: block; }
  .poker-status span { display: block; margin-top: 7px; }
  .poker-mode-badge { display: table; margin: 0 auto 12px; text-align: center; }

  /* 手札 */
  .poker-board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; width: 100%; perspective: 1000px; }
  .poker-vote-btn { width: 100%; min-height: 44px; margin-top: 12px; }

  @media (max-width: 560px) {
    .poker-panel { padding: 14px; }
    .poker-board { gap: 4px; }
    .poker-actions { flex-direction: column; }
    .poker-room-meta { align-items: flex-start; flex-direction: column; }
    .poker-join { grid-template-columns: 1fr; }
    .poker-join .ui-btn { min-height: 50px; }
  }

  /* 確認 */
  .poker-confirm-overlay { position: fixed; inset: 0; z-index: 12000; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .poker-confirm-panel { width: min(100%, 420px); box-sizing: border-box; padding: 22px; }
  .poker-confirm-panel h3 { margin: 0; line-height: 1.5; text-align: left; }
  .poker-confirm-panel p { margin: 10px 0 0; line-height: 1.7; }
  .poker-confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .poker-confirm-actions .ui-btn { min-height: 50px; }
  @media (max-width: 480px) { .poker-confirm-actions { grid-template-columns: 1fr; } }

  @keyframes pokerRealFlip { 0% { transform: rotateY(0deg) scale(.985); } 44% { transform: rotateY(88deg) scale(.97); } 56% { transform: rotateY(102deg) scale(.97); } 100% { transform: rotateY(180deg) scale(1); } }
</style>
<style data-content>
  /* 中身の見た目（カードの絵柄・レア度の枠色）。ボタン・入力欄はここに書かない */
  .poker-slot { position: relative; min-width: 0; aspect-ratio: 7 / 10; padding: 0; border: 0; border-radius: var(--ui-radius); background: transparent; perspective: 900px; transform-style: preserve-3d; transition: transform .2s ease, opacity .2s ease; }
  .poker-slot.is-sort { transform: translateY(-10px); }
  .poker-slot.is-exchange { transform: translateY(10px); opacity: .48; }
  .poker-slot:focus-visible { outline: 2px solid var(--poker-cyan); outline-offset: 3px; }

  /* カード：裏と表の2面を回してめくる */
  .poker-card { position: absolute; inset: 0; border-radius: 11px; border: 1px solid rgba(156,236,255,.18); background: radial-gradient(circle at 50% 22%, rgba(156,236,255,.12), transparent 42%), #090d14; box-shadow: 0 12px 24px rgba(0,0,0,.34); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transform: rotateY(0deg); transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
  .poker-card.is-face-up { transform: rotateY(180deg); }
  .poker-card.is-revealing { -webkit-backface-visibility: hidden; backface-visibility: hidden; transform-origin: center center; animation: pokerRealFlip .56s cubic-bezier(.2,.72,.2,1) both; }
  .poker-card-face { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .poker-card-back-face { transform: rotateY(0deg); background: radial-gradient(circle at 50% 28%, rgba(156,236,255,.12), transparent 45%), #090d14; }
  .poker-card-back-face::before { content: 'BMSG'; position: absolute; inset: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(156,236,255,.24); border-radius: 8px; color: rgba(255,255,255,.72); font: 700 clamp(7px, 2vw, 13px) var(--font-display), var(--font-body), sans-serif; letter-spacing: .08em; }
  .poker-card-front-face { transform: rotateY(180deg); background: #090d14; }
  .poker-card-front-face img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .poker-card-label { position: absolute; z-index: 2; left: 4px; right: 4px; bottom: 4px; display: block; padding: 4px 3px; overflow: hidden; border-radius: 5px; background: rgba(2,4,8,.78); color: #fff; font: 700 clamp(6px, 1.7vw, 9px) var(--font-body), sans-serif; letter-spacing: 0; white-space: nowrap; text-overflow: ellipsis; text-align: center; }

  /* レア度の枠色 */
  .poker-card.rarity-n { --poker-rarity-border: #9cecff; border-color: var(--poker-rarity-border); }
  .poker-card.rarity-r { --poker-rarity-border: #b87846; border-color: var(--poker-rarity-border); }
  .poker-card.rarity-sr { --poker-rarity-border: #dbe5ef; border-color: var(--poker-rarity-border); }
  .poker-card.rarity-ssr { --poker-rarity-border: #f2c64f; border-color: var(--poker-rarity-border); }
  /* 並べ替え・交換で選んだカード：カードは表のまま、札ごと上下に動く */
  .poker-slot.is-sort .poker-card, .poker-slot.is-exchange .poker-card { transform: rotateY(180deg); opacity: 1; border-color: var(--poker-rarity-border, #9cecff); }

  @media (max-width: 560px) { .poker-card { border-radius: 8px; } }
  @media (prefers-reduced-motion: reduce) {
    .poker-slot { transition: none; }
    .poker-card { transition: none; }
    .poker-card.is-revealing { animation: none; transform: rotateY(180deg); }
  }
</style>
