<script>
  // BE:STATS の計算（画面に触らない関数だけ。tests/bestats-calc.test.mjs が同じものを動かして確かめる）。
  // 日付は 'YYYY-MM-DD'。欠測（null）は計算に使わない（前後の値で補わない）。
  const BS_MINUS = '−';
  const BS_EVENT_KIND_LABELS = {release: 'リリース', tv: 'TV出演', year_end: '年末', summer: '夏'};

  function bsAddDays(iso, n) {
    const d = new Date(iso + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function bsDaysBetween(from, to) {
    return Math.round((new Date(to + 'T00:00:00Z') - new Date(from + 'T00:00:00Z')) / 86400000);
  }

  // 指標1つの値の並び（欠測を除く、日付の古い順）。[{date, value}]
  function bsSeries(daily, id) {
    const out = [];
    (daily || []).forEach(function (row) {
      const v = row[id];
      if (typeof v === 'number' && isFinite(v)) out.push({date: row.date, value: v});
    });
    return out;
  }

  // その日の値（無ければ null。前後の値では補わない）
  function bsValueOn(series, date) {
    for (let i = series.length - 1; i >= 0; i--) {
      if (series[i].date === date) return series[i].value;
      if (series[i].date < date) return null;
    }
    return null;
  }

  // 大きい数は万・億（18.0億 / 120.4万）。1万未満は桁区切り。データなしは 0。
  function bsFormatCount(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '0';
    const a = Math.abs(n), sign = n < 0 ? BS_MINUS : '';
    if (a >= 1e8) return sign + (a / 1e8).toFixed(1) + '億';
    if (a >= 1e4) return sign + (a / 1e4).toFixed(1) + '万';
    return sign + Math.round(a).toLocaleString('en-US');
  }

  // 増減（+1,234 / −567）
  function bsFormatSigned(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '0';
    if (n === 0) return '0';
    return (n > 0 ? '+' : BS_MINUS) + bsFormatCount(Math.abs(n));
  }

  // 率（+8.33%）
  function bsFormatPercent(rate) {
    if (typeof rate !== 'number' || !isFinite(rate)) return '';
    const pct = rate * 100;
    if (Math.abs(pct) < 0.005) return '0.00%';
    return (pct > 0 ? '+' : BS_MINUS) + Math.abs(pct).toFixed(2) + '%';
  }

  // 節目：人 …10万・50万・100万、以降 50万ごと／回 …1,000万・5,000万・1億、以降 1億ごと
  function bsMilestonesUpTo(unit, maxValue) {
    const list = [];
    if (unit === '人') {
      [100000, 500000, 1000000].forEach(function (t) { if (t <= maxValue) list.push(t); });
      for (let t = 1500000; t <= maxValue; t += 500000) list.push(t);
    } else {
      [10000000, 50000000, 100000000].forEach(function (t) { if (t <= maxValue) list.push(t); });
      for (let t = 200000000; t <= maxValue; t += 100000000) list.push(t);
    }
    return list;
  }

  function bsMilestoneLabel(threshold, unit) {
    let text;
    if (threshold >= 1e8) text = String(threshold / 1e8) + '億';
    else text = (threshold / 1e4).toLocaleString('en-US') + '万';
    return text + unit;
  }

  // 注目の動き。metrics: [{id,name,media,unit}]、daily、dataEnd。最大 limit 件。
  //  1) dataEnd から7日以内に初めて節目以上になったもの  2) 直近30日で3%以上伸びたもの（増加率の高い順）
  function bsNotableMoves(metrics, daily, dataEnd, limit) {
    limit = limit || 5;
    const windowStart = bsAddDays(dataEnd, -6);
    const milestones = [], growth = [];
    metrics.forEach(function (m) {
      const series = bsSeries(daily, m.id);
      if (series.length < 2) return;
      let runningMax = series[0].value;
      for (let i = 1; i < series.length; i++) {
        const cur = series[i];
        if (cur.date >= windowStart && cur.date <= dataEnd && cur.value > runningMax) {
          bsMilestonesUpTo(m.unit, cur.value).forEach(function (t) {
            if (t > runningMax && t <= cur.value) {
              milestones.push({kind: 'milestone', metric: m, date: cur.date, value: cur.value, threshold: t, headline: bsMilestoneLabel(t, m.unit) + 'に到達'});
            }
          });
        }
        if (cur.value > runningMax) runningMax = cur.value;
      }
      const last = series[series.length - 1];
      const base = bsValueOn(series, bsAddDays(last.date, -30));
      if (base !== null && base > 0) {
        const rate = (last.value - base) / base;
        if (rate >= 0.03) growth.push({kind: 'growth', metric: m, date: last.date, value: last.value, rate: rate, headline: '直近30日で ' + bsFormatPercent(rate)});
      }
    });
    milestones.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.threshold - a.threshold; });
    growth.sort(function (a, b) { return b.rate - a.rate; });
    return milestones.concat(growth).slice(0, limit);
  }

  // 期間ボタンと年の選択から、表示する日付の範囲を返す。period: '7'|'30'|'90'|'365'|'all'、year: '' または 2025 など
  function bsRange(firstDate, dataEnd, period, year) {
    if (year) {
      const y = String(year);
      const to = y + '-12-31' < dataEnd ? y + '-12-31' : dataEnd;
      const from = y + '-01-01' > firstDate ? y + '-01-01' : firstDate;
      return {from: from, to: to};
    }
    if (period === 'all') return {from: firstDate, to: dataEnd};
    const days = Number(period) || 90;
    const from = bsAddDays(dataEnd, -(days - 1));
    return {from: from > firstDate ? from : firstDate, to: dataEnd};
  }

  // 直近30日の増減：V(最終日) − V(最終日−30日)
  function bsLast30(series) {
    if (!series.length) return null;
    const last = series[series.length - 1];
    const base = bsValueOn(series, bsAddDays(last.date, -30));
    if (base === null) return null;
    return {delta: last.value - base, rate: base > 0 ? (last.value - base) / base : null};
  }

  // 前日比：（今日 − 前日）÷ 前日。前日の値が無ければ null
  function bsDayChange(series) {
    if (!series.length) return null;
    const last = series[series.length - 1];
    const prev = bsValueOn(series, bsAddDays(last.date, -1));
    if (prev === null || prev <= 0) return null;
    return (last.value - prev) / prev;
  }

  // 出来事の日 d の後30日：V(d+29日) − V(d−1日)。最終日を超えるときは最終日まで。どちらかの値が無ければ null
  function bsAfter30(series, date) {
    if (!series.length) return null;
    const before = bsValueOn(series, bsAddDays(date, -1));
    const lastDate = series[series.length - 1].date;
    let endDate = bsAddDays(date, 29);
    if (endDate > lastDate) endDate = lastDate;
    const after = bsValueOn(series, endDate);
    if (before === null || after === null) return null;
    return {delta: after - before, rate: before > 0 ? (after - before) / before : null};
  }

  // 年ごとの平均（その年の日次値の平均。今年は最終日まで）。[{year, avg}]
  function bsYearlyAverages(series) {
    const byYear = {};
    series.forEach(function (p) {
      const y = p.date.slice(0, 4);
      (byYear[y] = byYear[y] || {sum: 0, n: 0});
      byYear[y].sum += p.value; byYear[y].n += 1;
    });
    return Object.keys(byYear).sort().map(function (y) { return {year: y, avg: byYear[y].sum / byYear[y].n}; });
  }

  // 出来事の一覧（範囲内・新しい順）。同じ日は元の順のまま
  function bsEventsInRange(events, from, to) {
    return (events || []).filter(function (e) {
      const end = e.end || e.date;
      return e.date <= to && end >= from;
    }).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  // 直近の活動：TV出演・ライブ公演・YouTube通常動画（Shorts は入れない）。today 以前＝実績、より後＝予定
  function bsActivityItems(data, today) {
    const programName = {};
    ((data.tv && data.tv.programs) || []).forEach(function (p) { programName[p.programId] = p.name; });
    const items = [];
    ((data.tv && data.tv.appearances) || []).forEach(function (a) { items.push({date: a.date, type: 'TV', title: programName[a.programId] || a.programId}); });
    ((data.live && data.live.shows) || []).forEach(function (s) { items.push({date: s.date, type: 'LIVE', title: s.title + (s.venue ? '　' + s.venue : '')}); });
    ((data.youtube && data.youtube.videos) || []).forEach(function (v) { if (v.type === 'normal') items.push({date: v.date, type: 'YouTube', title: v.title}); });
    const planned = items.filter(function (i) { return i.date > today; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    const done = items.filter(function (i) { return i.date <= today; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return {planned: planned, done: done};
  }

  // ---- コンテンツ（TV出演・ライブ披露・YouTube）の集計 ----

  // 期間の選び方（全期間 / 直近1年 / 年）から日付の範囲。firstDate はその媒体の一番古い日付
  function bsContentRange(period, dataEnd, firstDate) {
    if (/^\d{4}$/.test(String(period))) {
      const y = String(period);
      return {from: y + '-01-01', to: y + '-12-31' < dataEnd ? y + '-12-31' : dataEnd};
    }
    if (period === '365') return {from: bsAddDays(dataEnd, -364), to: dataEnd};
    return {from: firstDate && firstDate < dataEnd ? firstDate : dataEnd, to: dataEnd};
  }

  // 月ごと／年ごとの棒。items: [{date, ...}]、keyFn で積み上げの種類を分ける。
  // 返り値 {labels, months（各棒の年月 or 年）, keys, counts:{key:[…]}, totals:[…], total}
  function bsBucketize(items, from, to, agg, keyFn) {
    const months = [];
    if (agg === 'year') {
      for (let y = Number(from.slice(0, 4)); y <= Number(to.slice(0, 4)); y++) months.push(String(y));
    } else {
      let y = Number(from.slice(0, 4)), m = Number(from.slice(5, 7));
      const endY = Number(to.slice(0, 4)), endM = Number(to.slice(5, 7));
      while (y < endY || (y === endY && m <= endM)) {
        months.push(y + '-' + (m < 10 ? '0' : '') + m);
        m++; if (m > 12) { m = 1; y++; }
      }
    }
    const index = {}; months.forEach(function (label, i) { index[label] = i; });
    const keys = [], counts = {};
    const totals = months.map(function () { return 0; });
    let total = 0;
    (items || []).forEach(function (it) {
      if (it.date < from || it.date > to) return;
      const i = index[agg === 'year' ? it.date.slice(0, 4) : it.date.slice(0, 7)];
      if (i === undefined) return;
      const key = keyFn ? keyFn(it) : 'all';
      if (!counts[key]) { counts[key] = months.map(function () { return 0; }); keys.push(key); }
      counts[key][i]++; totals[i]++; total++;
    });
    if (!keys.length) { keys.push('all'); counts.all = totals.slice(); }
    return {months: months, keys: keys, counts: counts, totals: totals, total: total};
  }

  // 棒の下の名前。年ごとの今年は「2026（11月まで）」
  function bsBucketLabel(label, agg, dataEnd) {
    if (agg === 'year') return label === dataEnd.slice(0, 4) ? label + '（' + Number(dataEnd.slice(5, 7)) + '月まで）' : label;
    return label.slice(2).replace('-', '/');
  }

  // 数えて、多い順（同じ数は名前の順）。[{key, count}]
  function bsCountBy(list, keyFn) {
    const map = {};
    list.forEach(function (it) { const k = keyFn(it); if (k === '' || k === null || k === undefined) return; map[k] = (map[k] || 0) + 1; });
    return Object.keys(map).map(function (k) { return {key: k, count: map[k]}; }).sort(function (a, b) { return b.count - a.count || (a.key < b.key ? -1 : 1); });
  }

  // TVの披露曲：期間内の出演で、曲ごとの披露件数
  function bsTvSongRanking(appearances, from, to, titleOf) {
    const rows = [];
    (appearances || []).forEach(function (a) {
      if (a.date < from || a.date > to) return;
      (a.songs || []).forEach(function (s) { rows.push({songId: String(s.songId)}); });
    });
    return bsCountBy(rows, function (r) { return r.songId; }).map(function (r) { return {songId: r.key, title: titleOf(r.key), count: r.count}; });
  }

  // ライブの披露曲：披露した公演数（披露集計対象のみ。同じ公演で同じ曲が複数あっても1回）
  function bsLiveSongRanking(shows, from, to) {
    const map = {};
    (shows || []).forEach(function (sh) {
      if (sh.date < from || sh.date > to) return;
      const seen = {};
      (sh.setlist || []).forEach(function (s) {
        if (!s.counted || seen[s.songId]) return;
        seen[s.songId] = true;
        (map[s.songId] = map[s.songId] || {songId: String(s.songId), title: s.title || String(s.songId), count: 0}).count++;
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.count - a.count || (a.title < b.title ? -1 : 1); });
  }

  // 曲順：OP（一番小さい曲順）／MAINラスト（MAIN の中で一番大きい曲順）／アンコール（ENCORE 全部）
  function bsSetlistMarks(setlist) {
    const list = (setlist || []).slice().sort(function (a, b) { return a.order - b.order; });
    if (!list.length) return null;
    const mains = list.filter(function (s) { return s.section === 'MAIN'; });
    return {
      op: list[0].title,
      mainLast: mains.length ? mains[mains.length - 1].title : null,
      encore: list.filter(function (s) { return s.section === 'ENCORE'; }).map(function (s) { return s.title; })
    };
  }

  // YouTube のジャンル別：件数・割合・通常動画とShortsの内訳・年ごとの件数。多い順
  function bsGenreStats(videos) {
    const all = videos.length, map = {};
    videos.forEach(function (v) {
      const g = v.genre;
      const e = (map[g] = map[g] || {genre: g, total: 0, normal: 0, shorts: 0, byYear: {}});
      e.total++; if (v.type === 'shorts') e.shorts++; else e.normal++;
      const y = v.date.slice(0, 4); e.byYear[y] = (e.byYear[y] || 0) + 1;
    });
    return Object.keys(map).map(function (k) { map[k].share = all ? map[k].total / all : 0; return map[k]; })
      .sort(function (a, b) { return b.total - a.total || (a.genre < b.genre ? -1 : 1); });
  }

  // 出演履歴の表の記号。○ ×、予は「予」、？（発表前）は「－」
  function bsMatrixSymbol(value) {
    if (value === '○' || value === '×' || value === '予') return value;
    return '－';
  }

  // ---- つながり ----

  // 範囲の最初の日を100にした値（各日 ÷ 最初の日 × 100）。最初の日が欠測なら、範囲内で最初に値がある日を100にする。欠測は null のまま。
  function bsNormalizeRows(rows, id) {
    let base = null;
    for (let i = 0; i < rows.length; i++) {
      const v = rows[i][id];
      if (typeof v === 'number' && isFinite(v) && v > 0) { base = v; break; }
    }
    return rows.map(function (r) {
      const v = r[id];
      return base !== null && typeof v === 'number' && isFinite(v) ? v / base * 100 : null;
    });
  }

  // 年末・夏など期間のある出来事の数字：V(終わりの日) − V(始まりの前日)。換算しない。終わりが最終日を超えるときは最終日まで
  function bsDeltaBetween(series, startDate, endDate) {
    if (!series.length) return null;
    const before = bsValueOn(series, bsAddDays(startDate, -1));
    const lastDate = series[series.length - 1].date;
    const after = bsValueOn(series, endDate > lastDate ? lastDate : endDate);
    if (before === null || after === null) return null;
    return {delta: after - before, rate: before > 0 ? (after - before) / before : null};
  }

  // 曲ごとの露出の日付。TV＝披露曲明細、ライブ＝披露集計対象（同じ公演の同じ曲は1回）、通常動画・Shorts＝SongID が一致する動画。
  // songs は対象の曲（BE:FIRST の曲）。返り値 {songId: {tv:[日付], live:[日付], normal:[日付], shorts:[日付]}}
  function bsSongExposures(songs, data) {
    const map = {};
    songs.forEach(function (s) { map[String(s.SongID)] = {tv: [], live: [], normal: [], shorts: []}; });
    ((data.tv && data.tv.appearances) || []).forEach(function (a) {
      (a.songs || []).forEach(function (sg) { const e = map[String(sg.songId)]; if (e) e.tv.push(a.date); });
    });
    ((data.live && data.live.shows) || []).forEach(function (sh) {
      const seen = {};
      (sh.setlist || []).forEach(function (sg) {
        const id = String(sg.songId), e = map[id];
        if (e && sg.counted && !seen[id]) { seen[id] = true; e.live.push(sh.date); }
      });
    });
    ((data.youtube && data.youtube.videos) || []).forEach(function (v) {
      const e = v.songId ? map[String(v.songId)] : null;
      if (e) (v.type === 'shorts' ? e.shorts : e.normal).push(v.date);
    });
    return map;
  }

  function bsExposureCount(exp, from, to) {
    const n = function (list) { return list.filter(function (d) { return d >= from && d <= to; }).length; };
    const out = {tv: n(exp.tv), live: n(exp.live), normal: n(exp.normal), shorts: n(exp.shorts)};
    out.total = out.tv + out.live + out.normal + out.shorts;
    return out;
  }

  // 発売後N日（発売日〜発売日+N−1）の露出で順位。その期間がまだ終わっていない曲は順位に入れず、pending に題名を返す
  function bsAfterRelease(songs, exposures, days, dataEnd) {
    const ranked = [], pending = [];
    songs.forEach(function (s) {
      if (!s.ReleaseDate) return;
      const to = bsAddDays(s.ReleaseDate, days - 1);
      if (to > dataEnd) { pending.push(s.Title); return; }
      const c = bsExposureCount(exposures[String(s.SongID)], s.ReleaseDate, to);
      ranked.push({song: s, counts: c});
    });
    ranked.sort(function (a, b) { return b.counts.total - a.counts.total || (a.song.Title < b.song.Title ? -1 : 1); });
    return {ranked: ranked, pending: pending};
  }

  // 1曲の発売後の内訳。windows ごとに {days, counts, complete}
  function bsSongWindows(song, exposure, windows, dataEnd) {
    if (!song.ReleaseDate) return [];
    return windows.map(function (days) {
      const to = bsAddDays(song.ReleaseDate, days - 1);
      return {days: days, counts: bsExposureCount(exposure, song.ReleaseDate, to > dataEnd ? dataEnd : to), complete: to <= dataEnd};
    });
  }

  // 長期：TVとライブの披露件数を、発売1年目（発売日〜+364日）と2年目以降で比べる。2年目以降がまだ来ていない曲は入れない
  function bsLongTerm(songs, exposures, dataEnd) {
    const rows = [];
    songs.forEach(function (s) {
      if (!s.ReleaseDate) return;
      const secondStart = bsAddDays(s.ReleaseDate, 365);
      if (secondStart > dataEnd) return;
      const exp = exposures[String(s.SongID)];
      const first = bsExposureCount(exp, s.ReleaseDate, bsAddDays(s.ReleaseDate, 364));
      const later = bsExposureCount(exp, secondStart, dataEnd);
      rows.push({song: s, first: first.tv + first.live, later: later.tv + later.live});
    });
    return rows.sort(function (a, b) { return (b.first + b.later) - (a.first + a.later) || (a.song.Title < b.song.Title ? -1 : 1); });
  }

  // 選曲：TVとライブの組み合わせ（全期間）。{both, liveOnly, tvOnly, none} それぞれ曲の配列
  function bsSelectionBuckets(songs, exposures) {
    const out = {both: [], liveOnly: [], tvOnly: [], none: []};
    songs.forEach(function (s) {
      const e = exposures[String(s.SongID)], tv = e.tv.length > 0, live = e.live.length > 0;
      (tv && live ? out.both : live ? out.liveOnly : tv ? out.tvOnly : out.none).push(s);
    });
    return out;
  }
</script>
