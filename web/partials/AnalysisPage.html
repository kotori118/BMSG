<template id="analysisPageTemplate">
  <section class="view analysis-page">
    <header class="analysis-header">
      <button class="ui-back" type="button" onclick="navigateTo('data')" aria-label="データへ戻る"><svg class="ui-back-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg><span class="ui-back-label">DATA</span></button>
      <div>
        <h1 class="analysis-title">ANALYSIS</h1>
      </div>
    </header>

    <nav class="analysis-local-nav" aria-label="Analysis navigation">
      <button type="button" class="analysis-tab active" data-analysis-view="top" onclick="selectAnalysisView('top')">トップ</button>
      <button type="button" class="analysis-tab" data-analysis-view="member" onclick="selectAnalysisView('member')">メンバー</button>
      <button type="button" class="analysis-tab" data-analysis-view="song" onclick="selectAnalysisView('song')">楽曲</button>
      <button type="button" class="analysis-tab" data-analysis-view="timeline" onclick="selectAnalysisView('timeline')">時系列</button>
      <button type="button" class="analysis-tab" data-analysis-view="other" onclick="selectAnalysisView('other')">その他</button>
    </nav>

    <div id="analysisPanel" class="analysis-panel" aria-live="polite"></div>
  </section>
</template>
