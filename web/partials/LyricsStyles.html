<style>
  .lyrics-page{
    box-sizing:border-box;min-height:100%;padding:82px 0 72px;color:var(--ui-text);
    background:var(--ui-panel);font-family:var(--font-body),var(--font-body),sans-serif;
  }
  .lyrics-page-head,.lyrics-view{width:min(100%,820px);margin-inline:auto}
  .lyrics-page-head{margin-bottom:28px}
  .lyrics-page-head p,.lyrics-label,.lyrics-subhead p{
    margin:0 0 6px;color:var(--ui-text);font:600 10px var(--font-body),var(--font-body),var(--font-body),sans-serif;letter-spacing:.18em
  }
  .lyrics-page-head h1{margin:0;color:var(--ui-text);font:600 clamp(40px,8vw,68px)/.95 var(--font-display),var(--font-body),sans-serif;letter-spacing:.025em}
  .lyrics-loading,.lyrics-empty{padding:48px 0;text-align:center;color:var(--ui-text);font:600 11px var(--font-body),var(--font-body),sans-serif;letter-spacing:.14em}

  .lyrics-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lyrics-song-list{display:grid;gap:7px}
  .lyrics-song-card,.lyrics-gacha-card{
    box-sizing:border-box;width:100%;border:1px solid var(--ui-line);border-radius:var(--ui-radius);
    color:var(--ui-text);background:var(--ui-panel);box-shadow:none;cursor:pointer;-webkit-tap-highlight-color:transparent
  }
  .lyrics-group-card{
    position:relative;isolation:isolate;box-sizing:border-box;width:100%;min-width:0;min-height:94px;overflow:hidden;
    padding:16px;border:1px solid color-mix(in srgb,var(--lyrics-group-accent,var(--ui-line)) 38%,var(--ui-line));border-radius:var(--ui-radius);
    color:var(--ui-text);background:var(--ui-panel);
    text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent
  }
  .lyrics-group-card::after{content:'';position:absolute;z-index:-1;width:76px;height:76px;right:-28px;bottom:-30px;border-radius:50%;background:transparent;pointer-events:none}
  .lyrics-group-card strong,.lyrics-gacha-card strong{display:block;font:600 21px var(--font-display),var(--font-body),sans-serif;letter-spacing:.01em}
  .lyrics-group-card strong{position:relative;z-index:1;color:var(--ui-text);font-size:16px;line-height:1.2;overflow-wrap:anywhere}
  .lyrics-group-card span,.lyrics-gacha-card span{display:block;margin-top:6px;color:var(--ui-text);font:600 9px var(--font-body),var(--font-body),sans-serif;letter-spacing:.13em}
  .lyrics-group-card span{position:relative;z-index:1}
  .lyrics-group-card:last-child:nth-child(odd){grid-column:1}
  .lyrics-group-card:not(:disabled):active{background:var(--ui-panel);filter:none}
  @media(hover:hover){.lyrics-group-card:not(:disabled):hover{background:var(--ui-panel);filter:none}}
  .lyrics-gacha-card{min-height:86px;margin-top:28px;padding:20px;text-align:left;opacity:.55}

  .lyrics-subhead-back{box-sizing:border-box;width:100%;min-height:50px;padding:0 14px;white-space:nowrap;font:600 12px var(--font-body),sans-serif}
  .lyrics-group-head{display:grid;gap:16px;margin:0 0 24px}
  .lyrics-group-head h2{margin:0;text-align:center;color:var(--ui-text);font:600 clamp(28px,5vw,38px)/1.1 var(--font-display),var(--font-body),sans-serif;overflow-wrap:anywhere}
  .lyrics-group-head-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .lyrics-group-head-actions .lyrics-subhead-back,
  .lyrics-group-head-actions .lyrics-latest-shortcut{width:100%;min-width:0;min-height:50px;margin:0;padding:0 10px;font:600 11px var(--font-body),sans-serif}
  .lyrics-group-head-actions .lyrics-latest-shortcut{position:static}
  .lyrics-page:has(.lyrics-group-head) .lyrics-page-head{display:none}
  .lyrics-search{
    box-sizing:border-box;width:100%;height:54px;padding:0 17px;border:1px solid var(--ui-line);
    border-radius:var(--ui-radius);outline:0;color:var(--ui-text);background:var(--ui-panel);font:500 15px var(--font-body),var(--font-body),sans-serif
  }
  .lyrics-count{margin:24px 2px 12px;color:var(--ui-text);font:600 10px var(--font-body),var(--font-body),sans-serif;letter-spacing:.14em}
  .lyrics-song-card{position:relative;display:block;min-height:56px;padding:15px 42px 15px 17px;text-align:left}
  .lyrics-song-card strong{font:600 15px var(--font-body),var(--font-body),sans-serif}
  .lyrics-song-card span{color:var(--ui-text);font-size:11px}
  .lyrics-song-card b{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--ui-text-sub);font-size:24px}

  .lyrics-page:has(.lyrics-song-title){padding-top:82px;background:var(--ui-panel)}
  .lyrics-page:has(.lyrics-song-title) .lyrics-page-head{display:flex}
  .lyrics-view:has(.lyrics-song-title){box-sizing:border-box;padding:0 4px;background:var(--ui-panel)}
  .lyrics-song-title{padding:0 0 18px;margin:0 0 18px;text-align:center;border-bottom:1px solid var(--ui-line)}
  .lyrics-song-title h2{margin:0;color:var(--ui-text);font:600 clamp(25px,5.5vw,34px)/1.2 var(--font-display),var(--font-body),sans-serif}
  .lyrics-list-back{
    width:auto;min-height:46px;margin:0 0 36px;padding:0 17px;
    font:600 12px var(--font-body),sans-serif;cursor:pointer
  }
  .lyrics-parts{display:block;width:100%;background:transparent}
  .lyrics-part{
    position:relative;box-sizing:border-box;display:block;width:100%;margin:0 0 30px;padding:0;
    text-align:left;border:0;color:var(--ui-text);background:transparent
  }
  .lyrics-singer{font:700 15px var(--font-body),var(--font-body),var(--font-body),sans-serif;letter-spacing:.01em}
  .lyrics-singer-separator{color:var(--ui-text)}
  .lyrics-part p{margin:8px 0 0;font:400 18px/1.9 var(--font-body),sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
  .lyrics-part small{display:none}
  .lyrics-parts.is-editing{display:grid;gap:0}
  .lyrics-parts.is-editing .lyrics-part{margin:0;padding:13px;border:1px dashed var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-panel)}
  .lyrics-edit-part-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .lyrics-edit-part-head>span{color:var(--ui-text);font:700 10px var(--font-body),var(--font-body),sans-serif;letter-spacing:.1em}
  .lyrics-edit-part-head>div{display:flex;gap:6px}
  .lyrics-edit-part-head .ui-btn{width:38px;height:38px;min-width:38px;min-height:38px;padding:0;border-radius:var(--ui-radius)}
  .lyrics-edit-part-body{box-sizing:border-box;display:block;width:100%;padding:0;border:0;color:var(--ui-text);background:transparent;text-align:left}
  .lyrics-edit-part-body p{margin:8px 0 0}
  .lyrics-edit-part-body small{display:block!important;margin-top:10px;color:var(--ui-text);font:700 10px var(--font-body),sans-serif}
  .lyrics-part-insert{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;margin:9px 0;padding:0 14px;border-radius:var(--ui-radius)}
  .lyrics-part-insert span{font-size:20px;line-height:1}.lyrics-part-insert b{font:700 11px var(--font-body),sans-serif}
  .lyrics-edit-save{display:flex;justify-content:stretch;margin:24px 0 30px}
  .lyrics-edit-save-button{width:100%;min-height:52px;font:700 13px var(--font-body),sans-serif}

  .lyrics-editor[hidden]{display:none}
  .lyrics-editor{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:rgba(0, 0, 0, .6)}
  .lyrics-editor-card{position:relative;box-sizing:border-box;width:min(600px,100%);max-height:88dvh;overflow:auto;padding:24px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);color:var(--ui-text);background:var(--ui-panel)}
  .lyrics-editor-card h2{margin:0 0 20px;font:600 25px var(--font-display),var(--font-body),sans-serif}
  .lyrics-editor-card label{display:grid;gap:7px;margin:13px 0;font-size:13px;font-weight:700}
  .lyrics-editor-card input,.lyrics-editor-card textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);font:400 16px var(--font-body),var(--font-body),sans-serif}
  .lyrics-editor-close{position:absolute;right:14px;top:12px;width:40px;height:40px;border:1px solid var(--ui-line);border-radius:50%;color:var(--ui-text);background:var(--ui-panel);font-size:23px}
  .lyrics-editor-actions{display:flex;justify-content:flex-end;gap:9px}
  .lyrics-editor-actions button{min-height:44px;padding:0 15px;border:0;border-radius:var(--ui-radius);background:var(--ui-panel)}
  .lyrics-editor-actions button:last-child{color:var(--ui-active-text);background:var(--ui-active-bg)}
  .lyrics-editor-actions button:disabled{opacity:.4}

  @media(max-width:720px){
    .lyrics-page{padding:76px 0 68px}
    .lyrics-page:has(.lyrics-song-title){padding-top:76px}
    .lyrics-group-card{min-height:86px}
    .lyrics-view:has(.lyrics-song-title){padding:0}
    .lyrics-song-title{margin-bottom:16px}
    .lyrics-list-back{margin-bottom:30px}
    .lyrics-part{margin-bottom:28px}
    .lyrics-part p{font-size:17px;line-height:1.85}
  }

  .lyrics-karaoke-entry{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:66px;margin-bottom:18px;padding:0 18px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);color:var(--ui-text);background:var(--ui-panel);text-align:left;-webkit-tap-highlight-color:transparent}
  .lyrics-karaoke-entry strong{font:600 17px var(--font-display),var(--font-body),sans-serif}
  .lyrics-karaoke-entry span{color:var(--ui-text);font:600 9px var(--font-body),var(--font-body),sans-serif;letter-spacing:.12em}
  .lyrics-room-card{box-sizing:border-box;width:100%;margin:0 0 22px;padding:24px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);color:var(--ui-text);background:var(--ui-panel)}
  .lyrics-room-card>p{margin:0 0 8px;color:var(--ui-text);font:600 10px var(--font-body),var(--font-body),sans-serif;letter-spacing:.17em}
  .lyrics-room-card>h2{margin:0 0 20px;font:600 21px var(--font-display),var(--font-body),sans-serif}
  .lyrics-room-card.is-loading>strong{font:600 15px var(--font-body),sans-serif}
  .lyrics-room-id{display:flex;align-items:baseline;justify-content:space-between;margin:-2px 0 18px;padding:14px 0;border-top:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line)}
  .lyrics-room-id span{color:var(--ui-text);font:600 10px var(--font-body),var(--font-body),sans-serif;letter-spacing:.15em}
  .lyrics-room-id strong{font:600 28px var(--font-display),var(--font-body),sans-serif;letter-spacing:.1em}
  .lyrics-room-primary{box-sizing:border-box;width:100%;min-height:58px;font:600 15px var(--font-body),sans-serif}
  .lyrics-room-join{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:10px;margin-top:12px}
  .lyrics-room-join input{box-sizing:border-box;min-height:50px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);color:var(--ui-text);background:var(--ui-panel);font:600 13px var(--font-body),sans-serif;width:100%;padding:0 15px;outline:0;font-size:16px;font-weight:400}
  .lyrics-room-join button,.lyrics-room-subactions button{box-sizing:border-box;min-height:50px;font:600 13px var(--font-body),sans-serif}
  .lyrics-room-subactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

  .lyrics-song-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 34px}
  .lyrics-song-actions.is-top{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1fr) minmax(0,1.38fr);gap:10px;align-items:stretch}
  .lyrics-song-actions.is-top .lyrics-list-back,
  .lyrics-song-actions.is-top .lyrics-karaoke-icon,
  .lyrics-song-actions.is-top .lyrics-group-return{box-sizing:border-box;width:100%;min-width:0;min-height:46px;margin:0;padding:0 10px}
  .lyrics-song-actions.is-top .lyrics-list-back{grid-column:1}
  .lyrics-song-actions.is-top .lyrics-karaoke-icon{grid-column:2}
  .lyrics-song-actions.is-top .lyrics-group-return{grid-column:3}
  .lyrics-song-actions.is-top .lyrics-list-back,
  .lyrics-song-actions.is-top .lyrics-group-return{font:600 10px var(--font-body),sans-serif;line-height:1.35}
  .lyrics-song-actions .lyrics-group-return{box-sizing:border-box;font:600 11px var(--font-body),sans-serif}
  .lyrics-song-actions.is-bottom{display:grid;grid-template-columns:minmax(96px,120px) minmax(0,1fr);gap:10px 12px;align-items:stretch;margin:14px 0 0}
  .lyrics-song-actions.is-bottom .lyrics-karaoke-icon{grid-column:1/-1;grid-row:1;width:100%;min-height:64px;padding:0 20px;font-size:11px;letter-spacing:.14em}
  .lyrics-song-actions.is-bottom .lyrics-group-return{grid-column:2;grid-row:2;width:100%;min-height:44px;padding:0 14px}
  .lyrics-song-actions.is-bottom:not(:has(.universe-lyrics-analysis-link)) .lyrics-group-return{grid-column:1/-1}
  .lyrics-karaoke-icon{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 16px;font:600 9px var(--font-body),var(--font-body),sans-serif;letter-spacing:.12em}
  .lyrics-karaoke-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .lyrics-song-actions.is-bottom .lyrics-karaoke-icon svg{width:22px;height:22px}

  .lyrics-room-card.is-active{padding:18px}
  .lyrics-room-card.is-active .lyrics-room-id{margin:0 0 12px;padding:0 0 13px;border-top:0}
  .lyrics-room-card.is-active .lyrics-room-primary{min-height:50px}

  .lyrics-room-card>p{font-size:12px}
  .lyrics-room-id span{font-size:12px}
  .lyrics-allstars-groups{display:grid;gap:30px}
  .lyrics-allstars-section h3{margin:0 2px 11px;color:var(--ui-text);font:600 17px var(--font-display),var(--font-body),sans-serif;letter-spacing:.01em}
  .lyrics-allstars-section h3{padding-left:12px;border-left:3px solid currentColor}
  .lyrics-allstars-section h3.is-posse{-webkit-text-stroke:.7px #111;paint-order:stroke fill}
  .lyrics-allstars-section h3,.lyrics-allstars-section h3.is-posse{color:var(--ui-text);-webkit-text-stroke:0;paint-order:normal}
  .lyrics-editor-actions button{color:var(--ui-text)}
  .lyrics-room-card{border-color:var(--ui-line);background:var(--ui-panel)}
  .lyrics-room-card>p,.lyrics-room-id span{color:var(--ui-text)}
  .lyrics-room-id{border-color:var(--ui-line)}
  .lyrics-room-join input:focus{border-color:var(--ui-line-strong)}
  /* LYRICS initial skeleton mirrors the real first-view layout; shimmer stays shared in StateUI. */
  .lyrics-view .lyrics-loading.is-page-layout{
    display:grid!important;min-height:0;padding:0;overflow:visible;border-radius:0;
    gap:0;color:inherit;background:none;box-shadow:none;text-align:left;font:inherit;letter-spacing:normal
  }
  .lyrics-view .lyrics-loading.is-page-layout> *{visibility:visible}
  .lyrics-view .lyrics-loading.is-page-layout::before,.lyrics-view .lyrics-loading.is-page-layout::after{display:none!important;content:none}

  /* When the catalog is already available, only KARAOKE ROOM waits. Mirror that room instead of showing a spinner. */
  .lyrics-room-card.is-loading{
    position:relative;display:block!important;min-height:198px;overflow:hidden;place-items:initial
  }
  .lyrics-room-card.is-loading .universe-loading{display:none!important}
  .lyrics-room-card.is-loading::before{
    content:"";position:absolute;inset:24px;
    background:
      linear-gradient(var(--u-skeleton-base),var(--u-skeleton-base)) 0 0/31% 12px no-repeat,
      linear-gradient(var(--u-skeleton-base),var(--u-skeleton-base)) 0 30px/100% 58px no-repeat,
      linear-gradient(var(--u-skeleton-base),var(--u-skeleton-base)) 0 100px/calc(100% - 96px) 50px no-repeat,
      linear-gradient(var(--u-skeleton-base),var(--u-skeleton-base)) 100% 100px/86px 50px no-repeat;
  }
  .lyrics-room-card.is-loading::after{
    content:"";position:absolute;inset:0;transform:translateX(-115%);pointer-events:none;
    background:transparent;
    animation:universeSkeletonSweep 1.45s ease-in-out infinite
  }</style>
