<template id="lyricsPageTemplate">
  <section class="lyrics-page lyx-page">
    <header class="lyx-page-head">
      <h1 class="ui-title">LYRICS</h1>
    </header>
    <main id="lyricsView" class="lyrics-view">
      <section class="lyx-room is-loading" aria-hidden="true"><div class="lyx-skel"></div></section>
      <section class="lyx-groups" aria-hidden="true"><div class="lyx-group lyx-skel"></div><div class="lyx-group lyx-skel"></div><div class="lyx-group lyx-skel"></div><div class="lyx-group lyx-skel"></div><div class="lyx-group lyx-skel"></div></section>
    </main>
  </section>
  <div id="lyricsEditor" class="lyrics-editor" hidden>
    <section class="lyrics-editor-card" role="dialog" aria-modal="true">
      <button class="lyrics-editor-close" type="button" onclick="closeLyricsEditor()">×</button>
      <p class="lyrics-label">パート編集</p><h2>歌詞を編集</h2>
      <label>歌唱者<div id="lyricsSingerEditor"></div></label>
      <label>歌詞<textarea id="lyricsTextInput" rows="6"></textarea></label>
      <div class="lyrics-editor-actions"><button id="lyricsSaveButton" type="button" onclick="saveLyricsEdit()">反映</button></div>
    </section>
  </div>
</template>
