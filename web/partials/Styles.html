<style>
  /* =========================================================
     BMSG UNIVERSE 土台（全画面共通）
     画面の枠・上のバー・下のメニュー・左のメニュー・検索・設定・通知の置き場所。
     色・書体・大きさは UniverseTokens.html のトークンだけを使う。
     部品（ボタン・入力欄・見出しなど）は UniverseTheme.html。
     ========================================================= */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ui-bg);
  }
  body {
    width: 100%;
    height: 100%;
    min-width: 320px;
    min-height: 100dvh;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    letter-spacing: var(--ui-ls-body);
  }

  /* ---- 画面の枠 ---- */
  .app-shell {
    position: relative;
    isolation: isolate;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--ui-bg);
  }
  .page-wrap {
    position: relative;
    width: min(100%, var(--ui-page-max));
    height: 100dvh;
    margin: 0 auto;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
    padding: max(24px, env(safe-area-inset-top)) clamp(16px, 4vw, 34px) calc(var(--ui-nav-h) + 34px + env(safe-area-inset-bottom));
    color: var(--ui-text);
  }
  body.nav-hidden .page-wrap { padding-bottom: max(30px, env(safe-area-inset-bottom)); }
  .page-content { min-height: calc(100dvh - var(--ui-nav-h) - 58px); }
  .view { animation: ui-view-in 260ms var(--ui-ease); }
  @keyframes ui-view-in { from { opacity: .55; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* ---- 上のバー（メニュー・サイト名・検索） ---- */
  .utility-actions {
    position: absolute;
    inset: 0 0 auto;
    z-index: 40;
    min-height: var(--ui-bar-h);
    padding: max(14px, env(safe-area-inset-top)) max(18px, calc((100vw - min(100vw, var(--ui-page-max))) / 2 + 18px)) 12px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    border-bottom: 1px solid var(--ui-line);
    background: var(--ui-bar-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .utility-menu { margin-right: auto; }
  .utility-brand {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    color: var(--ui-text);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-body);
    font-weight: 900;
    letter-spacing: .02em;
    white-space: nowrap;
    pointer-events: none;
  }
  .utility-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text);
    cursor: pointer;
  }
  .utility-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) { .utility-btn:hover { background: var(--ui-panel-2); } }
  /* ホームと設定は左のメニューにあるので、上のバーには出さない */
  .utility-actions :is(.utility-home, .utility-settings) { display: none; }

  /* ---- 下のメニュー（HOME・DATA・LAB）：選択中は塗る ---- */
  .bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 0;
    z-index: 20;
    width: min(100%, var(--ui-page-max));
    height: calc(var(--ui-nav-h) + env(safe-area-inset-bottom));
    padding: 8px clamp(14px, 4vw, 28px) calc(8px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    border-top: 1px solid var(--ui-line);
    background: var(--ui-bar-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  body.nav-hidden .bottom-nav { display: none; }
  .nav-btn {
    min-width: 44px;
    min-height: 44px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 3px;
    border: 0;
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    cursor: pointer;
  }
  .nav-btn.active { color: var(--ui-active-text); background: var(--ui-active-bg); }
  .nav-icon { display: block; width: 22px; height: 22px; }
  .nav-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav-label { display: block; }

  /* ---- 左のメニュー ---- */
  .app-menu { position: fixed; inset: 0; z-index: 150; }
  .app-menu[hidden] { display: none; }
  .app-menu-backdrop { position: absolute; inset: 0; background: var(--ui-scrim); }
  .app-menu-panel {
    position: absolute;
    top: 0;
    bottom: 0;

    border-right: 1px solid var(--ui-line);
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: var(--ui-font);
    animation: app-menu-in 220ms var(--ui-ease);

  @keyframes app-menu-in { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .app-menu-panel .app-menu-close {
    display: grid;
    place-items: center;
    width: 48px;
    min-height: 48px;
    margin: 0 10px 8px auto;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ui-text);
    cursor: pointer;
  }
  .app-menu-close svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .app-menu-group { margin: 24px 22px 8px; color: var(--ui-text-sub); font-size: var(--ui-fs-label); font-weight: 700; letter-spacing: var(--ui-ls-label); }
  .app-menu-panel button:not(.app-menu-close) {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 54px;
    padding: 0 44px 0 22px;
    border: 0;
    border-top: 1px solid var(--ui-line);
    background: none;
    color: inherit;
    font: inherit;
    font-size: var(--ui-fs-body);
    font-weight: 700;
    letter-spacing: var(--ui-ls-body);
    text-align: left;
    cursor: pointer;
  }
  .app-menu-panel button:not(.app-menu-close)::after {
    content: "";
    position: absolute;
    right: 22px;
    width: 8px;
    height: 8px;
    border-top: 1.5px solid var(--ui-text-sub);
    border-right: 1.5px solid var(--ui-text-sub);
    transform: rotate(45deg);
  }
  .app-menu-panel button:not(.app-menu-close):hover,
  .app-menu-panel button:not(.app-menu-close):focus-visible { background: var(--ui-panel-2); outline: none; }
  .app-menu-panel button[aria-current="page"] { background: var(--ui-active-bg); color: var(--ui-active-text); }
  .app-menu-panel button[aria-current="page"]::after { border-color: var(--ui-active-text); }
  .app-menu-panel button[aria-current="page"]:disabled { opacity: 1; }

  /* ---- 全画面の重ね表示（検索） ---- */
  .screen-overlay {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: none;
    overflow-y: auto;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    background: var(--ui-bg);
    color: var(--ui-text);
  }
  .screen-overlay.open { display: block; animation: ui-overlay-in 180ms var(--ui-ease); }
  @keyframes ui-overlay-in { from { opacity: 0; } to { opacity: 1; } }
  .overlay-inner { width: min(100%, 760px); margin: 0 auto; }
  .overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .overlay-title, .modal-title {
    margin: 0;
    color: var(--ui-text);
    font-family: var(--ui-font-display);
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 900;
    letter-spacing: -.035em;
    line-height: .95;
    text-transform: uppercase;
  }
  .overlay-close {
    width: var(--ui-button-h);
    height: var(--ui-button-h);
    flex: none;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  /* 検索 */
  .universe-search-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .search-field {
    min-height: var(--ui-button-h);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: var(--ui-field-bg);
  }
  .search-field:focus-within { border-color: var(--ui-text); background: var(--ui-field-focus); }
  .search-field svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--ui-text-sub); stroke-width: 1.7; stroke-linecap: round; }
  .search-input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-family: var(--ui-font); font-size: var(--ui-fs-body); }
  .search-input::placeholder { color: var(--ui-text-sub); }
  .universe-search-submit {
    min-height: var(--ui-button-h);
    padding: 0 18px;
    border: 1px solid var(--ui-active-bg);
    border-radius: var(--ui-radius);
    background: var(--ui-active-bg);
    color: var(--ui-active-text);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    cursor: pointer;
  }
  .search-status, .page-directory-label {
    margin: 28px 2px 12px;
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
  }
  .search-results { display: grid; border-top: 1px solid var(--ui-line); }
  .search-result {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    min-height: var(--ui-row-h);
    padding: 14px 32px 14px 4px;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    border-radius: 0;
    background: transparent;
    color: var(--ui-text);
    text-align: left;
    cursor: pointer;
  }
  .search-result::after {
    content: "";
    position: absolute;
    right: 10px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-top: 1.5px solid var(--ui-text-sub);
    border-right: 1.5px solid var(--ui-text-sub);
    transform: translateY(-50%) rotate(45deg);
  }
  @media (hover: hover) { .search-result:hover { background: var(--ui-panel); } }
  .search-result-parent {
    display: block;
    margin-bottom: 4px;
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    text-transform: uppercase;
  }
  .search-result-name { font-size: var(--ui-fs-heading); font-weight: 700; letter-spacing: var(--ui-ls-heading); }

  /* ---- 上に出る窓（設定・ユーザー・推しメン選択など） ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: max(62px, calc(env(safe-area-inset-top) + 30px)) 16px max(28px, env(safe-area-inset-bottom));
    background: var(--ui-scrim);
  }
  .modal-overlay.open { display: flex; animation: ui-overlay-in 180ms var(--ui-ease); }
  .settings-panel {
    width: min(100%, 560px);
    max-height: 80dvh;
    overflow-y: auto;
    padding: 22px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: var(--ui-bg);
    color: var(--ui-text);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .modal-title { font-size: clamp(30px, 8vw, 40px); }
  .settings-eyebrow { margin: 0 0 6px; color: var(--ui-text-sub); font-family: var(--ui-font-display); font-size: var(--ui-fs-label); font-weight: 800; letter-spacing: var(--ui-ls-label); }
  .settings-group { margin-top: 22px; }
  .settings-section-title, .user-chooser-copy {
    margin: 0 2px 8px;
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
  }
  .settings-row {
    width: 100%;
    min-height: var(--ui-row-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 4px;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    background: transparent;
    color: var(--ui-text);
    text-align: left;
    font: inherit;
  }
  .settings-row-button { cursor: pointer; }
  @media (hover: hover) { .settings-row-button:hover { background: var(--ui-panel); } }
  .settings-row-button.is-disabled { opacity: .5; }
  .settings-row-copy { display: grid; gap: 4px; min-width: 0; }
  .settings-row-copy strong { font-size: var(--ui-fs-body); font-weight: 700; }
  .settings-row-copy small { color: var(--ui-text-sub); font-size: var(--ui-fs-body-sm); }
  .settings-value-with-arrow { display: flex; align-items: center; gap: 10px; min-width: 0; margin-left: 12px; }
  .settings-value-with-arrow b { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ui-text); font-size: var(--ui-fs-body-sm); font-weight: 700; }
  .settings-arrow { color: var(--ui-text-sub); font-size: 24px; line-height: 1; }
  .settings-action {
    min-height: 40px;
    padding: 0 16px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    cursor: pointer;
  }
  .settings-switch {
    flex: none;
    display: grid;
    place-items: center;
    min-width: 52px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--ui-line-strong);
    border-radius: 999px;
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: .12em;
  }
  .settings-switch.active { border-color: var(--ui-active-bg); background: var(--ui-active-bg); color: var(--ui-active-text); }

  /* ユーザー・推しメンを選ぶ一覧（設定から開く） */
  .user-chooser-overlay, .favorite-member-chooser-overlay { z-index: 1200; }
  .user-chooser-overlay.is-required #userChooserClose { display: none; }
  .user-chooser-list, .favorite-member-chooser-list { display: grid; border-top: 1px solid var(--ui-line); }
  .favorite-member-chooser-panel { display: flex; flex-direction: column; max-height: min(82vh, 760px); }
  .favorite-member-chooser-list { overflow: auto; }
  .user-choice, .favorite-member-choice {
    width: 100%;
    min-height: var(--ui-row-h);
    display: grid;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    background: transparent;
    color: var(--ui-text);
    text-align: left;
    cursor: pointer;
  }
  .user-choice { grid-template-columns: 54px 1fr 24px; }
  .favorite-member-choice { grid-template-columns: 6px minmax(0, 1fr) 22px; }
  .user-choice span { color: var(--ui-text-sub); font-family: var(--ui-font-display); font-size: var(--ui-fs-label); font-weight: 800; letter-spacing: .12em; }
  .user-choice strong, .favorite-member-choice strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--ui-fs-body); font-weight: 700; }
  .user-choice b, .favorite-member-choice > b { color: var(--ui-text-sub); font-size: 24px; font-weight: 400; line-height: 1; text-align: right; }
  .favorite-member-choice > i { width: 4px; height: 32px; border-radius: 2px; background: var(--favorite-member-color, var(--ui-text)); }
  .favorite-member-choice > span { display: grid; gap: 3px; min-width: 0; }
  .favorite-member-choice small { color: var(--ui-text-sub); font-size: var(--ui-fs-label); letter-spacing: .1em; }
  .user-choice.is-current, .favorite-member-choice.is-current { background: var(--ui-panel); }
  .user-choice.is-current strong, .favorite-member-choice.is-current strong { text-decoration: underline; text-underline-offset: 4px; }

  /* ---- 通知の置き場所 ---- */
  .toast-region {
    position: fixed;
    left: 50%;
    bottom: calc(var(--ui-nav-h) + 22px + env(safe-area-inset-bottom));
    z-index: 130;

    transform: translateX(-50%);

  }
  body.nav-hidden .toast-region { bottom: calc(24px + env(safe-area-inset-bottom)); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
