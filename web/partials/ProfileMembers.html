<script>
  let profileMembersState = {
    status: 'idle', groups: [], members: [], error: '',
    detailStatus: 'idle', detailMemberId: '', detailFields: [], detailError: ''
  };

  function loadProfileMembers(forceReload = false) {
    if (!forceReload && (profileMembersState.status === 'loading' || profileMembersState.status === 'ready')) {
      renderProfileMembersPanel(); return;
    }

    profileMembersState.status = 'loading'; profileMembersState.error = '';
    renderProfilePanel();
    google.script.run.withSuccessHandler(handleProfileMembersSuccess)
      .withFailureHandler(handleProfileMembersFailure).getProfileMembers();
  }

  function handleProfileMembersSuccess(response) {
    if (!response || !response.ok || !response.data) {
      handleProfileMembersFailure(response && response.error ? response.error.message : 'プロフィールの読み込みに失敗しました。');
      return;
    }
    profileMembersState.status = 'ready';
    profileMembersState.groups = Array.isArray(response.data.groups) ? response.data.groups : [];
    profileMembersState.members = Array.isArray(response.data.members) ? response.data.members : [];
    profileMembersState.error = '';
    renderProfilePanel();
    if (typeof syncUniverseCrossLinks === 'function') syncUniverseCrossLinks();
  }

  function handleProfileMembersFailure(error) {
    profileMembersState.status = 'error';
    profileMembersState.error = error && error.message ? error.message : String(error || 'プロフィールの読み込みに失敗しました。');
    renderProfileMembersPanel();
  }

  function getVisibleProfileMembers() {
    const members = profileMembersState.members.slice();
    return members.sort((a, b) => a.displayOrder - b.displayOrder);
  }


  function renderProfileMembersPanel() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'home') return;
    if (profileMembersState.status === 'loading' || profileMembersState.status === 'idle') {
      panel.innerHTML = renderProfileMemberSkeletons(); return;
    }
    if (profileMembersState.status === 'error') {
      panel.innerHTML = `<article class="ui-panel profile-members-state"><p class="profile-panel-eyebrow">CONNECTION ERROR</p><h2 class="ui-heading profile-members-state-title">ERROR</h2><p class="profile-panel-copy">${escapeHtml(profileMembersState.error)}</p><button class="profile-retry-button" type="button" onclick="loadProfileMembers(true)">再試行</button></article>`;
      return;
    }
    const members = getVisibleProfileMembers();
    if (!members.length) {
      panel.innerHTML = `<article class="ui-panel profile-members-state"><p class="profile-panel-eyebrow">PROFILE HOME</p><h2 class="ui-heading profile-members-state-title">NO DATA</h2><p class="profile-panel-copy">表示できるメンバーがいません。</p></article>`;
      return;
    }
    panel.innerHTML = `<div class="ui-divider profile-members-head"><div><p class="profile-panel-eyebrow">PROFILE HOME</p><h2 class="ui-title ui-title-sm profile-members-title">MEMBERS</h2></div><span class="ui-muted profile-members-count">${members.length}</span></div><div class="profile-member-grid">${members.map(renderProfileMemberCard).join('')}</div>`;
  }

  function renderProfileMemberCard(member) {
    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '') ? member.colorHex : '#9cecff';
    const image = member.imageUrl ? `<img src="${escapeHtml(member.imageUrl)}" data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleProfileImageError(this)">` : '';
    return `<article class="ui-card profile-member-card" style="--member-accent:${escapeHtml(accent)}" role="button" tabindex="0" data-member-id="${escapeHtml(member.memberId)}" aria-label="${escapeHtml(member.displayName)}のプロフィールを開く" onclick="openProfileMemberDetail(this.dataset.memberId)" onkeydown="handleProfileMemberCardKey(event, this.dataset.memberId)"><div class="ui-media profile-member-visual">${image}<span class="profile-member-accent" aria-hidden="true"></span></div><div class="profile-member-body"><p class="ui-label profile-member-group">${escapeHtml(member.primaryGroupName || 'SOLO')}</p><h3 class="ui-name profile-member-name">${escapeHtml(member.displayName)}</h3></div></article>`;
  }

  function handleProfileMemberCardKey(event, memberId) {
    if (!event || (event.key !== 'Enter' && event.key !== ' ')) return;
    event.preventDefault(); openProfileMemberDetail(memberId);
  }

  function openProfileMemberDetail(memberId) {
    const member = profileMembersState.members.find(item => item.memberId === memberId);
    if (!member) return;
    profileDetailReturnView = profileCurrentView;
    profileSelectedMemberId = memberId;
    profileMembersState.detailStatus = 'loading';
    profileMembersState.detailMemberId = memberId;
    profileMembersState.detailFields = [];
    profileMembersState.detailError = '';
    setProfileDetailMode(true); renderProfileMemberDetail();
    scrollAppToTop('smooth');
    google.script.run.withSuccessHandler(response => handleProfileMemberDetailSuccess(memberId, response))
      .withFailureHandler(error => handleProfileMemberDetailFailure(memberId, error))
      .getProfileMemberDetail(memberId);
  }

  function handleProfileMemberDetailSuccess(memberId, response) {
    if (profileSelectedMemberId !== memberId) return;
    if (!response || !response.ok || !response.data) {
      handleProfileMemberDetailFailure(memberId, response && response.error ? response.error.message : 'プロフィール詳細の読み込みに失敗しました。'); return;
    }
    profileMembersState.detailStatus = 'ready';
    profileMembersState.detailFields = Array.isArray(response.data.fields) ? response.data.fields : [];
    profileMembersState.detailError = '';
    renderProfileMemberDetail();
  }

  function handleProfileMemberDetailFailure(memberId, error) {
    if (profileSelectedMemberId !== memberId) return;
    profileMembersState.detailStatus = 'error';
    profileMembersState.detailError = error && error.message ? error.message : String(error || 'プロフィール詳細の読み込みに失敗しました。');
    renderProfileMemberDetail();
  }

  function closeProfileMemberDetail() {
    profileSelectedMemberId = '';
    profileMembersState.detailStatus = 'idle';
    profileMembersState.detailMemberId = '';
    profileMembersState.detailFields = [];
    profileMembersState.detailError = '';
    setProfileDetailMode(false);
    profileCurrentView = profileDetailReturnView || 'home';
    profileDetailReturnView = 'home';
    updateProfileControls();
    renderProfilePanel();
    scrollAppToTop('smooth');
  }

  function renderProfileMemberDetail() {
    const panel = document.getElementById('profilePanel');
    if (!panel) return;
    const member = profileMembersState.members.find(item => item.memberId === profileSelectedMemberId);
    if (!member) { closeProfileMemberDetail(); return; }
    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '') ? member.colorHex : '#9cecff';
    const image = member.imageUrl ? `<img src="${escapeHtml(member.imageUrl)}" data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}" alt="${escapeHtml(member.displayName)}" decoding="async" referrerpolicy="no-referrer" onerror="handleProfileImageError(this)">` : '';
    panel.innerHTML = `<article class="profile-member-detail" style="--member-accent:${escapeHtml(accent)}"><button class="ui-back" type="button" aria-label="メンバー一覧へ戻る" onclick="closeProfileMemberDetail()"><svg class="ui-back-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg><span class="ui-back-label">BACK</span></button><div class="ui-panel profile-detail-hero"><div class="ui-media profile-detail-visual">${image}<span class="profile-detail-line" aria-hidden="true"></span></div><div class="profile-detail-identity"><p class="ui-label profile-detail-group">${escapeHtml(member.primaryGroupName || 'SOLO')}</p><h2 class="ui-name ui-name-lg profile-detail-name">${escapeHtml(member.displayName)}</h2></div></div>${renderProfileDetailContent()}</article>`;
    if (typeof syncUniverseCrossLinks === 'function') syncUniverseCrossLinks();
  }

  function renderProfileDetailContent() {
    if (profileMembersState.detailStatus === 'loading') {
      const row = () => `<div class="profile-detail-row" aria-hidden="true"><dt><span class="ui-skeleton" style="display:block;width:72%;height:11px"></span></dt><dd><span class="ui-skeleton" style="display:block;width:86%;height:13px"></span></dd></div>`;
      const section = (rows) => `<section class="ui-panel profile-detail-section" aria-hidden="true"><h3 class="ui-heading profile-detail-section-title"><span class="ui-skeleton" style="display:block;width:74px;height:10px"></span></h3><dl class="ui-dl profile-detail-list">${Array.from({length:rows},row).join('')}</dl></section>`;
      return `<div class="profile-detail-sections">${section(3)}${section(2)}</div>`;
    }
    if (profileMembersState.detailStatus === 'error') return `<div class="ui-muted profile-detail-message"><p>${escapeHtml(profileMembersState.detailError)}</p><button class="profile-retry-button" type="button" onclick="openProfileMemberDetail(profileSelectedMemberId)">再試行</button></div>`;
    const fields = profileMembersState.detailFields || [];
    if (!fields.length) return `<div class="ui-muted profile-detail-message"><p>表示できるプロフィール項目がありません。</p></div>`;
    const groups = [];
    fields.forEach(field => {
      const name = String(field.displayGroup || 'PROFILE');
      let group = groups.find(item => item.name === name);
      if (!group) { group = { name, fields: [] }; groups.push(group); }
      group.fields.push(field);
    });
    return `<div class="profile-detail-sections">${groups.map(group => `<section class="ui-panel profile-detail-section"><h3 class="ui-heading profile-detail-section-title">${escapeHtml(group.name)}</h3><dl class="ui-dl profile-detail-list">${group.fields.map(field => `<div class="profile-detail-row"><dt>${escapeHtml(field.label || field.profileId)}</dt><dd>${escapeHtml(field.value || '—')}</dd></div>`).join('')}</dl></section>`).join('')}</div>`;
  }

  function handleProfileImageError(image) {
    if (!image) return;
    const fallback = image.dataset.fallbackSrc || '';
    const fallbackTried = image.dataset.fallbackTried === 'true';
    if (fallback && !fallbackTried) { image.dataset.fallbackTried = 'true'; image.src = fallback; return; }
    image.style.display = 'none';
  }

  function renderProfileMemberSkeletons() {
    return `<div class="ui-divider profile-members-head profile-members-head-loading"><div><span class="ui-skeleton profile-member-skeleton profile-member-skeleton-label"></span><span class="ui-skeleton profile-member-skeleton profile-member-skeleton-heading"></span></div></div><div class="profile-member-grid">${Array.from({ length: 6 }, () => `<div class="ui-card profile-member-card profile-member-card-loading"><div class="ui-skeleton profile-member-skeleton profile-member-skeleton-image"></div><div class="profile-member-body"><span class="ui-skeleton profile-member-skeleton profile-member-skeleton-copy"></span><span class="ui-skeleton profile-member-skeleton profile-member-skeleton-name"></span></div></div>`).join('')}</div>`;
  }
</script>
