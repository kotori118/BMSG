<style>
  .cover-group-tiles { margin-bottom: 14px; }

  .app-shell:has(#pageContent > .cover-page) .utility-actions{z-index:40}

  .cover-section-title{margin:0 0 16px}

  .cover-search{height:52px}
  .cover-page.is-cover-editor .cover-header{margin-bottom:16px}
  .cover-page .cover-member-list{grid-template-columns:1fr;gap:10px}

  .cover-dialog-actions .ui-btn{min-height:50px;padding:0 14px;justify-content:center;text-align:center}

  .cover-external-summary{display:grid;gap:4px;margin-bottom:16px;padding:14px 16px}
  .cover-external-preview{display:grid;gap:12px}
  .cover-external-part{display:grid;gap:12px;padding:15px}
  .cover-external-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

    .cover-external-form{max-width:none}
    .cover-external-part{padding:13px}
    .cover-external-actions{grid-template-columns:1fr}

  .cover-editor-head { display: grid; gap: 8px; padding-bottom: 12px; }
  .cover-toolbar { position: sticky; top: var(--ui-bar-h); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; padding: 8px 0; }
  .cover-tabs { flex: 0 1 220px; }
  .cover-tools { display: flex; flex: none; gap: 14px; }
