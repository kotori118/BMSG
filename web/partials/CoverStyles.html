<style>
  /* カバーメーカーの並べ方。見た目は部品 .ui-*、担当の色だけ data-content */
  .cover-page { min-width: 0; min-height: 100%; padding: 86px 0 96px; }
  @media (max-width: 600px) { .cover-page { padding-top: 82px; } }
  @media (min-width: 780px) { .cover-page { padding-bottom: 36px; } }
  .app-shell:has(#pageContent > .cover-page) .utility-actions { z-index: 40; }
  .cover-app { max-width: 760px; margin: 0 auto; }
  .cover-header { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin: 0 0 28px; }
  .cover-page.is-cover-editor .cover-header { margin-bottom: 16px; }
  .cover-title { max-width: 100%; margin: 0; line-height: .96; }
  .cover-section-title { margin: 0 0 16px; }
  .cover-group-tiles { margin-bottom: 14px; }

  /* 一覧 */
  .cover-project-row { gap: 10px; }
  .cover-project-main { display: grid; min-width: 0; flex: 1; gap: 3px; }
  .cover-project-row .cover-row-meta { overflow: hidden; margin: 0; text-overflow: ellipsis; white-space: nowrap; }
  .cover-row-meta { display: block; margin-top: 4px; opacity: .62; }
  .cover-empty { padding: 30px 16px; text-align: center; opacity: .62; }
  .cover-search-wrap { margin: 0 0 12px; }
  .cover-search { width: 100%; height: 52px; padding: 0 14px; }
  .cover-project-badges { display: flex; flex: none; gap: 6px; }
  /* グループ・メンバーを選ぶ画面：2列のタイル */
  .cover-member-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cover-member-tile { display: grid; align-content: end; aspect-ratio: 3 / 4; min-width: 0; padding: 8px; }
  .cover-member-tile strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cover-choice-next { display: flex; justify-content: center; margin-top: 18px; }
  .cover-choice-next .ui-btn { width: min(320px, 100%); min-height: 52px; }

  /* 曲の詳細：題は流れる。ORIGINAL/COVER と道具の帯だけ上に止める（上のバーの下） */
  .cover-editor-head { display: grid; gap: 8px; padding-bottom: 12px; }
  .cover-toolbar { position: sticky; top: var(--ui-bar-h); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; padding: 8px 0; }
  .cover-page.is-cover-saved-view .cover-toolbar { position: static; }
  .cover-tabs { flex: 0 1 220px; }
  .cover-tools { display: flex; flex: none; gap: 14px; }
  .cover-song-heading { margin: 0 0 4px; line-height: 1.35; }
  .cover-song-context { margin-bottom: 12px; opacity: .6; }
  .cover-lyrics { padding-bottom: 96px; }
  .cover-lyric-row { padding: 15px 2px 16px; }
  .cover-lyric-text { white-space: pre-wrap; line-height: 1.9; }
  .cover-original-label { margin: 0 0 7px; opacity: .62; }
  /* 歌唱者：歌詞と同じ「点＋名前」。編集中は「変更」を添える */
  .cover-assignee { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; margin-bottom: 4px; }
  .cover-register-song { margin-top: 14px; }
  .cover-view-actions { display: flex; justify-content: center; gap: 10px; margin: 14px 0; }
  .cover-page.is-cover-saved-view .cover-view-actions { margin: 14px 0 18px; }
  .cover-view-actions .ui-btn { width: auto; min-width: 128px; min-height: 48px; }
  .cover-save-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .cover-save-inner { display: flex; justify-content: center; max-width: 760px; margin: 0 auto; }
  .cover-save-inner .ui-btn { width: min(360px, 100%); min-height: 50px; }

  /* 担当を選ぶシート・割合・まとめて変更 */
  .cover-sheet { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center; padding: 18px 12px 0; }
  .cover-sheet-panel { width: min(620px, 100%); max-height: min(72dvh, 680px); overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .cover-sheet-title { margin: 0 0 12px; text-align: center; }
  .cover-member-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .cover-member-option { --accent: var(--member-color, var(--ui-line-strong)); justify-content: center; min-height: 54px; padding: 10px; text-align: center; }
  .cover-ratio-list { display: grid; gap: 12px; }
  .cover-ratio-row { display: grid; grid-template-columns: minmax(76px, 1fr) 2fr auto; align-items: center; gap: 10px; }
  .cover-ratio-track { height: 7px; overflow: hidden; }
  .cover-bulk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .cover-bulk-select { width: 100%; height: 48px; padding: 0 10px; }
  .ui-btn.cover-bulk-apply { display: block; width: min(260px, 100%); min-height: 48px; margin: 0 auto; }
  .cover-dialog { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; }
  .cover-dialog-panel { width: min(430px, 100%); padding: 20px; }
  .cover-dialog-message { margin: 0 0 18px; line-height: 1.7; }
  .cover-dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cover-dialog-actions .ui-btn { justify-content: center; min-height: 50px; padding: 0 14px; text-align: center; }
  .cover-saving { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; }

  /* 外部の曲を登録 */
  .cover-external-form { display: grid; gap: 16px; max-width: 720px; margin: 0 auto; }
  .cover-field { display: grid; gap: 7px; }
  .cover-field input, .cover-field textarea { width: 100%; box-sizing: border-box; padding: 13px 14px; line-height: 1.65; }
  .cover-field input { min-height: 52px; }
  .cover-field textarea { min-height: 112px; resize: vertical; white-space: pre-wrap; }
  .cover-external-primary { width: min(320px, 100%); min-height: 52px; margin: 4px auto 0; }
  .cover-external-summary { display: grid; gap: 4px; margin-bottom: 16px; padding: 14px 16px; }
  .cover-external-preview { display: grid; gap: 12px; }
  .cover-external-part { display: grid; gap: 12px; padding: 15px; }
  .cover-external-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .cover-external-actions .ui-btn { min-height: 52px; }

  @media (max-width: 600px) {
    .cover-app, .cover-external-form { max-width: none; }
    .cover-external-part { padding: 13px; }
    .cover-external-actions { grid-template-columns: 1fr; }
  }
  @media (min-width: 780px) {
    .cover-save-bar { position: sticky; bottom: 0; margin-top: 10px; padding-left: 0; padding-right: 0; }
    .cover-sheet { align-items: center; }
    .cover-sheet-panel { max-height: 70vh; }
  }
</style>
<style data-content>
  /* 中身の見た目（絵柄・レア度・メンバーカラー）。ボタン・入力欄はここに書かない */
  .cover-ratio-fill{height:100%;background:var(--member-color,#9cecff);border-radius:inherit}
</style>
