<div id="imageManagementOverlay" class="management-editor" hidden>
  <section class="management-editor-panel image-management-panel">


    <div id="imageManagementLoading" class="ui-loading management-loading image-management-loading">読み込み中…</div>

    <form id="imageManagementForm" class="image-management-form" onsubmit="return submitImageManagement(event)" hidden>
      <label class="ui-field management-field image-management-field">
        <span>グループ</span>
        <select id="imageManagementGroup" onchange="changeImageManagementGroup()">
          <option value="">選択してください</option>
        </select>
      </label>

      <label class="ui-field management-field image-management-field">
        <span>メンバー</span>
        <select id="imageManagementMember" onchange="refreshImageManagementExisting()" disabled>
          <option value="">先にグループを選択してください</option>
        </select>
      </label>

      <label class="ui-field management-field image-management-field">
        <span>レア度</span>
        <select id="imageManagementRarity" onchange="refreshImageManagementExisting()">
          <option value="">選択してください</option>
          <option value="N">N</option>
          <option value="R">R</option>
          <option value="SR">SR</option>
          <option value="SSR">SSR</option>
        </select>
      </label>

      <label class="ui-field management-field image-management-field ui-frame image-management-file-field">
        <span>画像</span>
        <input id="imageManagementFile" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" onchange="previewImageManagementFile()">
        <b id="imageManagementFileName">JPEGまたはPNGを選択</b>
      </label>

      <section id="imageManagementPreviewSection" class="image-management-preview-section" hidden>
        <p>登録する画像</p>
        <div class="ui-panel image-management-preview-card"><img id="imageManagementPreview" alt="登録する画像のプレビュー"></div>
      </section>

      <p id="imageManagementError" class="ui-text-danger management-error image-management-error" role="alert" hidden></p>
      <button id="imageManagementSubmit" class="ui-btn ui-btn-solid ui-btn-wide image-management-primary" type="submit">画像を登録する</button>
    </form>

    <section class="ui-divider-top image-management-repair image-management-group-photo">
      <div>
        <strong class="ui-strong">グループ写真</strong>
        <small class="ui-muted">グループ一覧・カバーメーカーなどで使う写真です。登録すると全画面に反映されます。</small>
      </div>
      <form id="imageGroupPhotoForm" class="image-management-form" onsubmit="return submitGroupPhoto(event)" hidden>
        <label class="ui-field management-field image-management-field">
          <span>グループ</span>
          <select id="imageGroupPhotoGroup" onchange="refreshGroupPhotoStatus()">
            <option value="">選択してください</option>
          </select>
        </label>
        <p id="imageGroupPhotoStatus" class="ui-muted">グループを選択してください</p>
        <label class="ui-field management-field image-management-field ui-frame image-management-file-field">
          <span>画像</span>
          <input id="imageGroupPhotoFile" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
          <b id="imageGroupPhotoFileName">JPEGまたはPNGを選択</b>
        </label>
        <p id="imageGroupPhotoError" class="ui-text-danger management-error image-management-error" role="alert" hidden></p>
        <button id="imageGroupPhotoSubmit" class="ui-btn ui-btn-solid ui-btn-wide image-management-primary" type="submit">グループ写真を登録する</button>
      </form>
    </section>

    <section class="ui-divider-top image-management-repair">
      <div>
        <strong class="ui-strong">画像データを修復</strong>
        <small class="ui-muted">Driveに保存されている画像を確認し、画像データとの紐付けを修復します。</small>
      </div>
      <button id="imageManagementRepairButton" type="button" onclick="confirmImageManagementRepair()">画像データを修復する</button>
    </section>
  </section>
</div>

<div id="imageReplaceOverlay" class="modal-overlay image-replace-overlay" onclick="closeImageReplaceOnBackdrop(event)">
  <section class="settings-panel management-panel image-replace-panel" role="dialog" aria-modal="true" aria-labelledby="imageReplaceTitle">
    <header class="modal-head">
      <div><h2 id="imageReplaceTitle" class="modal-title">画像を差し替えますか？</h2></div>
      <button class="overlay-close" type="button" onclick="closeImageReplaceConfirm()" aria-label="画像差し替え確認を閉じる">×</button>
    </header>
    <p id="imageReplaceCopy" class="ui-muted image-replace-copy"></p>
    <div class="image-replace-compare">
      <div><span class="ui-label">現在の画像</span><div class="ui-panel image-management-preview-card"><img id="imageReplaceCurrent" alt="現在の画像"></div></div>
      <b class="ui-muted" aria-hidden="true">→</b>
      <div><span class="ui-label">新しい画像</span><div class="ui-panel image-management-preview-card"><img id="imageReplaceNew" alt="新しい画像"></div></div>
    </div>
    <div class="image-replace-actions">
      <button type="button" class="ui-btn image-management-secondary" onclick="closeImageReplaceConfirm()">キャンセル</button>
      <button id="imageReplaceConfirmButton" type="button" class="ui-btn ui-btn-solid ui-btn-wide image-management-primary" onclick="confirmImageReplacement()">画像を差し替える</button>
    </div>
  </section>
</div>

<style>
  .image-replace-overlay{z-index:1300}
    .image-management-form{display:grid;gap:16px;margin-top:12px}
  .image-management-file-field{position:relative;min-height:88px;padding:15px;cursor:pointer}
  .image-management-file-field input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .image-management-file-field b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .image-management-preview-section{display:grid;gap:8px}
  .image-management-preview-card{aspect-ratio:3/4;overflow:hidden}
  .image-management-preview-card img{width:100%;height:100%;display:block;object-fit:cover}
  .image-management-repair{margin-top:24px;padding-top:20px;display:grid;gap:12px}
  .image-management-repair>div{display:grid;gap:4px}
    .image-replace-panel{max-width:620px}
  .image-replace-copy{margin:4px 0 18px}
  .image-replace-compare{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);align-items:center;gap:10px}
  .image-replace-compare>div{display:grid;gap:7px}
  .image-replace-compare span{text-align:center}
  .image-replace-compare>b{text-align:center}
  .image-replace-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  @media(max-width:520px){.image-replace-compare{gap:6px}.image-replace-actions{grid-template-columns:1fr}}
</style>

<script>
  const imageManagementState = {
    bootstrap:null,busy:false,
    previewUrl:'',
    status:null,
    pendingFile:null,
    pendingData:null
  };

  function openImageManagement() {
    closeSettings();
    const overlay = document.getElementById('imageManagementOverlay');
    if (!overlay) return;
    overlay.hidden=false;
    if (imageManagementState.bootstrap) {
      renderImageManagementBootstrap(imageManagementState.bootstrap);
      return;
    }
    imageManagementState.busy=true;setImageManagementLoading(true);
    managementRunner_()
      .withSuccessHandler(function(data){ imageManagementState.busy=false;imageManagementState.bootstrap=data; renderImageManagementBootstrap(data); })
      .withFailureHandler(function(error){ imageManagementState.busy=false;showImageManagementError(readImageManagementError(error)); setImageManagementLoading(false); })
      .getImageManagementBootstrap();
  }

  function renderImageManagementBootstrap(data) {
    const group = document.getElementById('imageManagementGroup');
    group.innerHTML = '<option value="">選択してください</option>' + (data.groups||[]).map(function(item){return '<option value="'+escapeImageManagementHtml(item.name)+'">'+escapeImageManagementHtml(item.name)+'</option>';}).join('');
    setImageManagementLoading(false);
    document.getElementById('imageManagementForm').hidden = false;
    changeImageManagementGroup();
    renderGroupPhotoOptions(data.groups);
    loadUniverseGroupPhotos(function(){ refreshGroupPhotoStatus(); });
  }

  function setImageManagementLoading(loading) {
    const node=document.getElementById('imageManagementLoading');
    if(node) node.hidden=!loading;
  }

  function changeImageManagementGroup() {
    const groupName=document.getElementById('imageManagementGroup').value;
    const member=document.getElementById('imageManagementMember');
    const group=(imageManagementState.bootstrap&&imageManagementState.bootstrap.groups||[]).find(function(item){return item.name===groupName;});
    if(!group){member.disabled=true;member.innerHTML='<option value="">先にグループを選択してください</option>';imageManagementState.status=null;return;}
    member.disabled=false;
    member.innerHTML='<option value="">選択してください</option>'+group.members.map(function(item){return '<option value="'+escapeImageManagementHtml(item.memberId)+'">'+escapeImageManagementHtml(item.name)+'</option>';}).join('');
    imageManagementState.status=null;
  }

  function refreshImageManagementExisting() {
    imageManagementState.status=null;
    const memberId=document.getElementById('imageManagementMember').value;
    const rarity=document.getElementById('imageManagementRarity').value;
    if(!memberId||!rarity)return;
    managementRunner_().withSuccessHandler(function(status){imageManagementState.status=status;}).withFailureHandler(function(error){showImageManagementError(readImageManagementError(error));}).getImageManagementStatus(memberId,rarity);
  }

  function previewImageManagementFile() {
    clearImageManagementError();
    const input=document.getElementById('imageManagementFile');
    const file=input.files&&input.files[0];
    const name=document.getElementById('imageManagementFileName');
    const section=document.getElementById('imageManagementPreviewSection');
    if(imageManagementState.previewUrl){URL.revokeObjectURL(imageManagementState.previewUrl);imageManagementState.previewUrl='';}
    imageManagementState.pendingFile=null;imageManagementState.pendingData=null;
    if(!file){name.textContent='JPEGまたはPNGを選択';section.hidden=true;return;}
    if(['image/jpeg','image/png'].indexOf(String(file.type||'').toLowerCase())<0){input.value='';name.textContent='JPEGまたはPNGを選択';section.hidden=true;showImageManagementError('この画像形式には対応していません。JPEGまたはPNGの画像を選択してください。');return;}
    imageManagementState.pendingFile=file;
    name.textContent=file.name;
    imageManagementState.previewUrl=URL.createObjectURL(file);
    document.getElementById('imageManagementPreview').src=imageManagementState.previewUrl;
    section.hidden=false;
  }

  function submitImageManagement(event) {
    if(event)event.preventDefault();
    if(imageManagementState.busy)return false;
    clearImageManagementError();
    const groupName=document.getElementById('imageManagementGroup').value;
    const memberId=document.getElementById('imageManagementMember').value;
    const rarity=document.getElementById('imageManagementRarity').value;
    const file=imageManagementState.pendingFile;
    if(!groupName||!memberId||!rarity||!file){showImageManagementError('グループ・メンバー・レア度・画像をすべて選択してください。');return false;}
    setImageManagementBusy_(true);
    const button=document.getElementById('imageManagementSubmit');button.disabled=true;
    getImageManagementStatusFresh_(memberId,rarity,function(status){
      imageManagementState.status=status;
      if(status.hasImage){setImageManagementBusy_(false);openImageReplaceConfirm(status);return;}
      readImageManagementFile_(file,function(data){saveImageManagement_(groupName,memberId,rarity,file,data,false,'');},function(error){setImageManagementBusy_(false);showImageManagementError(error);});
    },function(error){setImageManagementBusy_(false);button.disabled=false;showImageManagementError(readImageManagementError(error));});
    return false;
  }

  function openImageReplaceConfirm(status) {
    const file=imageManagementState.pendingFile;if(!file)return;
    document.getElementById('imageReplaceCopy').textContent=status.memberName+'の'+status.rarity+'画像はすでに登録されています。現在の画像を新しい画像に置き換えますか？';
    document.getElementById('imageReplaceCurrent').src=status.previewUrl;
    document.getElementById('imageReplaceNew').src=imageManagementState.previewUrl;
    const overlay=document.getElementById('imageReplaceOverlay');overlay.classList.add('open');document.body.style.overflow='hidden';
  }
  function closeImageReplaceConfirm(){if(imageManagementState.busy)return;document.body.style.overflow='';const overlay=document.getElementById('imageReplaceOverlay');if(overlay)overlay.classList.remove('open');}
  function closeImageReplaceOnBackdrop(event){if(event.target&&event.target.id==='imageReplaceOverlay')closeImageReplaceConfirm();}

  function confirmImageReplacement() {
    if(imageManagementState.busy)return;setImageManagementBusy_(true);
    const status=imageManagementState.status,file=imageManagementState.pendingFile;if(!status||!file)return;
    const button=document.getElementById('imageReplaceConfirmButton');button.disabled=true;
    readImageManagementFile_(file,function(data){
      saveImageManagement_(status.groupName,status.memberId,status.rarity,file,data,true,status.driveFileId,function(){button.disabled=false;closeImageReplaceConfirm();});
    },function(error){setImageManagementBusy_(false);button.disabled=false;showImageManagementError(error);});
  }

  function saveImageManagement_(groupName,memberId,rarity,file,base64,replace,expectedOldFileId,done) {
    setImageManagementBusy_(true);const submit=document.getElementById('imageManagementSubmit');submit.disabled=true;
    managementRunner_().withSuccessHandler(function(result){
      setImageManagementBusy_(false);submit.disabled=false;if(done)done();
      managementMutationDone_();managementState.dirty=false;resetImageManagementForm();imageManagementState.bootstrap=null;openImageManagement();
      showImageManagementToast((result&&result.message)||'画像を登録しました。');
    }).withFailureHandler(function(error){
      setImageManagementBusy_(false);submit.disabled=false;if(done)done();
      showImageManagementError(readImageManagementError(error));
    }).saveImageManagementImage({userId:getUniverseUserId(),groupName:groupName,memberId:memberId,rarity:rarity,mimeType:file.type,fileName:file.name,base64:base64,replace:replace,expectedOldFileId:expectedOldFileId});
  }

  function readImageManagementFile_(file,success,failure) {
    const reader=new FileReader();
    reader.onload=function(){const value=String(reader.result||'');success(value.indexOf(',')>=0?value.split(',')[1]:value);};
    reader.onerror=function(){if(failure)failure('画像を読み込めませんでした。');};
    reader.readAsDataURL(file);
  }

  function getImageManagementStatusFresh_(memberId,rarity,success,failure){managementRunner_().withSuccessHandler(success).withFailureHandler(failure).getImageManagementStatus(memberId,rarity);}

  function resetImageManagementForm() {
    const form=document.getElementById('imageManagementForm');if(form)form.reset();
    const member=document.getElementById('imageManagementMember');if(member){member.disabled=true;member.innerHTML='<option value="">先にグループを選択してください</option>';}
    const section=document.getElementById('imageManagementPreviewSection');if(section)section.hidden=true;
    const name=document.getElementById('imageManagementFileName');if(name)name.textContent='JPEGまたはPNGを選択';
    if(imageManagementState.previewUrl)URL.revokeObjectURL(imageManagementState.previewUrl);
    imageManagementState.previewUrl='';imageManagementState.status=null;imageManagementState.pendingFile=null;imageManagementState.pendingData=null;
    clearImageManagementError();
  }

  function confirmImageManagementRepair() {
    if(imageManagementState.busy)return;
    if(!window.confirm('Driveの画像をもとに画像データを確認・修復します。実行しますか？'))return;
    setImageManagementBusy_(true);const button=document.getElementById('imageManagementRepairButton');button.disabled=true;
    managementRunner_().withSuccessHandler(function(result){setImageManagementBusy_(false);button.disabled=false;const suffix=result&&result.warnings?'\n判断できない画像が '+result.warnings+' 件あります。':'';showImageManagementToast('画像データを修復しました。更新 '+((result&&result.updated)||0)+' 件。'+suffix);}).withFailureHandler(function(error){setImageManagementBusy_(false);button.disabled=false;showImageManagementError(readImageManagementError(error));}).repairImageManagementData(getUniverseUserId());
  }

  function renderGroupPhotoOptions(groups) {
    const select = document.getElementById('imageGroupPhotoGroup');
    if (!select) return;
    select.innerHTML = '<option value="">選択してください</option>' + (groups||[]).map(function(item){return '<option value="'+escapeImageManagementHtml(item.name)+'">'+escapeImageManagementHtml(item.name)+'</option>';}).join('');
    document.getElementById('imageGroupPhotoForm').hidden = false;
    refreshGroupPhotoStatus();
  }

  function refreshGroupPhotoStatus() {
    const name = document.getElementById('imageGroupPhotoGroup').value;
    const node = document.getElementById('imageGroupPhotoStatus');
    if (!name) { node.textContent = 'グループを選択してください'; return; }
    const registered = !!(typeof universeGroupPhotoIds !== 'undefined' && universeGroupPhotoIds && universeGroupPhotoIds[name]);
    node.textContent = registered ? '登録済みです。新しい画像を選ぶと差し替えます。' : '未登録です。';
  }

  function submitGroupPhoto(event) {
    event.preventDefault();
    const name = document.getElementById('imageGroupPhotoGroup').value;
    const input = document.getElementById('imageGroupPhotoFile');
    const file = input.files && input.files[0];
    clearImageManagementError();
    if (!name || !file) { showGroupPhotoError('グループと画像を選択してください。'); return false; }
    const registered = !!(universeGroupPhotoIds && universeGroupPhotoIds[name]);
    if (registered && !window.confirm('登録済みのグループ写真を差し替えますか？')) return false;
    readImageManagementFile_(file, function(base64){ saveGroupPhoto_(name, file, base64, registered); }, function(error){ showGroupPhotoError(error); });
    return false;
  }

  function saveGroupPhoto_(groupName, file, base64, replace) {
    const button = document.getElementById('imageGroupPhotoSubmit');
    const expected = (universeGroupPhotoIds && universeGroupPhotoIds[groupName]) || '';
    button.disabled = true;
    managementRunner_().withSuccessHandler(function(result){
      button.disabled = false;
      managementMutationDone_();
      universeGroupPhotoIds = null;
      loadUniverseGroupPhotos(function(){ refreshGroupPhotoStatus(); });
      document.getElementById('imageGroupPhotoFile').value = '';
      document.getElementById('imageGroupPhotoFileName').textContent = 'JPEGまたはPNGを選択';
      showImageManagementToast((result && result.message) || 'グループ写真を登録しました。');
    }).withFailureHandler(function(error){
      button.disabled = false;
      showGroupPhotoError(readImageManagementError(error));
    }).saveGroupPhotoManagement({userId:getUniverseUserId(), groupName:groupName, mimeType:file.type, fileName:file.name, base64:base64, replace:replace, expectedOldFileId:expected});
  }

  function showGroupPhotoError(message){const node=document.getElementById('imageGroupPhotoError');if(!node)return;node.textContent=message||'処理に失敗しました。';node.hidden=false;}

  function showImageManagementError(message){const node=document.getElementById('imageManagementError');if(!node)return;node.textContent=message||'処理に失敗しました。';node.hidden=false;}
  function clearImageManagementError(){const node=document.getElementById('imageManagementError');if(node){node.textContent='';node.hidden=true;}}
  function showImageManagementToast(message){if(typeof showToast==='function'){showToast(message);return;}alert(message);}
  function readImageManagementError(error){return String(error&&error.message?error.message:error||'処理に失敗しました。').replace(/^Exception:\s*/,'');}
  function escapeImageManagementHtml(value){return String(value==null?'':value).replace(/[&<>'"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch];});}
  function setImageManagementBusy_(flag){imageManagementState.busy=!!flag;document.querySelectorAll('#imageManagementOverlay input,#imageManagementOverlay select,#imageManagementOverlay button,#imageReplaceOverlay button').forEach(function(el){el.disabled=!!flag;});}
</script>
