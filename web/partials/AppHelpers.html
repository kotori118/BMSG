<script>
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Escape') return;
      if (settingsOverlay.classList.contains('open')) return closeSettings();
      if (searchOverlay.classList.contains('open')) return closeSearch();
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    // 戻るは1画面に1つ（画面上部の BACK）。中の画面に戻り先（.ui-back）があれば、それを押して1段だけ戻る。
    // 中の BACK は Styles.html で隠す。重ねて出す画面の BACK は data-keep-back で残す。
    function universeInnerBack() {
      const page = document.getElementById('pageContent');
      if (!page) return false;
      const inner = [].slice.call(page.querySelectorAll('.ui-back:not([data-page-back]):not([data-keep-back])'))
        .find(function (b) { return !b.disabled && !b.closest('[hidden]') && !b.closest('[aria-hidden="true"]'); });
      if (!inner) return false;
      inner.click();
      return true;
    }

    // 番号つきの大きな行の一覧（分析のトップ・カバーメーカーなど）。items: [{title, desc, onclick}]
    // onclick は呼ぶ側でエスケープ済みの文字列を渡す。
    function renderUniverseIndexRows(items, extraClass) {
      return '<div class="ui-list' + (extraClass ? ' ' + extraClass : '') + '">' + items.map(function (item, i) {
        return '<button class="ui-index-row" type="button" onclick="' + item.onclick + '"><span class="ui-num-hollow">' + String(i + 1).padStart(2, '0') + '</span><span class="ui-index-copy"><strong class="ui-heading">' + escapeHtml(item.title) + '</strong>' + (item.desc ? '<small class="ui-muted">' + escapeHtml(item.desc) + '</small>' : '') + '</span><span class="ui-index-arrow" aria-hidden="true"></span></button>';
      }).join('') + '</div>';
    }

    // グループ写真は DB（管理画面の「グループ写真」で登録）から読む（getGroupPhotos）
    let universeGroupPhotoIds = null;

    // Drive の画像は、大きさを指定した小さい版だけを読む（元の大きさは数MBあって重い）。width は表示の約2〜3倍の幅。
    function universeImageUrl(fileId, width) {
      return fileId ? 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(fileId) + '=w' + (width || 640) : '';
    }

    function universeGroupPhotoUrl(name, width) {
      const key = String(name || '');
      const id = universeGroupPhotoIds && universeGroupPhotoIds[key];
      return universeImageUrl(id, width || 640);
    }

    function loadUniverseGroupPhotos(done) {
      try {
        google.script.run.withSuccessHandler(function (data) {
          universeGroupPhotoIds = (data && data.photos) || {};
          applyUniverseGroupPhotos_();
          if (done) done();
        }).withFailureHandler(function () { if (done) done(); }).getGroupPhotos();
      } catch (e) { if (done) done(); }
    }

    // 写真の読み込みより先に描いたタイル（data-photo-name つき）に、あとから写真を付ける
    function applyUniverseGroupPhotos_() {
      document.querySelectorAll('[data-photo-name]').forEach(function (el) {
        if (el.classList.contains('ui-photo-tile')) return;
        // 小さな写真（ホームの枠など）：中に <img> を入れて、親の枠を「写真つき」にする
        if (el.getAttribute('data-photo-kind') === 'thumb') {
          if (el.firstChild) return;
          const thumbUrl = universeGroupPhotoUrl(el.getAttribute('data-photo-name'), 560);
          if (thumbUrl) fillUniversePhotoThumb_(el, thumbUrl);
          return;
        }
        const url = universeGroupPhotoUrl(el.getAttribute('data-photo-name'));
        if (!url) return;
        if (el.getAttribute('data-photo-kind') === 'toggle') {
          el.classList.remove('ui-btn', 'ui-btn-plain', 'is-on');
          el.classList.add('ui-photo-tile', 'ui-photo-toggle');
        } else {
          el.classList.remove('ui-card', 'ui-accent-left');
          el.classList.add('ui-photo-tile');
        }
        el.style.setProperty('--ui-photo', "url('" + url + "')");
      });
    }

    function fillUniversePhotoThumb_(el, url) {
      el.innerHTML = '<img src="' + url + '" alt="" decoding="async" loading="lazy">';
      el.hidden = false;
      if (el.parentElement) el.parentElement.classList.add('has-photo');
    }

    // ユニット（グループIDが U で始まる）か。IDがないときは「BMSG 〜」の名前で判断（BMSG ALLSTARS は除く）
    function isUniverseUnitGroup(id, name) {
      const gid = String(id || '');
      if (gid) return /^U/i.test(gid);
      const n = String(name || '');
      return /^BMSG /.test(n) && n !== 'BMSG ALLSTARS';
    }

    // グループのタイル（共通部品 .ui-group-tile）。写真があれば写真、なければ線の色つきの面。
    // onclick は呼ぶ側でエスケープ済みの文字列を渡す。
    function renderUniverseGroupTile(opts) {
      const name = String(opts.name || '');
      const photo = universeGroupPhotoUrl(opts.photoName || name);
      const look = photo
        ? 'class="ui-photo-tile ui-group-tile" style="--ui-photo:url(\'' + photo + '\')"'
        : 'class="ui-card ui-accent-left ui-group-tile" style="--accent:' + escapeHtml(opts.color || 'var(--ui-line-strong)') + '"';
      const sub = opts.sub ? '<small class="ui-label">' + escapeHtml(opts.sub) + '</small>' : '';
      return '<button type="button" ' + look + ' data-photo-name="' + escapeHtml(opts.photoName || name) + '" onclick="' + opts.onclick + '"><strong class="ui-heading">' + escapeHtml(name) + '</strong>' + sub + '</button>';
    }

    function scrollAppToTop(behavior = 'smooth') {
      const scroller = document.querySelector('.page-wrap');
      if (scroller) {
        scroller.scrollTo({ top: 0, left: 0, behavior });
        return;
      }
      window.scrollTo({ top: 0, left: 0, behavior });
    }

    // 画面の色は2種類だけ：'v2'（黒基調）と 'v2-light'（白基調）。部品は同じで、色はトークンが切り替える。
    function setTheme(theme) {
      document.body.classList.add('ui-v2');
      document.body.classList.toggle('ui-light', theme === 'v2-light');
    }

    function setPageAtmosphere(route) {
      document.body.classList.toggle(
        'is-home',
        route === 'home'
      );
      const isSectionRoot = ['home', 'data', 'lab'].includes(route);
      document.body.classList.toggle('is-section-root', isSectionRoot);
      const utilityHome = document.querySelector('.utility-home');
      if (utilityHome) utilityHome.hidden = isSectionRoot;

      const bottomNavRoutes = ['home', 'data', 'lab'];
      document.body.classList.toggle(
        'nav-hidden',
        !bottomNavRoutes.includes(route)
      );
    }

    function setActiveNav(parent) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle(
          'active',
          btn.dataset.nav === parent
        );
      });
    }

</script>
