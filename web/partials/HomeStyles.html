<style>
  /* HOME・DATA・LAB（入口の3画面）の並べ方。見た目は部品 .ui-* */

  /* ---- HOME ---- */
  .home { display: flex; flex-direction: column; padding: var(--ui-top-pad) 0 20px; }
  .home-title .line { display: block; }
  .home-divider { display: none; }
  .home-intro .home-title .line { opacity: 0; animation: uiRise 260ms var(--ui-ease) forwards; }
  .home-intro .home-title .line:nth-child(1) { animation-delay: 180ms; }
  .home-intro .home-title .line:nth-child(2) { animation-delay: 270ms; }
  .home-dynamic { display: grid; gap: 24px; margin-top: 22px; padding-bottom: 36px; }
  .home-today-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .home-feature-card { display: flex; flex-direction: column; align-items: stretch; gap: 10px; min-width: 0; padding: 20px 20px 22px; overflow: hidden; }
  .home-feature-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
  .home-feature-copy > b { margin-top: 4px; }
  /* 写真があるときは、文字が左・写真が右いっぱい（枠の上・右・下まで）。写真の左側は斜めに切る */
  .home-feature-card.has-photo { position: relative; min-height: 150px; }
  .home-feature-card.has-photo .home-feature-copy { max-width: 56%; }
  .home-feature-photo { position: absolute; top: 0; right: 0; bottom: 0; width: 46%; clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 100%); }
  .home-feature-photo > img { object-position: center top; }
  .home-feature-card strong { overflow-wrap: anywhere; }
  .home-birthday-card { gap: 12px; }
  .home-birthday-copy { display: grid; gap: 7px; width: 100%; }
  .home-birthday-members { display: grid; gap: 8px; width: 100%; }
  .home-birthday-member { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px; text-align: left; }
  .home-state { min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .home-skeleton-card { pointer-events: none; }
  .home-skeleton-title { width: 72%; height: 26px; }
  .home-skeleton-title.short { width: 46%; }
  .home-skeleton-meta { width: 36%; height: 12px; margin-top: 12px; }
  .home-skeleton-action { width: 18%; height: 10px; margin-top: 24px; }

  /* ---- DATA・LAB ---- */
  .category-page { min-height: calc(100dvh - var(--ui-nav-h) - 64px); padding: var(--ui-top-pad) 0 20px; }
  .category-header { position: relative; display: grid; gap: 12px; margin-bottom: 22px; padding-bottom: 22px; }
  .category-title { display: grid; margin: 0; }
  .category-card-desc { display: none; }
  .category-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 720px) { .category-cards.data-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .category-card-inner { display: flex; flex-direction: column; align-items: stretch; width: 100%; height: 100%; }
  .category-card-symbol { order: -1; }
  .category-card-meta { display: grid; gap: 6px; padding: 14px 16px 20px; }
  .category-card:active { transform: scale(.985); }
  /* 開いたときの動き：見出しが浮き上がり、線が伸び、タイルが順に出る */
  .category-intro .category-title-en { opacity: 0; animation: uiRise 260ms var(--ui-ease) 180ms forwards; }
  .category-intro .category-card { opacity: 0; animation: uiRise 300ms var(--ui-ease) forwards; }
  .category-intro .category-card:nth-child(1) { animation-delay: 420ms; }
  .category-intro .category-card:nth-child(2) { animation-delay: 500ms; }
  .category-intro .category-card:nth-child(3) { animation-delay: 580ms; }
  .category-intro .category-card:nth-child(4) { animation-delay: 660ms; }
  .category-intro .category-card:nth-child(n+5) { animation-delay: 700ms; }
</style>
