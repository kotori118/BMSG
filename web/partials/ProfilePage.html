<template id="profilePageTemplate">
  <section class="view profile-page">
    <header class="profile-header">
      <button class="ui-back" type="button" onclick="navigateTo('data')" aria-label="戻る"><svg class="ui-back-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg><span class="ui-back-label">BACK</span></button>
      <div class="profile-heading">
        <h1 class="profile-title">PROFILE</h1>
      </div>
    </header>


    <nav class="profile-local-nav" aria-label="プロフィールの表示切り替え">
      <button class="profile-local-tab active" type="button" data-profile-view="home" onclick="selectProfileView('home')" aria-label="ホーム"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4.5 20 11v8.5H4z"/><path d="M9.5 19.5v-5h5v5"/></svg><span>ホーム</span></button>
      <button class="profile-local-tab" type="button" data-profile-view="map" onclick="selectProfileView('map')" aria-label="マップ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span>マップ</span></button>
      <button class="profile-local-tab" type="button" data-profile-view="search" onclick="selectProfileView('search')" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>検索</span></button>
      <button class="profile-local-tab" type="button" data-profile-view="chemistry" onclick="selectProfileView('chemistry')" aria-label="相性"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg><span>相性</span></button>
      <button class="profile-local-tab" type="button" data-profile-view="discover" onclick="selectProfileView('discover')" aria-label="発見"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z"/></svg><span>発見</span></button>
    </nav>

    <div id="profilePanel" class="profile-panel" aria-live="polite"></div>
  </section>
</template>
