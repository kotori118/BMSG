<style>
  /* SONG GACHA の並べ方（見た目は部品 .ui-*） */
  .song-gacha-screen { padding-bottom: 32px; }
  .song-gacha-head { display: grid; gap: 14px; margin-bottom: 24px; }
  .song-gacha-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .song-gacha-group { min-height: 60px; justify-content: space-between; text-align: left; }
  .song-gacha-count { margin-bottom: 14px; text-align: center; }
  @media (max-width: 390px) { .song-gacha-groups { grid-template-columns: 1fr; } }

  /* 抽選の表示（画面いっぱい） */
  .song-gacha-overlay { display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; animation: songGachaFadeIn .25s ease forwards; }
  .song-gacha-overlay.is-static { opacity: 1; animation: none; }
  .song-gacha-overlay.is-leaving { animation: songGachaFadeOut .25s ease forwards; }
  .song-gacha-stage { display: grid; justify-items: center; gap: 12px; width: min(100%, 420px); text-align: center; }
  .song-gacha-ticker { display: flex; align-items: center; justify-content: center; min-height: 96px; }
  .song-gacha-stage.is-final .song-gacha-ticker { animation: songGachaFinal .45s cubic-bezier(.2, .85, .25, 1) both; }
  .song-gacha-final-group { min-height: 18px; visibility: hidden; opacity: 0; }
  .song-gacha-stage.is-ready .song-gacha-final-group { visibility: visible; opacity: 1; }
  .song-gacha-overlay-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 22px; visibility: hidden; opacity: 0; pointer-events: none; }
  .song-gacha-overlay-actions .ui-btn { width: 100%; }
  .song-gacha-selection-back { grid-column: 1 / -1; justify-self: center; }
  .song-gacha-stage.is-ready .song-gacha-overlay-actions { visibility: visible; opacity: 1; pointer-events: auto; animation: songGachaActionsIn .3s ease both; }
  @keyframes songGachaFadeIn { to { opacity: 1; } }
  @keyframes songGachaFadeOut { to { opacity: 0; } }
  @keyframes songGachaFinal { 0% { opacity: .25; transform: scale(.94); } 70% { opacity: 1; transform: scale(1.02); } 100% { transform: scale(1); } }
  @keyframes songGachaActionsIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<script>
  const songGachaState={enabled:{},result:null,drawing:false};

  function resetSongGachaSelection(){
    songGachaState.enabled={};
    LYRICS_GROUPS.forEach(function(group){songGachaState.enabled[group]=true;});
    songGachaState.result=null;
    songGachaState.drawing=false;
  }

  function songGachaSongsForGroup(group){
    return group==='BMSG ALLSTARS'?unitSongs('ALL'):groupSongs(group);
  }

  function songGachaPool(){
    return LYRICS_GROUPS.reduce(function(all,group){
      if(!songGachaState.enabled[group])return all;
      return all.concat(songGachaSongsForGroup(group).map(function(song){return {song:song,group:group};}));
    },[]);
  }

  function openSongGacha(){
    closeSongGachaOverlay(true);
    resetSongGachaSelection();
    setLyricsUrl({});
    renderSongGacha();
    scrollLyricsTop();
  }

  function renderSongGacha(){
    const view=document.getElementById('lyricsView');
    if(!view)return;
    const pool=songGachaPool();
    view.innerHTML='<section class="song-gacha-screen">'
      +'<header class="song-gacha-head">'+lyxBack('showLyricsGroups()')+'<h2 class="ui-title">SONG GACHA</h2></header>'
      +'<div class="song-gacha-groups">'+LYRICS_GROUPS.map(function(group){
        const on=!!songGachaState.enabled[group];
        return '<button class="ui-btn ui-btn-plain song-gacha-group'+(on?' is-on':'')+'" type="button" aria-pressed="'+on+'" onclick="toggleSongGachaGroup(\''+lyricArg(group)+'\')"><strong>'+escapeLyrics(group)+'</strong><span>'+(on?'ON':'OFF')+'</span></button>';
      }).join('')+'</div>'
      +'<p class="ui-label song-gacha-count">対象曲 '+pool.length+'曲</p>'
      +'<button class="ui-btn ui-btn-solid ui-btn-wide" type="button" onclick="drawSongGacha()"'+(!pool.length||songGachaState.drawing?' disabled':'')+'>引く</button>'
      +'</section>';
  }

  function toggleSongGachaGroup(encoded){
    const group=decodeURIComponent(encoded);
    songGachaState.enabled[group]=!songGachaState.enabled[group];
    songGachaState.result=null;
    renderSongGacha();
  }

  function drawSongGacha(){
    if(songGachaState.drawing)return;
    const pool=songGachaPool();
    if(!pool.length){showLyricsError('グループを1つ以上選んでください。');return;}
    closeSongGachaOverlay(true);
    songGachaState.drawing=true;
    const result=pool[Math.floor(Math.random()*pool.length)];
    songGachaState.result=result;
    playSongGachaAnimation(pool,result,window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function songGachaOverlayMarkup(){
    return '<div class="song-gacha-stage"><p class="ui-heading-lg song-gacha-ticker">...</p><p class="ui-label song-gacha-final-group"></p><div class="song-gacha-overlay-actions"><button class="ui-btn ui-btn-solid" type="button" onclick="drawSongGachaAgain()">もう一度引く</button><button class="ui-btn" type="button" onclick="openSongGachaKaraoke()">歌う</button><div class="song-gacha-selection-back">'+lyxBack('backFromSongGachaReveal()')+'</div></div></div>';
  }

  function runSongGachaSequence(overlay,pool,result,reduced){
    const ticker=overlay.querySelector('.song-gacha-ticker');
    const group=overlay.querySelector('.song-gacha-final-group');
    const stage=overlay.querySelector('.song-gacha-stage');
    stage.classList.remove('is-final','is-ready');
    ticker.textContent='...';
    group.textContent='';
    if(reduced){
      ticker.textContent=result.song.title;
      group.textContent=result.group;
      stage.classList.add('is-final','is-ready');
      songGachaState.drawing=false;
      return;
    }
    let ticks=0;
    const timer=setInterval(function(){
      const pick=pool[Math.floor(Math.random()*pool.length)];
      ticker.textContent=pick.song.title;
      ticks++;
      if(ticks>=11){
        clearInterval(timer);
        ticker.textContent=result.song.title;
        group.textContent=result.group;
        stage.classList.add('is-final');
        setTimeout(function(){
          stage.classList.add('is-ready');
          songGachaState.drawing=false;
        },450);
      }
    },105);
  }

  function playSongGachaAnimation(pool,result,reduced){
    const overlay=document.createElement('div');
    overlay.className='ui-stage song-gacha-overlay'+(reduced?' is-static':'');
    overlay.innerHTML=songGachaOverlayMarkup();
    document.body.appendChild(overlay);
    runSongGachaSequence(overlay,pool,result,reduced);
  }

  function closeSongGachaOverlay(immediate){
    const overlay=document.querySelector('.song-gacha-overlay');
    if(!overlay)return;
    if(immediate){overlay.remove();return;}
    overlay.classList.add('is-leaving');
    setTimeout(function(){overlay.remove();},260);
  }

  function backFromSongGachaReveal(){
    songGachaState.drawing=false;
    closeSongGachaOverlay(true);
  }

  function drawSongGachaAgain(){
    if(songGachaState.drawing)return;
    const pool=songGachaPool();
    if(!pool.length)return;
    const overlay=document.querySelector('.song-gacha-overlay');
    if(!overlay){drawSongGacha();return;}
    songGachaState.drawing=true;
    const result=pool[Math.floor(Math.random()*pool.length)];
    songGachaState.result=result;
    runSongGachaSequence(overlay,pool,result,window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applySongGachaContext(){
    const result=songGachaState.result;
    if(!result)return null;
    lyricsState.group=result.group;
    lyricsState.unit=result.group==='BMSG ALLSTARS'?(result.song.unitCategory||''):'';
    return result;
  }

  function openSongGachaKaraoke(){
    const result=applySongGachaContext();
    if(!result)return;
    closeSongGachaOverlay(true);
    setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit,song:result.song.songId});
    openKaraokeFromLyrics(lyricArg(result.song.songId));
  }
</script>
