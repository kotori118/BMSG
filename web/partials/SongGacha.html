<style>
  /* SONG GACHA の並べ方（見た目は部品 .ui-*） */
  .song-gacha-screen { padding-bottom: 32px; }
  .song-gacha-head { display: grid; gap: 14px; margin-bottom: 24px; }
  .song-gacha-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .song-gacha-group { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; padding: 0 16px; text-align: left; }
  .song-gacha-group strong { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-gacha-count { margin-bottom: 14px; text-align: center; }
  @media (max-width: 390px) { .song-gacha-groups { grid-template-columns: 1fr; } }

  /* 抽選の表示（画面いっぱい）。演出の見た目は下の <style data-content> */
  .song-gacha-overlay { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  .song-gacha-stage { position: relative; z-index: 3; display: grid; justify-items: center; gap: 14px; width: min(100%, 420px); text-align: center; }
  .song-gacha-window { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 120px; padding: 0 12px; }
  .song-gacha-ticker { margin: 0; }
  .song-gacha-final-group { min-height: 18px; }
  .song-gacha-overlay-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 18px; }
  .song-gacha-overlay-actions .ui-btn { width: 100%; }
  .song-gacha-selection-back { grid-column: 1 / -1; justify-self: center; }
</style>
<style data-content>
  /* SONG GACHA の演出（暗い舞台・回る輪・流れる曲名・止まった瞬間の光と粒） */
  .song-gacha-overlay {
    --ui-bg: #06070b; --ui-panel: #14161c; --ui-panel-2: #1c1f27; --ui-line: rgba(255,255,255,.14); --ui-line-strong: rgba(255,255,255,.5);
    --ui-text: #ffffff; --ui-text-sub: rgba(255,255,255,.62); --ui-active-bg: #ffffff; --ui-active-text: #0b0b0f;
    background: radial-gradient(120% 80% at 50% 45%, #1a1d27 0%, #06070b 62%); color: #fff;
    opacity: 0; animation: gachaFadeIn .3s ease forwards;
  }
  .song-gacha-overlay.is-static { opacity: 1; animation: none; }
  .song-gacha-overlay.is-leaving { animation: gachaFadeOut .25s ease forwards; }
  .gacha-photo { position: absolute; inset: -6%; z-index: 0; background: var(--gacha-photo, none) center / cover no-repeat; filter: brightness(.7) saturate(1.1); opacity: 0; transform: scale(1.04); transition: opacity .45s ease, transform 1s ease; }
  .song-gacha-overlay.is-final .gacha-photo { opacity: 1; transform: scale(1); }
  .gacha-glow { position: absolute; left: 50%; top: 46%; z-index: 1; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 38%, transparent 70%); animation: gachaPulse 1.6s ease-in-out infinite; }
  .song-gacha-overlay.is-spinning .gacha-glow { animation-duration: .45s; }
  .gacha-rings { position: absolute; left: 50%; top: 46%; z-index: 1; width: 0; height: 0; }
  .gacha-rings i { position: absolute; left: 50%; top: 50%; border: 1px solid rgba(255,255,255,.22); border-top-color: rgba(255,255,255,.85); border-radius: 50%; animation: gachaSpin 3s linear infinite; }
  .gacha-rings i:nth-child(1) { width: 230px; height: 230px; margin: -115px; }
  .gacha-rings i:nth-child(2) { width: 290px; height: 290px; margin: -145px; animation-duration: 4.2s; animation-direction: reverse; border-top-color: rgba(255,255,255,.5); }
  .gacha-rings i:nth-child(3) { width: 360px; height: 360px; margin: -180px; animation-duration: 6s; border-style: dashed; border-top-color: rgba(255,255,255,.35); }
  .song-gacha-overlay.is-spinning .gacha-rings i { animation-duration: .7s; }
  .song-gacha-overlay.is-spinning .gacha-rings i:nth-child(2) { animation-duration: .95s; }
  .song-gacha-overlay.is-final .gacha-rings { opacity: 0; transition: opacity .6s ease; }
  .song-gacha-kicker { color: rgba(255,255,255,.7); letter-spacing: .42em; }
  .song-gacha-ticker { color: #fff; text-shadow: 0 0 24px rgba(255,255,255,.35); }
  .song-gacha-overlay.is-spinning .song-gacha-ticker { filter: blur(1.2px); opacity: .85; }
  .song-gacha-overlay.is-final .song-gacha-ticker { filter: none; opacity: 1; font-size: clamp(26px, 8vw, 38px); text-shadow: 0 0 30px rgba(255,255,255,.55); animation: gachaPop .7s cubic-bezier(.2,1.4,.3,1) both; }
  .song-gacha-final-group { visibility: hidden; opacity: 0; color: rgba(255,255,255,.75); }
  .song-gacha-overlay.is-final .song-gacha-final-group { visibility: visible; animation: gachaRise .5s .35s ease forwards; }
  .gacha-flash { position: absolute; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; }
  .song-gacha-overlay.is-final .gacha-flash { animation: gachaFlash .55s ease-out; }
  .gacha-burst { position: absolute; left: 50%; top: 46%; z-index: 2; width: 0; height: 0; }
  .gacha-burst i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff; opacity: 0; }
  .gacha-burst i:nth-child(3n) { width: 5px; height: 5px; }
  .gacha-burst i:nth-child(4n) { border-radius: 1px; transform: rotate(45deg); }
  .song-gacha-overlay.is-final .gacha-burst i { animation: gachaBurst 1.1s cubic-bezier(.15,.8,.3,1) forwards; animation-delay: var(--t, 0s); }
  .song-gacha-overlay-actions { visibility: hidden; opacity: 0; pointer-events: none; }
  .song-gacha-overlay.is-ready .song-gacha-overlay-actions { visibility: visible; pointer-events: auto; animation: gachaRise .4s ease forwards; }
  @keyframes gachaFadeIn { to { opacity: 1; } }
  @keyframes gachaFadeOut { to { opacity: 0; } }
  @keyframes gachaSpin { to { transform: rotate(360deg); } }
  @keyframes gachaPulse { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes gachaPop { 0% { transform: scale(1.6); opacity: 0; letter-spacing: .2em; } 60% { transform: scale(.96); opacity: 1; } 100% { transform: scale(1); letter-spacing: normal; } }
  @keyframes gachaFlash { 0% { opacity: .9; } 100% { opacity: 0; } }
  @keyframes gachaRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes gachaBurst { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(.4); } }
  @media (prefers-reduced-motion: reduce) { .song-gacha-overlay *, .song-gacha-overlay { animation: none !important; transition: none !important; } .song-gacha-overlay { opacity: 1; } .song-gacha-final-group, .song-gacha-overlay-actions { visibility: visible; opacity: 1; } }
</style>
<script>
  const songGachaState={enabled:{},result:null,drawing:false};

  function resetSongGachaSelection(){
    songGachaState.enabled={};
    LYRICS_GROUPS.forEach(function(group){songGachaState.enabled[group]=true;});
    songGachaState.result=null;
    songGachaState.drawing=false;
  }

  function songGachaSongsForGroup(group){
    return group==='BMSG ALLSTARS'?unitSongs('ALL'):groupSongs(group);
  }

  function songGachaPool(){
    return LYRICS_GROUPS.reduce(function(all,group){
      if(!songGachaState.enabled[group])return all;
      return all.concat(songGachaSongsForGroup(group).map(function(song){return {song:song,group:group};}));
    },[]);
  }

  function openSongGacha(){
    closeSongGachaOverlay(true);
    resetSongGachaSelection();
    setLyricsUrl({});
    renderSongGacha();
    scrollLyricsTop();
  }

  function renderSongGacha(){
    const view=document.getElementById('lyricsView');
    if(!view)return;
    const pool=songGachaPool();
    view.innerHTML='<section class="song-gacha-screen">'
      +'<header class="song-gacha-head">'+lyxBack('showLyricsGroups()')+'<h2 class="ui-title">SONG GACHA</h2></header>'
      +'<div class="song-gacha-groups">'+LYRICS_GROUPS.map(function(group){
        const on=!!songGachaState.enabled[group];
        const photo=universeGroupPhotoUrl(group);
        const look=photo?'class="ui-photo-tile ui-photo-toggle song-gacha-group" style="--ui-photo:url(\''+photo+'\')"':'class="ui-btn ui-btn-plain song-gacha-group'+(on?' is-on':'')+'"';
        return '<button '+look+' type="button" aria-pressed="'+on+'" onclick="toggleSongGachaGroup(\''+lyricArg(group)+'\')"><strong class="ui-heading">'+escapeLyrics(group)+'</strong><span class="ui-label">'+(on?'ON':'OFF')+'</span></button>';
      }).join('')+'</div>'
      +'<p class="ui-label song-gacha-count">対象曲 '+pool.length+'曲</p>'
      +'<button class="ui-btn ui-btn-solid ui-btn-wide" type="button" onclick="drawSongGacha()"'+(!pool.length||songGachaState.drawing?' disabled':'')+'>引く</button>'
      +'</section>';
  }

  function toggleSongGachaGroup(encoded){
    const group=decodeURIComponent(encoded);
    songGachaState.enabled[group]=!songGachaState.enabled[group];
    songGachaState.result=null;
    renderSongGacha();
  }

  function drawSongGacha(){
    if(songGachaState.drawing)return;
    const pool=songGachaPool();
    if(!pool.length){showLyricsError('グループを1つ以上選んでください。');return;}
    closeSongGachaOverlay(true);
    songGachaState.drawing=true;
    const result=pool[Math.floor(Math.random()*pool.length)];
    songGachaState.result=result;
    playSongGachaAnimation(pool,result,window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function songGachaOverlayMarkup(){
    let burst='';
    for(let i=0;i<18;i++){burst+='<i style="--a:'+(i*20+Math.round(Math.random()*12))+'deg;--d:'+(120+Math.round(Math.random()*110))+'px;--t:'+(Math.random()*.12).toFixed(2)+'s"></i>';}
    return '<div class="gacha-photo"></div><div class="gacha-glow"></div><div class="gacha-rings" aria-hidden="true"><i></i><i></i><i></i></div><div class="gacha-burst" aria-hidden="true">'+burst+'</div><div class="gacha-flash" aria-hidden="true"></div>'
      +'<div class="song-gacha-stage"><p class="ui-label song-gacha-kicker">SONG GACHA</p><div class="song-gacha-window"><p class="ui-heading-lg song-gacha-ticker" aria-live="polite">...</p></div><p class="ui-label song-gacha-final-group"></p><div class="song-gacha-overlay-actions"><button class="ui-btn ui-btn-solid" type="button" onclick="drawSongGachaAgain()">もう一度引く</button><button class="ui-btn" type="button" onclick="openSongGachaKaraoke()">歌う</button><div class="song-gacha-selection-back">'+lyxBack('backFromSongGachaReveal()')+'</div></div></div>';
  }

  // 曲名が速く流れて、だんだん遅くなって止まる。止まった瞬間に光と粒、グループ写真
  function runSongGachaSequence(overlay,pool,result,reduced){
    const ticker=overlay.querySelector('.song-gacha-ticker');
    const group=overlay.querySelector('.song-gacha-final-group');
    overlay.classList.remove('is-final','is-ready');
    overlay.style.setProperty('--gacha-photo',universeGroupPhotoUrl(result.group)?'url(\''+universeGroupPhotoUrl(result.group)+'\')':'none');
    group.textContent='';
    if(reduced){
      ticker.textContent=result.song.title;group.textContent=result.group;
      overlay.classList.add('is-final','is-ready');songGachaState.drawing=false;return;
    }
    overlay.classList.add('is-spinning');
    let delay=45;
    function tick(){
      if(delay>240){
        overlay.classList.remove('is-spinning');
        ticker.textContent=result.song.title;group.textContent=result.group;
        overlay.classList.add('is-final');
        setTimeout(function(){overlay.classList.add('is-ready');songGachaState.drawing=false;},450);
        return;
      }
      ticker.textContent=pool[Math.floor(Math.random()*pool.length)].song.title;
      delay=Math.round(delay*1.13);
      setTimeout(tick,delay);
    }
    setTimeout(tick,220);
  }

  function playSongGachaAnimation(pool,result,reduced){
    const overlay=document.createElement('div');
    overlay.className='ui-stage song-gacha-overlay'+(reduced?' is-static':'');
    overlay.innerHTML=songGachaOverlayMarkup();
    document.body.appendChild(overlay);
    runSongGachaSequence(overlay,pool,result,reduced);
  }

  function closeSongGachaOverlay(immediate){
    const overlay=document.querySelector('.song-gacha-overlay');
    if(!overlay)return;
    if(immediate){overlay.remove();return;}
    overlay.classList.add('is-leaving');
    setTimeout(function(){overlay.remove();},260);
  }

  function backFromSongGachaReveal(){
    songGachaState.drawing=false;
    closeSongGachaOverlay(true);
  }

  function drawSongGachaAgain(){
    if(songGachaState.drawing)return;
    const pool=songGachaPool();
    if(!pool.length)return;
    const overlay=document.querySelector('.song-gacha-overlay');
    if(!overlay){drawSongGacha();return;}
    songGachaState.drawing=true;
    const result=pool[Math.floor(Math.random()*pool.length)];
    songGachaState.result=result;
    runSongGachaSequence(overlay,pool,result,window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applySongGachaContext(){
    const result=songGachaState.result;
    if(!result)return null;
    lyricsState.group=result.group;
    lyricsState.unit=result.group==='BMSG ALLSTARS'?(result.song.unitCategory||''):'';
    return result;
  }

  function openSongGachaKaraoke(){
    const result=applySongGachaContext();
    if(!result)return;
    closeSongGachaOverlay(true);
    setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit,song:result.song.songId});
    openKaraokeFromLyrics(lyricArg(result.song.songId));
  }
</script>
