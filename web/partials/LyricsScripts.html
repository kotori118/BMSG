<script>
  const lyricsState={catalog:[],partsBySong:{},groupColors:{},group:'',unit:'',query:'',song:null,editing:null,editingIndex:-1,editDraft:null,editDirty:false,editSaving:false,singerOptions:[],initialParams:{},karaokeRoom:null,karaokeHistory:[],karaokeRoomReady:false,karaokeBusy:false,karaokeRoomRequestId:0};
  const LYRICS_GROUPS=['BE:FIRST','MAZZEL','STARGLOW','HANA','BMSG ALLSTARS'];
  const LYRICS_UNITS=['ALL'];
  // 全曲の歌詞本文を1回だけ読む。読み終わるまでに来た呼び出しは、読み終わったときにまとめて続ける。
  // 歌詞とカラオケで同じものを使う。
  const lyricsPartsWaiters=[];
  function ensureLyricsParts_(done){
    if(lyricsState.partsLoaded){if(done)done();return;}
    if(done)lyricsPartsWaiters.push(done);
    if(lyricsState.partsLoading)return;
    lyricsState.partsLoading=true;
    google.script.run.withSuccessHandler(function(data){
      lyricsState.partsLoading=false;lyricsState.partsLoaded=true;
      lyricsState.partsBySong=(data&&data.partsBySong)||{};
      if(typeof karaokeState!=='undefined')karaokeState.partsBySong=lyricsState.partsBySong;
      lyricsPartsWaiters.splice(0).forEach(function(fn){fn();});
    }).withFailureHandler(function(error){
      lyricsState.partsLoading=false;lyricsPartsWaiters.splice(0);
      if(typeof showLyricsError==='function')showLyricsError(error);
    }).getLyricsParts();
  }
  function renderLyrics(){return document.getElementById('lyricsPageTemplate').innerHTML.replace('__LYRICS_LOADING__',renderUniverseLoading());}
  function applyLyricsData(data){
    lyricsState.catalog=data.songs||[];
    if(Array.isArray(data.mainGroups)){LYRICS_GROUPS.splice(0,LYRICS_GROUPS.length,...data.mainGroups.filter(function(n){return n!=='BMSG ALLSTARS';}),'BMSG ALLSTARS');}
    if(Array.isArray(data.unitGroups)){const tail=['BMSG ALLSTARS'];LYRICS_UNITS.splice(0,LYRICS_UNITS.length,'ALL',...data.unitGroups.filter(function(n){return n!=='ALL'&&tail.indexOf(n)<0;}),...tail,'その他ユニット');}
    const units=[...new Set(lyricsState.catalog.filter(function(s){return s.category==='UNIT';}).map(function(s){return s.unitCategory;}))];units.forEach(function(n){if(n&&!LYRICS_UNITS.includes(n))LYRICS_UNITS.push(n);});
    // 本文は一覧と別に、裏で読む（getLyricsParts）。古い応答に本文が入っていればそれを使う
    if(data.partsBySong){lyricsState.partsBySong=data.partsBySong;lyricsState.partsLoaded=true;}else ensureLyricsParts_();
    lyricsState.groupColors=data.groupColors||{};
    const params=lyricsState.initialParams||{};
    if(params.song){
      lyricsState.group=params.group||'';
      lyricsState.unit=params.unit||'';
      openLyricsSong(lyricArg(params.song),false);
    }else if(params.group){
      lyricsState.group=params.group;
      lyricsState.unit=params.unit||'';
      if(params.group==='BMSG ALLSTARS')renderLyricsAllStars();
      else renderLyricsGroupSongs();
    }else showLyricsGroups(false);
  }
  function initLyricsPage(params){
    lyricsState.initialParams=params||{};
    loadLyricsKaraokeRoom();
    // 曲の一覧は共通の一時保存（gas-shim）からすぐ返る
    google.script.run.withSuccessHandler(applyLyricsData).withFailureHandler(showLyricsError).getLyricsCatalog();
  }
  function setLyricsUrl(values){
    const params={page:'lyrics'};
    Object.keys(values||{}).forEach(function(key){if(values[key])params[key]=values[key];});
    google.script.history.push(params,params,'');
  }
  function lyricArg(value){return encodeURIComponent(String(value));}
  function lyricsGroupColor(name){return lyricsState.groupColors[name]||'#ffffff';}
    function unitSongs(unit){return lyricsState.catalog.filter(function(song){if(unit==='ALL')return song.category==='UNIT';return song.category==='UNIT'&&song.unitCategory===unit;});}
  function groupSongs(group){if(group==='BMSG ALLSTARS')return unitSongs('ALL');return lyricsState.catalog.filter(function(song){return song.category===group;});}
      function updateLyricsKaraokeRoom(){
    const target=document.getElementById('lyricsKaraokeRoom');
    if(target)target.innerHTML=renderLyricsKaraokeRoom();
  }

  function requireLyricsUniverseUser(){
    const userId=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(userId)return userId;
    if(typeof openUserChooser==='function')openUserChooser(true);
    return '';
  }

  function loadLyricsKaraokeRoom(){
    const requestId=++lyricsState.karaokeRoomRequestId;
    const userId=requireLyricsUniverseUser();
    if(!userId){
      lyricsState.karaokeRoomReady=true;
      lyricsState.karaokeRoomUserId='';
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(null,[]);
      updateLyricsKaraokeRoom();
      return;
    }

    const canReuse=lyricsState.karaokeRoomReady===true&&lyricsState.karaokeRoomUserId===userId;
    if(!canReuse){
      lyricsState.karaokeRoomReady=false;
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(null,[]);
      updateLyricsKaraokeRoom();
    }

    google.script.run.withSuccessHandler(function(data){
      if(requestId!==lyricsState.karaokeRoomRequestId)return;
      lyricsState.karaokeRoomReady=true;
      lyricsState.karaokeRoomUserId=userId;
      lyricsState.karaokeRoom=data.room||null;
      lyricsState.karaokeHistory=data.history||[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(lyricsState.karaokeRoom,lyricsState.karaokeHistory);
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){
      if(requestId!==lyricsState.karaokeRoomRequestId)return;
      if(!canReuse){
        lyricsState.karaokeRoomReady=true;
        lyricsState.karaokeRoomUserId=userId;
        lyricsState.karaokeRoom=null;
        lyricsState.karaokeHistory=[];
        updateLyricsKaraokeRoom();
        showLyricsError(error);
      }
    }).getKaraokeBootstrap(userId);
  }

  function createLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(room){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=room;
      lyricsState.karaokeHistory=[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(lyricsState.karaokeRoom,lyricsState.karaokeHistory);
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).createKaraokeRoom(userId);
  }

  function joinLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    const input=document.getElementById('lyricsRoomInput');
    const roomId=input?input.value.trim():'';
    if(!/^\d{4}$/.test(roomId)){showLyricsError('4桁のルームIDを入力してね。');return;}
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(data){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=data.room;
      lyricsState.karaokeHistory=data.history||[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(lyricsState.karaokeRoom,lyricsState.karaokeHistory);
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).joinKaraokeRoom(userId,roomId);
  }

  function leaveLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      if(typeof setKaraokeLatestShortcutState_==='function')setKaraokeLatestShortcutState_(null,[]);
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).leaveKaraokeRoom(userId);
  }

  function openLatestLyricsKaraoke(){
    if(!lyricsState.karaokeRoom)return;
    if(!lyricsState.karaokeHistory.length){showLyricsError('まだ結果がありません');return;}
    const params={page:'karaoke',mode:'latest',room:lyricsState.karaokeRoom.roomId};
    google.script.history.push(params,params,'');
    renderRoute('karaoke',params);
  }

  function showLyricsGroup(encoded,pushUrl){const group=decodeURIComponent(encoded);lyricsState.group=group;lyricsState.unit='';lyricsState.query='';if(pushUrl!==false)setLyricsUrl({group:group});if(group==='BMSG ALLSTARS')renderLyricsAllStars();else renderLyricsGroupSongs();scrollLyricsTop();}
      function openLyricsAllStarsSong(encodedUnit,encodedSong){lyricsState.unit=decodeURIComponent(encodedUnit);openLyricsSong(encodedSong);}
  function songTime(song){const time=Date.parse(song.releaseDate||'');return Number.isFinite(time)?time:0;}
  function activeSongs(){const songs=lyricsState.group==='BMSG ALLSTARS'?unitSongs(lyricsState.unit||'ALL'):groupSongs(lyricsState.group);return songs.slice().sort(function(a,b){return songTime(b)-songTime(a)||(Number(b.songId)||0)-(Number(a.songId)||0);});}
  function activeTitle(){return lyricsState.group==='BMSG ALLSTARS'?(lyricsState.unit||'ALL'):lyricsState.group;}
  function backFromSongs(){if(lyricsState.group==='BMSG ALLSTARS'){setLyricsUrl({group:lyricsState.group});renderLyricsAllStars();}else showLyricsGroups();}
    function openLyricsSong(encoded,pushUrl){if(!lyricsState.partsLoaded){const view=document.getElementById('lyricsView');if(view)view.innerHTML=renderUniverseLoading();ensureLyricsParts_(function(){openLyricsSong(encoded,pushUrl);});return;}const songId=decodeURIComponent(encoded);const meta=lyricsState.catalog.find(function(item){return item.songId===songId;});if(!meta){showLyricsError('曲が見つかりません。');return;}lyricsState.song={songId:songId,title:meta.title,artist:meta.artist,parts:lyricsState.partsBySong[songId]||[]};lyricsState.editDraft=null;lyricsState.editDirty=false;lyricsState.editing=null;lyricsState.editingIndex=-1;if(pushUrl!==false)setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit,song:songId});renderLyricsSong();scrollLyricsTop();}
  function renderLyricsSinger(part){const items=(part.singers&&part.singers.length)?part.singers:[{name:part.singer,color:'#777777',harmony:''}];return items.map(function(singer){const mark=singer.harmony==='up'?' ↑':singer.harmony==='down'?' ↓':'';const label=singer.harmony==='sub'?'('+singer.name+')':singer.name+mark;return '<span style="color:'+escapeLyrics(singer.color)+'">'+escapeLyrics(label)+'</span>';}).join('<span class="lyrics-singer-separator"> / </span>');}
  function lyricsMicrophoneIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"></path></svg>';}
    function cloneLyricsDraftParts_(){return (lyricsState.song&&lyricsState.song.parts||[]).map(function(part){return{partOrder:part.partOrder,singer:part.singer,singers:(part.singers||[]).map(function(s){return{id:s.id||s.raw||'',raw:s.raw||'',name:s.name||'',color:s.color||'#777777',harmony:s.harmony||'',role:s.role||(s.harmony?s.harmony.toUpperCase():'MAIN')};}),lyrics:part.lyrics||''};});}
  function ensureLyricsEditDraft_(){if(!lyricsState.editDraft)lyricsState.editDraft=cloneLyricsDraftParts_();return lyricsState.editDraft;}
  function lyricsEditableParts_(){const editing=typeof isLyricsEditMode==='function'&&isLyricsEditMode();return editing?ensureLyricsEditDraft_():(lyricsState.song&&lyricsState.song.parts||[]);}
  function lyricsInsertButton_(index){return '<button class="ui-btn ui-btn-compact ui-btn-ghost lyrics-part-insert" type="button" onclick="addLyricsPartAt('+index+')" aria-label="ここにパートを追加"'+(lyricsState.editSaving?' disabled':'')+'><span>＋</span><b>パート追加</b></button>';}
  function lyricsEditPartHtml_(part,index){const saving=lyricsState.editSaving;return '<article class="ui-panel lyrics-part lyrics-edit-part"><div class="lyrics-edit-part-head"><span class="ui-label">PART '+(index+1)+'</span><div><button class="ui-btn ui-btn-compact" type="button" aria-label="上へ移動" onclick="moveLyricsPart('+index+',-1)"'+(saving||index===0?' disabled':'')+'>↑</button><button class="ui-btn ui-btn-compact" type="button" aria-label="下へ移動" onclick="moveLyricsPart('+index+',1)"'+(saving||index===ensureLyricsEditDraft_().length-1?' disabled':'')+'>↓</button><button class="ui-btn ui-btn-compact" type="button" aria-label="削除" onclick="deleteLyricsPart('+index+')"'+(saving?' disabled':'')+'>×</button></div></div><button class="ui-card lyrics-edit-part-body" type="button" onclick="openLyricsEditor('+index+')"'+(saving?' disabled':'')+'><div class="ui-name lyrics-singer">'+renderLyricsSinger(part)+'</div><p class="ui-text">'+escapeLyrics(part.lyrics||'')+'</p><small class="ui-label">編集</small></button></article>';}
    function lyricsEditSessionActive_(){
    return typeof isLyricsEditMode==='function'&&isLyricsEditMode()&&!!lyricsState.song;
  }
  function confirmDiscardLyricsChanges_(){
    if(lyricsState.editSaving){showLyricsError('保存中です');return false;}
    if(!lyricsState.editDirty)return true;
    if(!window.confirm('保存していない変更があります。破棄しますか？'))return false;
    lyricsState.editDraft=null;lyricsState.editDirty=false;lyricsState.editing=null;lyricsState.editingIndex=-1;
    const editor=document.getElementById('lyricsEditor');if(editor)editor.hidden=true;
    return true;
  }
  function returnToLyricsSongListFromSong(){
    if(lyricsEditSessionActive_()&&!confirmDiscardLyricsChanges_())return;
    if(!lyricsState.group){navigateTo('lyrics');return;}
    setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit||''});
    renderLyricsGroupSongs();
    scrollLyricsTop();
  }
  function returnToLyricsGroupsFromSong(){navigateTo('lyrics');}
  function openKaraokeFromLyrics(encoded){const songId=decodeURIComponent(encoded);navigateToWithParams('karaoke',{song:songId,group:lyricsState.group||'',unit:lyricsState.unit||''});}

  function lyricsRawAssignments_(raw){return String(raw||'').split(',').map(function(token){token=token.trim();if(!token)return null;const match=token.match(/_(up|down|sub)$/i);return{id:match?token.slice(0,-match[0].length):token,role:match?match[1].toUpperCase():'MAIN'};}).filter(Boolean);}
  function lyricsDraftAssignments_(part){if(Array.isArray(part&&part.singers)&&part.singers.length)return part.singers.map(function(s){return{id:String(s.id||s.raw||'').replace(/_(up|down|sub)$/i,''),role:String(s.role||(s.harmony?s.harmony.toUpperCase():'MAIN')).toUpperCase()};}).filter(function(s){return s.id;});return lyricsRawAssignments_(part&&part.singer);}
  function mountLyricsQuickSingerEditor_(part){const target=document.getElementById('lyricsSingerEditor');if(!target)return;mountUniverseSingerEditor(target,lyricsDraftAssignments_(part),lyricsState.singerOptions,function(){});}
  function openLyricsEditor(index){
    if(lyricsState.editSaving)return;
    const list=ensureLyricsEditDraft_(),part=list[index];if(!part)return;lyricsState.editing=part;lyricsState.editingIndex=index;document.getElementById('lyricsTextInput').value=part.lyrics||'';const saveButton=document.getElementById('lyricsSaveButton');saveButton.disabled=false;saveButton.textContent='反映';document.getElementById('lyricsEditor').hidden=false;
    if(lyricsState.singerOptions.length){mountLyricsQuickSingerEditor_(part);return;}
    const target=document.getElementById('lyricsSingerEditor');if(target)target.innerHTML=renderUniverseLoading();
    google.script.run.withSuccessHandler(function(options){lyricsState.singerOptions=options||[];if(lyricsState.editing===part)mountLyricsQuickSingerEditor_(part);}).withFailureHandler(function(error){showLyricsError(error);closeLyricsEditor();}).getLyricsSingerOptions();
  }
  function closeLyricsEditor(){document.getElementById('lyricsEditor').hidden=true;lyricsState.editing=null;lyricsState.editingIndex=-1;}
  function saveLyricsEdit(){
    if(!lyricsState.editing||lyricsState.editingIndex<0)return;
    const editor=document.getElementById('lyricsSingerEditor'),lyricsInput=document.getElementById('lyricsTextInput');
    const singers=getUniverseSingerEditorValue(editor),lyrics=lyricsInput.value.trim();
    if(!singers.length||!lyrics){showLyricsError('歌唱者と歌詞を入力してね。');return;}
    const part=ensureLyricsEditDraft_()[lyricsState.editingIndex];if(!part)return;
    const beforeAssignments=lyricsDraftAssignments_(part).map(function(s){return{id:String(s.id),role:String(s.role||'MAIN').toUpperCase()};});
    const nextAssignments=singers.map(function(s){return{id:String(s.id),role:String(s.role||'MAIN').toUpperCase()};});
    const changed=String(part.lyrics||'').trim()!==lyrics||JSON.stringify(beforeAssignments)!==JSON.stringify(nextAssignments);
    if(changed){
      part.singers=singers.map(function(s){const option=lyricsState.singerOptions.find(function(o){return String(o.id)===String(s.id);})||{};const role=String(s.role||'MAIN').toUpperCase();return{id:String(s.id),raw:String(s.id)+(role==='MAIN'?'':'_'+role.toLowerCase()),name:option.name||String(s.id),color:option.color||'#777777',harmony:role==='MAIN'?'':role.toLowerCase(),role:role};});
      part.singer=part.singers.map(function(s){return s.raw;}).join(',');
      part.lyrics=lyrics;lyricsState.editDirty=true;
    }
    closeLyricsEditor();renderLyricsSong();
  }
  function addLyricsPartAt(index){if(lyricsState.editSaving)return;const list=ensureLyricsEditDraft_();list.splice(Math.max(0,Math.min(index,list.length)),0,{partOrder:0,singer:'',singers:[],lyrics:''});lyricsState.editDirty=true;renderLyricsSong();openLyricsEditor(Math.max(0,Math.min(index,list.length-1)));}
  function moveLyricsPart(index,delta){if(lyricsState.editSaving)return;const list=ensureLyricsEditDraft_(),next=index+delta;if(next<0||next>=list.length)return;const item=list.splice(index,1)[0];list.splice(next,0,item);lyricsState.editDirty=true;renderLyricsSong();}
  function deleteLyricsPart(index){if(lyricsState.editSaving)return;const list=ensureLyricsEditDraft_();if(list.length<=1){showLyricsError('歌詞パートは1件以上必要です。');return;}if(!window.confirm('このパートを削除しますか？'))return;list.splice(index,1);lyricsState.editDirty=true;renderLyricsSong();}
  function saveLyricsSongChanges(){
    if(lyricsState.editSaving)return;const list=ensureLyricsEditDraft_();if(!list.length){showLyricsError('歌詞パートは1件以上必要です。');return;}
    const parts=[];for(let index=0;index<list.length;index++){const part=list[index],singers=lyricsDraftAssignments_(part),lyrics=String(part.lyrics||'').trim();if(!singers.length){showLyricsError('PART '+(index+1)+' の歌唱者を設定してね。');return;}if(!lyrics){showLyricsError('PART '+(index+1)+' の歌詞を入力してね。');return;}parts.push({singers:singers,lyrics:lyrics});}
    const userId=requireLyricsUniverseUser();if(!userId)return;lyricsState.editSaving=true;renderLyricsSong();
    google.script.run.withSuccessHandler(function(){
      const savedParts=ensureLyricsEditDraft_().map(function(part,index){return{partOrder:index+1,singer:(part.singers||[]).map(function(s){const role=String(s.role||(s.harmony?s.harmony.toUpperCase():'MAIN')).toUpperCase();return String(s.id||'')+(role==='MAIN'?'':'_'+role.toLowerCase());}).filter(Boolean).join(','),singers:(part.singers||[]).map(function(s){return Object.assign({},s);}),lyrics:String(part.lyrics||'').trim()};});
      lyricsState.editSaving=false;lyricsState.editDirty=false;lyricsState.editDraft=null;lyricsState.song.parts=savedParts;lyricsState.partsBySong[lyricsState.song.songId]=savedParts;
      const meta=lyricsState.catalog.find(function(item){return item.songId===lyricsState.song.songId;});if(meta)meta.partCount=savedParts.length;
      renderLyricsSong();if(typeof showToast==='function')showToast('変更を保存しました');
    }).withFailureHandler(function(error){lyricsState.editSaving=false;renderLyricsSong();showLyricsError(error);}).saveLyricsSongParts({userId:userId,songId:lyricsState.song.songId,parts:parts});
  }
  function scrollLyricsTop(){const scroller=document.querySelector('.page-wrap');if(scroller)scroller.scrollTo({top:0,behavior:'smooth'});}
  function showLyricsError(error){const message=error&&error.message?error.message:String(error);if(typeof showToast==='function')showToast(message);else alert(message);}
  function escapeLyrics(value){const div=document.createElement('div');div.textContent=String(value==null?'':value);return div.innerHTML;}
  window.addEventListener('beforeunload',function(event){if(typeof currentRoute!=='undefined'&&currentRoute==='lyrics'&&typeof lyricsState!=='undefined'&&(lyricsState.editSaving||lyricsState.editDirty)){event.preventDefault();event.returnValue='';}});
</script>
