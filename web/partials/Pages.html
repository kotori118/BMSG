<script>
    // First visit per session plays the intro (same rule as HOME). Used by data/lab.
    const universeIntroSeen = {};
    function universeIntroClass(key) {
      if (universeIntroSeen[key]) return '';
      universeIntroSeen[key] = true;
      return 'category-intro';
    }
    // Icons for the data/lab tiles (new design): white line + soft fill (class "s") + solid accents (class "f").
    function categoryIconSvg(name) {
      const paths = {
        profile: '<rect class="s" x="3" y="5" width="18" height="14" rx="2"/><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.8" cy="10.6" r="2.3"/><path d="M5.6 16.2c.6-1.7 1.8-2.6 3.2-2.6s2.6.9 3.2 2.6"/><path d="M14.5 9.5h3.5M14.5 12.5h3.5M14.5 15.5h2"/>',
        lyrics: '<path class="s" d="M6.5 3h7.8L18.5 7.2V20a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M6.5 3h7.8L18.5 7.2V20a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14.3 3v4.2h4.2"/><path d="M12.8 16.2v-5.4l3-.9"/><circle class="f" cx="11.1" cy="16.3" r="1.7"/><path d="M8.3 9h2.7M8.3 11.8h2"/>',
analysis: '<path d="M12 3.4 19.2 7.7v8.6L12 20.6 4.8 16.3V7.7z"/><path d="M12 12V3.4M12 12l7.2 4.3M12 12l-7.2 4.3" class="b"/><path class="s" d="M12 6.6 16.6 9.3v5.4L12 17.4l-4.6-2.7V9.3z"/><path d="M12 6.6 16.6 9.3v5.4L12 17.4l-4.6-2.7V9.3z"/><circle class="f" cx="12" cy="6.6" r="1.25"/><circle class="f" cx="16.6" cy="14.7" r="1.25"/><circle class="f" cx="7.4" cy="14.7" r="1.25"/>',
        quiz: '<path class="s" d="M5 4h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 16h-7.5L7 20v-4H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 4z"/><path d="M5 4h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 16h-7.5L7 20v-4H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 4z"/><path d="M10 8.2a2 2 0 1 1 2.9 1.8c-.6.3-.9.7-.9 1.4"/><circle class="f" cx="12" cy="13.6" r=".9"/>',
        cards: '<rect x="3.6" y="6.2" width="10" height="14" rx="1.4" transform="rotate(-10 8.6 13.2)"/><rect class="s" x="9.4" y="3.6" width="10.5" height="15" rx="1.5" transform="rotate(7 14.65 11.1)"/><rect x="9.4" y="3.6" width="10.5" height="15" rx="1.5" transform="rotate(7 14.65 11.1)"/><path class="f" d="m14.6 7.6 1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2.1 1.1.4-2.3-1.7-1.6 2.3-.3z"/>',
poker: '<circle cx="12" cy="12" r="9"/><circle class="s" cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.4" class="b"/><path class="f" d="M12 6.4c-.9 1.9-4.9 4.3-4.9 7.3a2.6 2.6 0 0 0 4.4 1.8l-.7 2.4h3.0l-.7-2.4a2.6 2.6 0 0 0 4.4-1.8c0-3-4-5.4-4.9-7.3z"/>',
        cover: '<rect class="s" x="9" y="2.8" width="6" height="11" rx="3"/><rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M6.2 11a5.8 5.8 0 0 0 11.6 0M12 16.8V21M9 21h6"/><path d="M3 9.5v3M20.9 9.5v3"/><path class="f" d="M9 8h6v1.4H9z"/>'
      };
      // Corner brackets frame every icon like a viewfinder (class "b": thin, dim).
      const frame = '<path class="b" d="M1.5 6V1.5H6M18 1.5h4.5V6M22.5 18v4.5H18M6 22.5H1.5V18"/>';
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + frame + (paths[name] || '') + '</svg>';
    }
</script>
<script>
    function renderData() {
      return `
        <section class="view category-page ${universeIntroClass('data')}">
          <header class="category-header">
            <h1 class="category-title"><span class="category-title-en">DATA</span></h1>
          </header>

          <div class="category-cards data-grid">
            <button class="category-card" onclick="navigateTo('profile')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">プロフィール</span>
                  <span class="category-card-desc">メンバーの情報・相性・マップ</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('profile')}</span>
              </span>
            </button>

            <button class="category-card" onclick="navigateTo('lyrics')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">歌詞</span>
                  <span class="category-card-desc">歌詞・歌割り・カラオケ</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('lyrics')}</span>
              </span>
            </button>

            <button class="category-card" onclick="navigateTo('analysis')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">分析</span>
                  <span class="category-card-desc">BE:FIRSTの歌唱とセンターの秒数</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('analysis')}</span>
              </span>
            </button>
          </div>
        </section>
      `;
    }

    function renderLab() {
      return `
        <section class="view category-page ${universeIntroClass('lab')}">
          <header class="category-header">
            <h1 class="category-title"><span class="category-title-en">LAB</span></h1>
          </header>

          <div class="category-cards lab-grid">
            <button class="category-card" onclick="navigateTo('quiz')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">クイズ</span>
                  <span class="category-card-desc">歌詞から曲とメンバーを当てる</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('quiz')}</span>
              </span>
            </button>

            <button class="category-card" onclick="navigateTo('cards')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">トレーディング<wbr>カード</span>
                  <span class="category-card-desc">メンバーのカードを集める</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('cards')}</span>
              </span>
            </button>

            <button class="category-card" onclick="navigateTo('poker')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">ポーカー</span>
                  <span class="category-card-desc">カードで役を作って投票する</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('poker')}</span>
              </span>
            </button>

            <button class="category-card" onclick="navigateTo('cover')">
              <span class="category-card-inner">
                <span class="category-card-meta">
                  <span class="category-card-name">カバーメーカー</span>
                  <span class="category-card-desc">歌割りを組み替えて保存する</span>
                </span>
                <span class="category-card-symbol">${categoryIconSvg('cover')}</span>
              </span>
            </button>
          </div>
        </section>
      `;
    }

    function renderPlaceholder(route) {
      const meta = ROUTES[route];

      return `
        <section class="view">
          <div class="section-head">
            <p class="eyebrow">${escapeHtml(meta.parent)}</p>
            <h1 class="title">${escapeHtml(meta.title)}</h1>
          </div>

          <div class="placeholder">
            <p>準備中のページです。</p>
          </div>
        </section>
      `;
    }

    function render404(pageValue) {
      return `
        <section class="view">
          <div class="section-head">
            <p class="eyebrow">404</p>
            <h1 class="title">ページが見つかりません</h1>
          </div>

          <div class="placeholder">
            <p>
              不明なページ：
              ${escapeHtml(pageValue || '未指定')}
            </p>

            <button
              class="home-link"
              onclick="navigateTo('home')"
            >HOMEへ戻る</button>
          </div>
        </section>
      `;
    }

</script>
