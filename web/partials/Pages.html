      return 'category-intro';

analysis: '<defs><mask id="ia-m" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><circle cx="16.4" cy="11.4" r="6.2" fill="#000"/></mask></defs><g mask="url(#ia-m)"><rect x="3.4" y="12.6" width="3.4" height="7.8" rx=".6"/><rect x="8.2" y="8.8" width="3.4" height="11.6" rx=".6"/><rect x="13" y="4.2" width="3.4" height="16.2" rx=".6"/></g><circle cx="16.4" cy="11.4" r="4.4"/><path d="M19.6 14.6l2.6 2.6"/><path class="b" d="M1.5 6V1.5H6M18 1.5h4.5V6M22.5 18v4.5H18M6 22.5H1.5V18"/>',

      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + frame + (paths[name] || '') + '</svg>';

<script>

    function renderPlaceholder(route) {
      const meta = ROUTES[route];

      return `
        <section class="view">
          <div class="section-head">
            <p class="eyebrow">${escapeHtml(meta.parent)}</p>
            <h1 class="title">${escapeHtml(meta.title)}</h1>
          </div>

          <div class="placeholder">
            <p>準備中のページです。</p>
          </div>
        </section>
      `;
    }

    function render404(pageValue) {
      return `
        <section class="view">
          <div class="section-head">
            <p class="eyebrow">404</p>
            <h1 class="title">ページが見つかりません</h1>
          </div>

          <div class="placeholder">
            <p>
              不明なページ：
              ${escapeHtml(pageValue || '未指定')}
            </p>

            <button
              class="home-link"
              onclick="navigateTo('home')"
            >HOMEへ戻る</button>
          </div>
        </section>
      `;
    }

</script>
