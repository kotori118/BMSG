<style>
  /* =========================================================
     BMSG Universe 新デザイン（モノトーン）
     - 画面ごとに ROUTES の theme を 'v2' にすると、その画面だけに当たる（body.ui-v2）。
     - まだ切り替えていない画面は、これまでの見た目のまま動く。
     - 色・形・文字はこのファイルの先頭で一か所に決める。
     ========================================================= */

  /* ---- 全画面共通：左上のメニュー ---- */
  .utility-actions .utility-menu { margin-right: 0; }
  body.is-section-root .utility-menu,
  body.ui-v2 .utility-menu,
  .utility-menu:has(+ .utility-brand + .utility-home[hidden]) { margin-right: auto; }
  .utility-brand { display: none; }

  .app-menu { position: fixed; inset: 0; z-index: 150; }
  .app-menu[hidden] { display: none; }
  .app-menu-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
  .app-menu-panel {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(360px, 88vw);
    overflow-y: auto;
    padding: max(18px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
    border-right: 1px solid rgba(255, 255, 255, .12);
    background: #0d0d0d;
    color: #fff;
    font-family: "Noto Sans JP", "Zen Kaku Gothic New", sans-serif;
    animation: app-menu-in 220ms cubic-bezier(.22, .8, .28, 1);
  }
  @keyframes app-menu-in { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .app-menu-panel { animation: none; } }
  .app-menu-panel .app-menu-close {
    display: grid;
    place-items: center;
    width: 48px;
    min-height: 48px;
    margin: 0 10px 8px auto;
    padding: 0;
    border: 0;
    background: none;
    color: #fff;
    cursor: pointer;
  }
  .app-menu-close svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .app-menu-group {
    margin: 24px 22px 8px;
    color: rgba(255, 255, 255, .45);
    font-size: var(--ui-fs-label);
    font-weight: 700;
    letter-spacing: .2em;
  }
  .app-menu-panel button:not(.app-menu-close) {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 54px;
    padding: 0 44px 0 22px;
    border: 0;
    border-top: 1px solid rgba(255, 255, 255, .1);
    background: none;
    color: inherit;
    font: inherit;
    font-size: var(--ui-fs-body);
    font-weight: 700;
    letter-spacing: var(--ui-ls-body);
    text-align: left;
    cursor: pointer;
  }
  .app-menu-panel button:not(.app-menu-close)::after {
    content: "";
    position: absolute;
    right: 22px;
    width: 8px;
    height: 8px;
    border-top: 1.5px solid rgba(255, 255, 255, .6);
    border-right: 1.5px solid rgba(255, 255, 255, .6);
    transform: rotate(45deg);
  }
  .app-menu-panel button:not(.app-menu-close):hover,
  .app-menu-panel button:not(.app-menu-close):focus-visible { background: #171717; outline: none; }
  .app-menu-panel button[aria-current="page"] { background: #f2f2f2; color: #111; }
  .app-menu-panel button[aria-current="page"]::after { border-color: #111; }

  /* ---- 新デザインの基本 ---- */
  body.ui-v2 {
    --ui-bg: #0e0e0e;
    --ui-panel: #181818;
    --ui-panel-2: #1f1f1f;
    --ui-line: rgba(255, 255, 255, .12);
    --ui-line-strong: rgba(255, 255, 255, .42);
    --ui-text: #fff;
    --ui-text-sub: rgba(255, 255, 255, .56);
    --ui-active-bg: #f2f2f2;
    --ui-active-text: #111;
    --ui-radius: 6px;
    --ui-font: "Noto Sans JP", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --ui-font-display: Inter, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;   /* 英字の大きな見出し */
    color: var(--ui-text);
    background: var(--ui-bg);
  }
  html:has(body.ui-v2) { background: #0e0e0e; }
  body.ui-v2 .app-shell {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, .06), transparent 60%),
      var(--ui-bg);
  }
  body.ui-v2 .page-wrap { background: transparent; color: var(--ui-text); }

  /* ---- 上のバー（メニュー・サイト名・検索） ---- */
  body.ui-v2 .utility-actions {
    align-items: center;
    border-bottom: 1px solid var(--ui-line);
    background: rgba(14, 14, 14, .92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  body.ui-v2 .utility-brand {
    display: block;
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    color: #fff;
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-body);
    font-weight: 900;
    letter-spacing: .02em;
    white-space: nowrap;
    pointer-events: none;
  }
  body.ui-v2 .utility-home,
  body.ui-v2 .utility-settings { display: none !important; }
  body.ui-v2 .app-shell .utility-actions .utility-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: var(--ui-radius);
    color: #fff;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  @media (hover: hover) {
    body.ui-v2 .app-shell .utility-actions .utility-btn:not(:disabled):hover {
      border: 0;
      color: #fff;
      background: #1c1c1c;
      box-shadow: none;
    }
  }

  /* ---- 下のメニュー（HOME・DATA・LAB）：選択中は白く塗る ---- */
  body.ui-v2 .bottom-nav {
    gap: 10px;
    border-top: 1px solid var(--ui-line);
    background: rgba(14, 14, 14, .94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  body.ui-v2 .nav-btn {
    border: 0;
    border-radius: var(--ui-radius);
    color: rgba(255, 255, 255, .62);
    background: transparent;
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: .2em;
  }
  body.ui-v2 .nav-btn.active { color: var(--ui-active-text); background: var(--ui-active-bg); }
  body.ui-v2 .nav-btn .nav-icon svg { stroke-width: 1.7; }

  /* ---- データ・ラボ：見出し ---- */
  body.ui-v2 .category-page { padding-top: 96px; }
  body.ui-v2 .category-header {
    margin-bottom: 22px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--ui-line);
  }
  body.ui-v2 .category-title {
    display: grid;
    gap: 10px;
    margin: 0;
    color: #fff;
    text-transform: none;
    letter-spacing: 0;
    line-height: 1;
  }
  body.ui-v2 .category-title-en {
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-display);
    font-weight: 900;
    letter-spacing: -.045em;
    line-height: .88;
  }
  body.ui-v2 .category-title-ja {
    display: block;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 700;
    letter-spacing: .22em;
  }
  .category-title-ja { display: none; }

  /* ---- データ・ラボ：タイル（方眼の上にひし形の枠とアイコン） ---- */
  body.ui-v2 .category-cards {
    counter-reset: ui-tile;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    border: 0;
  }
  body.ui-v2 .category-card {
    position: relative;
    min-height: 0;
    padding: 0;
    border: 1px solid var(--ui-line);
    border-radius: var(--ui-radius);
    overflow: hidden;
    color: #fff;
    background: var(--ui-panel);
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transform: none;
    text-align: left;
    transition: border-color 180ms ease, transform 180ms ease;
  }
  body.ui-v2 .category-card::before,
  body.ui-v2 .category-card::after { display: none; }
  body.ui-v2 .category-card-inner {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    width: 100%;
    height: 100%;
    gap: 0;
  }
  body.ui-v2 .category-card-symbol {
    order: -1;
    position: relative;
    display: grid;
    place-items: center;
    width: 100%;
    height: auto;
    aspect-ratio: 1.45;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    border-radius: 0;
    color: #fff;
    background:
      linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px) 0 0 / 22px 22px,
      linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--ui-panel-2);
    -webkit-mask-image: none;
  }
  /* 方眼を中央に寄せて、周りはなじませる */
  body.ui-v2 .category-card-symbol::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 30%, var(--ui-panel) 92%);
    pointer-events: none;
  }
  /* ひし形の枠 */
  body.ui-v2 .category-card-symbol::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    width: 36%;
    aspect-ratio: 1;
    border: 1px solid var(--ui-line-strong);
    background: #121212;
    transform: translate(-50%, -50%) rotate(45deg);
    transition: border-color 180ms ease, background 180ms ease;
  }
  body.ui-v2 .category-card-symbol svg {
    position: relative;
    z-index: 2;
    width: 27%;
    height: auto;
    aspect-ratio: 1;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.45;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, .18));
  }
  /* 2トーンのアイコン：薄い塗り（.s）とはっきりした塗り（.f） */
  body.ui-v2 .category-card-symbol svg .s { fill: currentColor; fill-opacity: .16; stroke: none; }
  body.ui-v2 .category-card-symbol svg .f { fill: currentColor; stroke: none; }
  body.ui-v2 .category-card-symbol svg .b { fill: none; stroke: currentColor; stroke-width: .9; opacity: .55; }
  body.ui-v2 .category-card { counter-increment: ui-tile; }
  body.ui-v2 .category-card-meta {
    display: grid;
    gap: 6px;
    padding: 14px 16px 20px;
    text-align: left;
  }
  /* タイルの番号（01, 02 …） */
  body.ui-v2 .category-card-meta::before {
    content: counter(ui-tile, decimal-leading-zero);
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: .24em;
  }
  body.ui-v2 .category-card-name {
    color: #fff;
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1.4;
    text-transform: none;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    word-break: keep-all;      /* 改行は <wbr> の位置で */
    overflow-wrap: normal;
  }
  body.ui-v2 .category-card-desc {
    text-wrap: pretty;
    display: block;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 500;
    line-height: 1.65;
  }
  .category-card-desc { display: none; }
  @media (hover: hover) {
    body.ui-v2 .category-card:hover { border-color: var(--ui-line-strong); background: var(--ui-panel); }
    body.ui-v2 .category-card:hover .category-card-symbol::before { border-color: #fff; background: #161616; }
  }
  body.ui-v2 .category-card:active { transform: scale(.985); background: var(--ui-panel); }
  body.ui-v2 .category-card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- ボタン（白い枠線の四角／白く塗った丸） ---- */
  body.ui-v2 .ui-btn,
  body.ui-v2 .universe-recovery-retry {
    min-height: var(--ui-button-h);
    padding: 0 24px;
    border: 1px solid #fff;
    border-radius: var(--ui-radius);
    color: #fff;
    background: transparent;
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    font-weight: 700;
    letter-spacing: .16em;
    cursor: pointer;
  }
  body.ui-v2 .ui-btn-solid { color: #111; background: #f2f2f2; border-color: #f2f2f2; }

  /* ---- 通知・読み込み・エラー ---- */
  body.ui-v2 .universe-toast {
    border: 0;
    border-radius: var(--ui-radius);
    color: #111;
    background: #f2f2f2;
    box-shadow: 0 14px 32px rgba(0, 0, 0, .55);
    letter-spacing: .06em;
  }
  body.ui-v2 .universe-loading { color: var(--ui-text-sub); }
  body.ui-v2 .universe-recovery-state {
    border: 1px solid var(--ui-line);
    border-radius: var(--ui-radius);
    background: var(--ui-panel);
  }
  body.ui-v2 .universe-recovery-state h2 { color: #fff; font-family: var(--ui-font); letter-spacing: .12em; }

  /* ---- ホーム（データ・ラボと同じ質感） ---- */
  body.ui-v2 .home { padding-top: 96px; }
  body.ui-v2 .home-title-wrap { width: 100%; margin: 0; }
  body.ui-v2 .home-title {
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-display);
    font-weight: 900;
    letter-spacing: -.045em;
    line-height: .88;
    color: #fff;
    text-shadow: none;
  }
  body.ui-v2 .home-title .line { display: block; }
  body.ui-v2 .home-divider { display: none; }

  body.ui-v2 .home-dynamic { margin-top: 22px; }
  body.ui-v2 .home-today-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }

  /* 今日の1曲・ラッキーメンバーは、タイルと同じ枠・面 */
  body.ui-v2 .home-feature-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px 20px 22px;
    border: 1px solid var(--ui-line);
    border-radius: var(--ui-radius);
    background: var(--ui-panel);
    color: #fff;
    box-shadow: none;
    overflow: hidden;
    text-align: left;
  }
  body.ui-v2 .home-feature-card:before,
  body.ui-v2 .home-member-card:before,
  body.ui-v2 .home-birthday-card:after { display: none; }
  body.ui-v2 .home-feature-label {
    color: var(--ui-text-sub);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: .24em;
    text-transform: uppercase;
  }
  body.ui-v2 .home-feature-card strong {
    color: #fff;
    font-family: var(--ui-font);
    font-size: var(--ui-fs-title);
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.3;
  }
  body.ui-v2 .home-song-title {
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-title);
    font-weight: 900;
    letter-spacing: -.02em;
    line-height: 1.05;
    text-transform: uppercase;
  }
  body.ui-v2 .home-feature-card small {
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 500;
  }
  body.ui-v2 .home-feature-card b {
    align-self: flex-start;
    margin-top: 4px;
    padding: 9px 16px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    color: #fff;
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: .2em;
  }
  body.ui-v2 .home-song-card:hover,
  body.ui-v2 .home-member-card:not(.home-birthday-card):hover { border-color: var(--ui-line-strong); background: var(--ui-panel-2); }
  body.ui-v2 .home-feature-card:active { transform: scale(.985); }
  body.ui-v2 .home-birthday-card { gap: 12px; }
  body.ui-v2 .home-birthday-copy strong { font-size: var(--ui-fs-heading); }
  body.ui-v2 .home-birthday-member {
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: transparent;
    color: #fff;
  }
  body.ui-v2 .home-birthday-member span { color: #fff; font-family: var(--ui-font); font-weight: 700; }
  body.ui-v2 .home-birthday-member b { color: var(--ui-text-sub); font-family: var(--ui-font-display); letter-spacing: .16em; }
  body.ui-v2 .home-birthday-sparkle,
  body.ui-v2 .sparkle-one { display: none; }
  body.ui-v2 .home-state { border: 1px dashed var(--ui-line-strong); border-radius: var(--ui-radius); background: var(--ui-panel); }
  body.ui-v2 .home-state button,
  body.ui-v2 .universe-recovery-retry { border: 1px solid #fff; border-radius: var(--ui-radius); background: transparent; color: #fff; }
  body.ui-v2 .home-skeleton-card { background: var(--ui-panel); }
  /* 古いホームの絶対配置・装飾を打ち消す */
  body.ui-v2 .home::before,
  body.ui-v2 .home::after,
  body.ui-v2 .home-title-wrap::before { display: none !important; content: none !important; }
  body.ui-v2 .home-feature-card > * { position: static !important; top: auto !important; left: auto !important; right: auto !important; bottom: auto !important; }
  body.ui-v2 .home-feature-card strong { font-size: var(--ui-fs-title) !important; text-shadow: none; }
  body.ui-v2 .home-feature-label { order: -1; }
  body.ui-v2 .home-song-title { font-size: var(--ui-fs-title) !important; }
  body.ui-v2 .home-feature-card > .home-feature-label { position: static !important; }

  /* ---- 画面を開いたときの動き（ホームと同じ：見出しが浮き上がり、タイルが順に出る） ---- */
  @keyframes uiRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes uiRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  body.ui-v2 .category-intro .category-title-en { opacity: 0; animation: uiRise 260ms var(--ease) 180ms forwards; }
  body.ui-v2 .category-intro .category-header { position: relative; }
  body.ui-v2 .category-intro .category-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: rgba(255, 255, 255, .55); transform-origin: left center; transform: scaleX(0);
    animation: uiRule 420ms var(--ease) 340ms forwards;
  }
  body.ui-v2 .category-intro .category-card { opacity: 0; animation: uiRise 300ms var(--ease) forwards; }
  body.ui-v2 .category-intro .category-card:nth-child(1) { animation-delay: 420ms; }
  body.ui-v2 .category-intro .category-card:nth-child(2) { animation-delay: 500ms; }
  body.ui-v2 .category-intro .category-card:nth-child(3) { animation-delay: 580ms; }
  body.ui-v2 .category-intro .category-card:nth-child(4) { animation-delay: 660ms; }
  body.ui-v2 .category-intro .category-card:nth-child(n+5) { animation-delay: 700ms; }
  @media (prefers-reduced-motion: reduce) {
    body.ui-v2 .category-intro .category-title-en,
    body.ui-v2 .category-intro .category-header::after,
    body.ui-v2 .category-intro .category-card { animation: none; opacity: 1; transform: none; }
    body.ui-v2 .category-intro .category-header::after { transform: none; }
  }


  /* ---- 分析（中の画面）：見出し・タブ・カードを共通ルールに合わせる ---- */
  body.ui-v2 .analysis-page { padding-top: 96px; }
  body.ui-v2 .analysis-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--ui-line);
  }
  body.ui-v2 .analysis-service-back {
    flex: none;
    width: var(--ui-button-h);
    height: var(--ui-button-h);
    min-height: var(--ui-button-h);
    padding: 0;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    color: #fff;
    background: transparent;
    font-size: 22px;
    line-height: 1;
  }
  body.ui-v2 .analysis-title {
    margin: 0;
    color: #fff;
    font-family: var(--ui-font-display);
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 900;
    letter-spacing: -.035em;
    line-height: .95;
    text-transform: uppercase;
  }
  body.ui-v2 .analysis-local-nav {
    display: flex;
    overflow-x: auto;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
  }
  body.ui-v2 .analysis-tab {
    flex: 1 0 auto;
    min-height: var(--ui-tab-h);
    padding: 0 10px;
    border: 0;
    border-right: 1px solid var(--ui-line);
    border-radius: 0;
    background: transparent;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
  }
  body.ui-v2 .analysis-tab:last-child { border-right: 0; }
  body.ui-v2 .analysis-tab.active { color: var(--ui-active-text); background: var(--ui-active-bg); }
  body.ui-v2 .analysis-card,
