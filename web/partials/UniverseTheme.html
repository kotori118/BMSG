<style>
  /* =========================================================
     BMSG Universe 新デザイン（黒基調・モノクロ・縦長の英字見出し）
     - 画面ごとに ROUTES の theme を 'v2' にすると、その画面だけに当たる（body.ui-v2）。
     - まだ切り替えていない画面は、これまでの見た目のまま動く。
     - 色・形・文字はこのファイルの先頭で一か所に決める。
     ========================================================= */

  /* ---- 全画面共通：左上のメニュー ---- */
  .utility-actions .utility-menu { margin-right: 0; }
  body.is-section-root .utility-menu,
  body.ui-v2 .utility-menu,
  .utility-menu:has(+ .utility-brand + .utility-home[hidden]) { margin-right: auto; }
  .utility-brand { display: none; }

  .app-menu { position: fixed; inset: 0; z-index: 150; }
  .app-menu[hidden] { display: none; }
  .app-menu-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
  .app-menu-panel {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(360px, 88vw);
    overflow-y: auto;
    padding: max(18px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
    border-right: 1px solid rgba(255, 255, 255, .14);
    background: #000;
    color: #fff;
    font-family: "Noto Sans JP", "Zen Kaku Gothic New", sans-serif;
    animation: app-menu-in 200ms cubic-bezier(.22, .8, .28, 1);
  }
  @keyframes app-menu-in { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .app-menu-panel { animation: none; } }
  .app-menu-panel .app-menu-close {
    display: grid;
    place-items: center;
    width: 48px;
    min-height: 48px;
    margin: 0 10px 8px auto;
    padding: 0;
    border: 0;
    background: none;
    color: #fff;
    cursor: pointer;
  }
  .app-menu-close svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .app-menu-group {
    margin: 22px 22px 8px;
    color: rgba(255, 255, 255, .5);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .16em;
  }
  .app-menu-panel button:not(.app-menu-close) {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 54px;
    padding: 0 44px 0 22px;
    border: 0;
    border-top: 1px solid rgba(255, 255, 255, .12);
    background: none;
    color: inherit;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .06em;
    text-align: left;
    cursor: pointer;
  }
  .app-menu-panel button:not(.app-menu-close)::after {
    content: "";
    position: absolute;
    right: 22px;
    width: 8px;
    height: 8px;
    border-top: 1.5px solid rgba(255, 255, 255, .7);
    border-right: 1.5px solid rgba(255, 255, 255, .7);
    transform: rotate(45deg);
  }
  .app-menu-panel button:not(.app-menu-close):hover,
  .app-menu-panel button:not(.app-menu-close):focus-visible { background: #161616; outline: none; }
  .app-menu-panel button[aria-current="page"] { background: #1b1b1b; box-shadow: inset 3px 0 0 #fff; }

  /* ---- 新デザインの基本 ---- */
  body.ui-v2 {
    --ui-bg: #000;
    --ui-panel: #1b1b1b;
    --ui-panel-hover: #242424;
    --ui-line: rgba(255, 255, 255, .14);
    --ui-line-strong: rgba(255, 255, 255, .9);
    --ui-text: #fff;
    --ui-text-sub: rgba(255, 255, 255, .6);
    --ui-accent: var(--universe-accent, #9cecff);
    --ui-radius: 8px;
    --ui-font: "Noto Sans JP", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --ui-font-display: Oswald, "Noto Sans JP", sans-serif;   /* 英字の見出し（縦長・太字） */
    --ui-font-num: Oswald, "Exo 2", sans-serif;
    color: var(--ui-text);
    background: var(--ui-bg);
  }
  html:has(body.ui-v2) { background: #000; }
  body.ui-v2 .app-shell,
  body.ui-v2 .page-wrap { background: var(--ui-bg); color: var(--ui-text); }

  /* ---- 上のバー（メニュー・サイト名・検索） ---- */
  body.ui-v2 .utility-actions {
    align-items: center;
    border-bottom: 1px solid var(--ui-line);
    background: #000;
  }
  body.ui-v2 .utility-brand {
    display: block;
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    color: #fff;
    font-family: var(--ui-font-display);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .08em;
    white-space: nowrap;
    pointer-events: none;
  }
  body.ui-v2 .utility-home,
  body.ui-v2 .utility-settings { display: none !important; }
  body.ui-v2 .app-shell .utility-actions .utility-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 0;
    color: #fff;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  @media (hover: hover) {
    body.ui-v2 .app-shell .utility-actions .utility-btn:not(:disabled):hover {
      border: 0;
      color: #fff;
      background: #161616;
      box-shadow: none;
    }
  }

  /* ---- 下のメニュー（HOME・DATA・LAB） ---- */
  body.ui-v2 .bottom-nav {
    border-top: 1px solid var(--ui-line);
    background: rgba(0, 0, 0, .94);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.ui-v2 .nav-btn {
    position: relative;
    border: 0;
    border-radius: 0;
    color: rgba(255, 255, 255, .45);
    background: transparent;
    font-family: var(--ui-font-display);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .14em;
  }
  body.ui-v2 .nav-btn.active { color: #fff; background: transparent; }
  body.ui-v2 .nav-btn.active::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 2px;
    width: 28px;
    height: 2px;
    background: #fff;
    transform: translateX(-50%);
  }

  /* ---- データ・ラボの一覧 ---- */
  body.ui-v2 .category-page { padding-top: 104px; }
  body.ui-v2 .category-title {
    color: #fff;
    font-family: var(--ui-font);
    font-size: clamp(28px, 7.5vw, 36px);
    font-weight: 700;
    letter-spacing: .08em;
    line-height: 1.2;
    text-transform: none;
  }
  body.ui-v2 .category-cards { gap: 0; border-top: 1px solid var(--ui-line); }
  body.ui-v2 .category-card {
    position: relative;
    min-height: 84px;
    padding: 16px 48px 16px 18px;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    border-radius: 0;
    color: #fff;
    background: var(--ui-panel);
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transform: none;
  }
  body.ui-v2 .category-card::before { display: none; }
  body.ui-v2 .category-card::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 22px;
    width: 9px;
    height: 9px;
    border-top: 1.5px solid rgba(255, 255, 255, .75);
    border-right: 1.5px solid rgba(255, 255, 255, .75);
    transform: translateY(-50%) rotate(45deg);
  }
  body.ui-v2 .category-card:hover { background: var(--ui-panel-hover); }
  body.ui-v2 .category-card:active { transform: none; background: var(--ui-panel-hover); }
  body.ui-v2 .category-card-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
  }
  body.ui-v2 .category-card-meta { display: grid; gap: 4px; text-align: left; }
  body.ui-v2 .category-card-name {
    color: #fff;
    font-family: var(--ui-font);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1.4;
    text-transform: none;
  }
  body.ui-v2 .category-card-desc {
    display: block;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.5;
  }
  .category-card-desc { display: none; }
  body.ui-v2 .category-card-symbol {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 1px solid var(--ui-line);
    border-radius: 50%;
    color: #fff;
  }
  body.ui-v2 .category-card-symbol svg { width: 22px; height: 22px; stroke: currentColor; }

  /* ---- ボタン（白い枠線の四角／白く塗った丸） ---- */
  body.ui-v2 .ui-btn,
  body.ui-v2 .universe-recovery-retry {
    min-height: 52px;
    padding: 0 28px;
    border: 1px solid #fff;
    border-radius: 0;
    color: #fff;
    background: transparent;
    font-family: var(--ui-font);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .2em;
    cursor: pointer;
  }
  body.ui-v2 .ui-btn-solid {
    border-color: #fff;
    border-radius: 999px;
    color: #000;
    background: #fff;
    font-weight: 700;
  }

  /* ---- 通知・読み込み・エラー ---- */
  body.ui-v2 .universe-toast {
    border: 0;
    border-radius: 0;
    color: #000;
    background: #fff;
    box-shadow: 0 12px 28px rgba(0, 0, 0, .5);
    letter-spacing: .08em;
  }
  body.ui-v2 .universe-loading { color: var(--ui-text-sub); }
  body.ui-v2 .universe-recovery-state {
    border: 1px solid var(--ui-line);
    border-radius: 0;
    background: var(--ui-panel);
  }
  body.ui-v2 .universe-recovery-state h2 { color: #fff; font-family: var(--ui-font); letter-spacing: .12em; }
</style>
