<style>
  /* =========================================================
     BMSG Universe 新デザイン（白基調・すりガラス・細い枠線）
     - 画面ごとに ROUTES の theme を 'v2' にすると、その画面だけに当たる（body.ui-v2）。
     - まだ切り替えていない画面は、これまでの見た目のまま動く。
     - 色・形・文字はこのファイルの先頭で一か所に決める。
     見本：/design-sample/
     ========================================================= */

  /* ---- 全画面共通：左上のメニュー ---- */
  .utility-actions .utility-menu { margin-right: 0; }
  body.is-section-root .utility-menu,
  body.ui-v2 .utility-menu,
  .utility-menu:has(+ .utility-home[hidden]) { margin-right: auto; }

  .app-menu { position: fixed; inset: 0; z-index: 150; }
  .app-menu[hidden] { display: none; }
  .app-menu-backdrop { position: absolute; inset: 0; background: rgba(12, 18, 26, .32); }
  .app-menu-panel {
    position: absolute;
    top: max(70px, calc(env(safe-area-inset-top) + 64px));
    left: max(14px, calc((100vw - min(100vw, var(--page-max))) / 2 + 14px));
    width: min(280px, calc(100vw - 28px));
    max-height: calc(100dvh - max(70px, calc(env(safe-area-inset-top) + 64px)) - 24px);
    overflow-y: auto;
    padding: 6px 0 10px;
    border: 1px solid rgba(20, 30, 40, .16);
    border-radius: 2px;
    background: rgba(255, 255, 255, .9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #1d2630;
    font-family: "Zen Kaku Gothic New", sans-serif;
    box-shadow: 0 18px 40px -20px rgba(20, 40, 60, .45);
  }
  .app-menu-group {
    margin: 12px 18px 4px;
    color: #66727d;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
  }
  .app-menu-panel button {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 46px;
    padding: 0 18px;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .04em;
    text-align: left;
    cursor: pointer;
  }
  .app-menu-panel button:hover,
  .app-menu-panel button:focus-visible { background: rgba(20, 30, 40, .05); outline: none; }
  .app-menu-panel button[aria-current="page"] {
    color: var(--ui-accent-deep, #1f6f86);
    box-shadow: inset 3px 0 0 var(--ui-accent-deep, #1f6f86);
    background: rgba(255, 255, 255, .7);
  }

  /* ---- 新デザインの基本 ---- */
  body.ui-v2 {
    --ui-accent: var(--universe-accent, #9cecff);
    --ui-accent-deep: color-mix(in srgb, var(--ui-accent) 42%, #0c2a33);
    --ui-accent-soft: color-mix(in srgb, var(--ui-accent) 20%, #ffffff);
    --ui-text: #1d2630;
    --ui-text-sub: #66727d;
    --ui-line: rgba(20, 30, 40, .10);
    --ui-line-strong: rgba(20, 30, 40, .22);
    --ui-bg: #f4f7fa;
    --ui-glass: linear-gradient(135deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .3));
    --ui-glass-edge: rgba(255, 255, 255, .92);
    --ui-glass-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(20, 40, 60, .05);
    --ui-radius: 18px;
    --ui-radius-sharp: 2px;
    --ui-font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --ui-font-head: Orbitron, "Zen Kaku Gothic New", sans-serif;
    --ui-font-num: "Exo 2", Roboto, sans-serif;
    color: var(--ui-text);
    background: var(--ui-bg);
  }
  html:has(body.ui-v2) { background: var(--ui-bg, #f4f7fa); }
  body.ui-v2 .app-shell {
    background:
      radial-gradient(900px 520px at 8% -12%, var(--ui-accent-soft), transparent 62%),
      radial-gradient(700px 520px at 112% 18%, #e8edf5, transparent 60%),
      var(--ui-bg);
  }
  body.ui-v2 .page-wrap { background: transparent; color: var(--ui-text); }

  /* ---- 上のボタン（枠線なし・すりガラス） ---- */
  body.ui-v2 .utility-home,
  body.ui-v2 .utility-settings { display: none !important; }
  body.ui-v2 .app-shell .utility-actions .utility-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 12px;
    color: var(--ui-text);
    background: rgba(255, 255, 255, .55);
    box-shadow: var(--ui-glass-shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  @media (hover: hover) {
    body.ui-v2 .app-shell .utility-actions .utility-btn:not(:disabled):hover {
      border: 0;
      color: var(--ui-text);
      background: rgba(255, 255, 255, .85);
      box-shadow: var(--ui-glass-shadow);
    }
  }

  /* ---- 下のメニュー（HOME・DATA・LAB） ---- */
  body.ui-v2 .bottom-nav {
    border-top: 1px solid var(--ui-glass-edge);
    background: rgba(255, 255, 255, .6);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  body.ui-v2 .nav-btn {
    border: 1px solid transparent;
    border-radius: var(--ui-radius-sharp);
    color: var(--ui-text-sub);
    background: transparent;
  }
  body.ui-v2 .nav-btn.active {
    border-color: var(--ui-accent-deep);
    color: var(--ui-accent-deep);
    background: rgba(255, 255, 255, .75);
  }

  /* ---- データ・ラボの一覧 ---- */
  body.ui-v2 .category-page { padding-top: 64px; }
  body.ui-v2 .category-title {
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1.2;
    text-transform: none;
  }
  body.ui-v2 .category-cards { gap: 12px; }
  body.ui-v2 .category-card {
    min-height: 92px;
    padding: 18px 20px;
    border: 1px solid var(--ui-glass-edge);
    border-radius: var(--ui-radius);
    color: var(--ui-text);
    background: var(--ui-glass);
    box-shadow: var(--ui-glass-shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transform: none;
  }
  body.ui-v2 .category-card::before,
  body.ui-v2 .category-card::after { display: none; }
  body.ui-v2 .category-card:hover { background: rgba(255, 255, 255, .82); border-color: var(--ui-glass-edge); }
  body.ui-v2 .category-card:active { transform: none; background: rgba(255, 255, 255, .9); }
  body.ui-v2 .category-card-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  body.ui-v2 .category-card-meta { display: grid; gap: 4px; text-align: left; }
  body.ui-v2 .category-card-name {
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1.4;
    text-transform: none;
  }
  body.ui-v2 .category-card-desc {
    display: block;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
  }
  .category-card-desc { display: none; }
  body.ui-v2 .category-card-symbol { color: var(--ui-accent-deep); flex: none; }
  body.ui-v2 .category-card-symbol svg { width: 28px; height: 28px; stroke: currentColor; }

  /* ---- 通知・読み込み・エラー ---- */
  body.ui-v2 .universe-toast {
    border: 0;
    border-radius: var(--ui-radius-sharp);
    color: #fff;
    background: rgba(29, 38, 48, .92);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
  }
  body.ui-v2 .universe-loading { color: var(--ui-text-sub); }
  body.ui-v2 .universe-recovery-state {
    border: 1px dashed var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: var(--ui-glass);
  }
  body.ui-v2 .universe-recovery-state h2 { color: var(--ui-accent-deep); font-family: var(--ui-font); letter-spacing: .08em; }
  body.ui-v2 .universe-recovery-retry {
    min-height: 48px;
    padding: 0 24px;
    border: 1px solid var(--ui-accent-deep);
    border-radius: var(--ui-radius-sharp);
    color: var(--ui-accent-deep);
    background: rgba(255, 255, 255, .35);
    font-weight: 700;
    letter-spacing: .12em;
  }
</style>
