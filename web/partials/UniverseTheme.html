<style>
  /* =========================================================
     BMSG UNIVERSE 共通部品（全画面で同じものを使う）
     - 色・書体・大きさは UniverseTokens.html のトークンだけ。
     - 画面ごとのCSSは並べ方（grid・gap・幅）だけを書き、見た目はここの部品を使う。
     - 画面のCSSで上書きしない。足りない見た目はここに部品として足す。
     ========================================================= */

  /* ---- 素の要素：ボタン・入力欄の土台 ---- */
  button {
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    color: inherit;
    touch-action: manipulation;
    cursor: pointer;
    transition: border-color var(--ui-fast) var(--ui-ease), background var(--ui-fast) var(--ui-ease), color var(--ui-fast) var(--ui-ease), transform var(--ui-fast) var(--ui-ease), opacity var(--ui-fast) var(--ui-ease);
  }
  button:not(:disabled):active { transform: scale(.985); }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 2px solid var(--ui-text); outline-offset: 2px; }

  /* 画面の中のボタンは、何も指定がなければ共通の枠線ボタンになる（:where で優先度0） */
  :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(button):not(:where(.ui-back, .utility-btn, .nav-btn)) {
    min-height: 40px;
    padding: 0 16px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 700;
    letter-spacing: var(--ui-ls-body);
  }
  :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(button):where([aria-pressed="true"], .is-active, .is-selected, .is-on, .active, .is-current) {
    border-color: var(--ui-active-bg);
    background: var(--ui-active-bg);
    color: var(--ui-active-text);
  }

  /* 入力欄：.ui-input と、画面の中の素の入力欄は同じ見た目（:where で優先度0） */
  .ui-input,
  :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(input:not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="color"]), select, textarea) {
    display: block;
    width: 100%;
    min-height: var(--ui-button-h);
    padding: 0 16px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: var(--ui-field-bg);
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    letter-spacing: var(--ui-ls-body);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(textarea) { min-height: 120px; padding: 12px 16px; line-height: 1.7; resize: vertical; }
  .ui-input::placeholder, :where(input, textarea)::placeholder { color: var(--ui-text-sub); }
  .ui-input:focus, :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(input, select, textarea):focus { border-color: var(--ui-text); background: var(--ui-field-focus); outline: none; }
  select.ui-input, :where(.page-content, .modal-overlay, .screen-overlay, [class*="-overlay"], [class*="-sheet"], [class*="-dialog"]) :where(select) {
    padding-right: 40px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ui-text) 50%), linear-gradient(135deg, var(--ui-text) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }
  input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--ui-text); }

  /* ---- ボタン ---- */
  .ui-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: var(--ui-button-h);
    padding: 0 20px;
    border: 1px solid var(--ui-line-strong);
    border-radius: var(--ui-radius);
    background: transparent;
    color: var(--ui-text);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    text-transform: uppercase;
    text-decoration: none;
  }
  @media (hover: hover) { .ui-btn:not(:disabled):hover { border-color: var(--ui-text); background: var(--ui-panel); } }
  .ui-btn:not(:disabled):active { background: var(--ui-panel-2); }
  .ui-btn:disabled { opacity: .4; cursor: not-allowed; }
  .ui-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  /* 主な操作は塗りつぶし。押した状態（ON・選択中）も同じ塗り */
  .ui-btn.ui-btn-solid,
  .ui-btn[aria-pressed="true"],
  .ui-btn.is-active,
  .ui-btn.is-selected { border-color: var(--ui-active-bg); background: var(--ui-active-bg); color: var(--ui-active-text); }
  @media (hover: hover) { .ui-btn.ui-btn-solid:not(:disabled):hover, .ui-btn[aria-pressed="true"]:hover { border-color: var(--ui-active-bg); background: var(--ui-active-bg); opacity: .88; } }
  .ui-btn.ui-btn-wide { width: 100%; }
  .ui-btn.ui-btn-compact { min-height: 40px; padding: 0 16px; }
  .ui-btn.ui-btn-icon { width: var(--ui-button-h); padding: 0; letter-spacing: 0; }
  .ui-btn.ui-btn-text { min-height: 36px; padding: 0 2px; border: 0; background: none; text-decoration: underline; text-underline-offset: 4px; }
  .ui-btn.ui-btn-danger { border-color: var(--ui-danger); color: var(--ui-danger); }

  /* ---- 戻るボタン：枠なし。矢印（線）と BACK、下に細い線 ---- */
  .ui-back {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: none;
    height: var(--ui-button-h);
    min-height: var(--ui-button-h);
    padding: 0 4px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ui-text);
    font-family: var(--ui-font-display);
    font-size: var(--ui-fs-label);
    font-weight: 800;
    letter-spacing: var(--ui-ls-label);
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }
  .ui-back::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 10px; height: 1px; background: var(--ui-line-strong); transition: background .2s ease; }
  .ui-back svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ui-back .ui-back-label { letter-spacing: .18em; }
  .ui-back.ui-back-icon { width: var(--ui-button-h); padding: 0; justify-content: center; }
  .ui-back.ui-back-icon::after, .ui-back.ui-back-icon > span { display: none; }
  @media (hover: hover) { .ui-back:hover::after { background: var(--ui-text); } }

  /* ---- 見出し・ラベル ---- */
  .ui-title { margin: 0; color: var(--ui-text); font-family: var(--ui-font-display); font-size: clamp(34px, 9vw, 48px); font-weight: 900; letter-spacing: -.035em; line-height: .95; text-transform: uppercase; }
  .ui-heading { margin: 0; color: var(--ui-text); font-family: var(--ui-font); font-size: var(--ui-fs-title); font-weight: 800; letter-spacing: var(--ui-ls-heading); line-height: 1.3; }
  .ui-label { margin: 0; color: var(--ui-text-sub); font-family: var(--ui-font-display); font-size: var(--ui-fs-label); font-weight: 800; letter-spacing: var(--ui-ls-label); text-transform: uppercase; }
  .ui-muted { color: var(--ui-text-sub); font-size: var(--ui-fs-body-sm); }

  /* ---- 面（カード）・一覧の行・空の表示 ---- */
  .ui-panel { padding: var(--ui-pad); border: 1px solid var(--ui-line); border-radius: var(--ui-radius); background: var(--ui-panel); color: var(--ui-text); }
  .ui-list { display: grid; border-top: 1px solid var(--ui-line); }
  .ui-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: var(--ui-row-h);
    padding: 12px 32px 12px 4px;
    border: 0;
    border-bottom: 1px solid var(--ui-line);
    border-radius: 0;
    background: transparent;
    color: var(--ui-text);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body);
    font-weight: 700;
    text-align: left;
  }
  .ui-row::after { content: ""; position: absolute; right: 10px; top: 50%; width: 8px; height: 8px; border-top: 1.5px solid var(--ui-text-sub); border-right: 1.5px solid var(--ui-text-sub); transform: translateY(-50%) rotate(45deg); }
  @media (hover: hover) { .ui-row:hover { background: var(--ui-panel); } }
  .ui-empty { padding: 22px 16px; border: 1px dashed var(--ui-line-strong); border-radius: var(--ui-radius); color: var(--ui-text-sub); font-size: var(--ui-fs-body-sm); text-align: center; }

  /* ---- タブ（つながった枠。選択中は塗る） ---- */
  .ui-tabs { display: flex; overflow-x: auto; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius); }
  .ui-tab {
    flex: 1 1 0;
    min-width: 0;
    min-height: var(--ui-tab-h);
    padding: 0 6px;
    border: 0;
    border-right: 1px solid var(--ui-line);
    border-radius: 0;
    background: transparent;
    color: var(--ui-text-sub);
    font-family: var(--ui-font);
    font-size: var(--ui-fs-body-sm);
    font-weight: 700;
    white-space: nowrap;
  }
  .ui-tab:last-child { border-right: 0; }
  .ui-tab.active, .ui-tab.is-active, .ui-tab[aria-selected="true"] { background: var(--ui-active-bg); color: var(--ui-active-text); }

  /* ---- 読み込み中（スケルトン） ---- */
  @keyframes uiShimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .ui-skeleton {
    display: block;
    height: 88px;
    border: 1px solid var(--ui-line);
    border-radius: var(--ui-radius);
    background: linear-gradient(100deg, var(--ui-panel) 30%, var(--ui-panel-2) 50%, var(--ui-panel) 70%) 0 0 / 220% 100%;
    animation: uiShimmer 1.4s linear infinite;
  }
  .ui-skeleton-list { display: grid; border-top: 1px solid var(--ui-line); }
  .ui-skeleton-row {
    display: block;
    height: 104px;
    margin: 0 4px;
    border-bottom: 1px solid var(--ui-line);
    background: linear-gradient(100deg, var(--ui-bg) 30%, var(--ui-panel) 50%, var(--ui-bg) 70%) 0 0 / 220% 100%;
    animation: uiShimmer 1.4s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .ui-skeleton, .ui-skeleton-row { animation: none; } }

  /* ---- 上に出る窓（画面の中から開くもの共通） ---- */
  .ui-modal { position: fixed; inset: 0; z-index: 1300; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--ui-scrim); }
  .ui-modal[hidden] { display: none; }
  .ui-modal-card { width: min(100%, 560px); max-height: 86dvh; overflow: auto; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius); background: var(--ui-bg); color: var(--ui-text); }
  .ui-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--ui-line); }
  .ui-modal-head h2 { margin: 0; font-size: var(--ui-fs-heading); font-weight: 700; letter-spacing: var(--ui-ls-heading); }
  .ui-modal-body { padding: 16px 20px 20px; }

  /* ---- 画面を開いたときの動き ---- */
  @keyframes uiRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes uiRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
