<style>
  /* =========================================================
     プロフィールの並べ方。見た目は部品 .ui-*（色・文字は UniverseTokens の変数）。
     ========================================================= */
  .profile-page { padding-top: 96px; }
  /* 見出し・説明の補助（ラベルは表示しない方針） */
  .profile-panel-eyebrow,
  .profile-panel-copy,
  .profile-discover-sub,
  .profile-member-accent { display: none; }
  .profile-panel { display: grid; gap: 24px; margin-top: 32px; }
  .profile-members-head,
  .profile-discover-head,
  .profile-chemistry-head,
  .profile-map-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
  .profile-members-head > .profile-members-count { align-self: center; }
  .profile-members-title,
  .profile-discover-head .profile-members-title,
  .profile-search-title,
  .profile-chemistry-title,
  .profile-map-title { margin: 0; line-height: .95; }
  /* 選択欄（共通の .ui-input と同じ大きさ） */
  .profile-map-select-label select,
  .profile-search-field-options select { display: block; width: 100%; min-height: var(--ui-button-h); padding: 0 16px; }
  /* ボタン（共通の .ui-btn と同じ大きさ） */
  .profile-search-selected-head button,
  .profile-chemistry-detail-error button { min-height: var(--ui-button-h); padding: 0 20px; cursor: pointer; }
  /* 表示切り替え（上の5つ） */
  .profile-local-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); overflow: hidden; }
  .profile-local-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: 64px; padding: 8px 2px; }
  .profile-local-tab svg { width: 20px; height: 20px; }
  /* 共通の戻るボタン＋見出し（分析と同じ） */
  .profile-header { display: flex; align-items: center; justify-content: flex-start; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; }
  .profile-heading { flex: 1; min-width: 0; text-align: left; }
  .profile-title { margin: 0; line-height: .95; }

  /* 写真：枠いっぱい。頭文字は出さない */
  .profile-member-visual > img,
  .profile-detail-visual > img,
  .profile-search-avatar > img,
  .profile-discover-avatar > img,
  .profile-chemistry-slot-avatar > img,
  .profile-map-avatar > img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }

  /* ---- メンバー（ホーム） ---- */
  .profile-member-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .profile-member-card { position: relative; display: grid; grid-template-rows: auto auto; align-content: start; align-items: start; overflow: hidden; padding: 0; text-align: left; cursor: pointer; }
  .profile-member-visual { position: relative; aspect-ratio: 1; overflow: hidden; }
  .profile-member-body { display: grid; align-content: start; align-self: start; gap: 2px; padding: 8px 14px 12px; }
  .profile-member-body > * { margin: 0; }
  .profile-members-state { padding: 24px 16px; text-align: center; }
  .profile-members-state-title { margin: 0 0 6px; }
  /* 読み込み中：同じ形の面を流す（光は部品 .ui-skeleton と同じ） */
  .profile-member-skeleton { display: block; animation: uiShimmer 1.4s linear infinite; }
  .profile-member-skeleton-image { aspect-ratio: 1; }
  .profile-member-skeleton-label,
  .profile-member-skeleton-copy { width: 40%; height: 10px; }
  .profile-member-skeleton-heading,
  .profile-member-skeleton-name { width: 70%; height: 16px; }
  @media (prefers-reduced-motion: reduce) { .profile-member-skeleton { animation: none; } }

  /* ---- 詳細（メンバーを開いた画面） ---- */
  .profile-member-detail { display: grid; gap: 16px; }
  .profile-member-detail > .ui-back { margin-bottom: 16px; }
  .profile-detail-hero { display: grid; grid-template-columns: 120px minmax(0, 1fr); overflow: hidden; }
  .profile-detail-visual { position: relative; min-height: 120px; overflow: hidden; }
  .profile-detail-identity { display: grid; align-content: center; gap: 6px; padding: 16px 18px; }
  .profile-detail-line { display: none; }
  .profile-detail-name { margin: 0; }
  .profile-detail-sections { display: grid; gap: 12px; }
  .profile-detail-section { padding: 16px 18px; }
  .profile-detail-section-title { margin: 0 0 10px; }
  .profile-detail-list { display: grid; margin: 0; }
  .profile-detail-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px 0; }
  .profile-detail-row dd { margin: 0; }

  /* ---- マップ ---- */
  .profile-map-select-label { display: grid; gap: 8px; }
  .profile-map-groups { display: grid; gap: 12px; }
  .profile-map-group { padding: 16px 18px; }
  .profile-map-group h3 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding-bottom: 12px; }
  .profile-map-member-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .profile-map-member { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 16px 4px 4px; }
  .profile-map-avatar { position: relative; width: 44px; height: 44px; overflow: hidden; }

  /* ---- 検索（入力欄が主役。絞り込みは必要な時だけ開く） ---- */
  .profile-search-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
  .profile-search-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; gap: 8px; }
  .profile-search-box { display: flex; align-items: center; gap: 10px; min-height: var(--ui-button-h); padding: 0 14px; }
  .profile-search-box svg { flex: none; width: 18px; height: 18px; }
  .profile-search-box input { display: block; width: 100%; min-height: var(--ui-button-h); padding: 0; }
  .profile-search-filter-toggle { min-height: var(--ui-button-h); padding: 0 16px; cursor: pointer; }
  .profile-search-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .profile-search-field { padding: 0; }
  .profile-search-field-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: var(--ui-button-h); padding: 0 20px; cursor: pointer; }
  .profile-search-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .profile-search-tag { min-height: var(--ui-button-h); padding: 0 16px; cursor: pointer; }
  .profile-search-results { display: grid; gap: 8px; }
  .profile-search-results-head { display: flex; justify-content: space-between; align-items: baseline; }
  .profile-search-results-head h3 { margin: 0; }
  .profile-search-result-list { display: grid; gap: 8px; }
  .profile-search-member { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; }
  .profile-search-member > svg { display: none; }
  .profile-search-avatar { position: relative; width: 52px; height: 52px; overflow: hidden; }
  .profile-search-member-copy { display: grid; gap: 2px; }
  .profile-search-empty { padding: 24px 16px; text-align: center; }

  /* ---- 相性 ---- */
  .profile-chemistry-slots { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); align-items: center; gap: 8px; }
  .profile-chemistry-cross { text-align: center; }
  .profile-chemistry-slot { position: relative; display: grid; align-content: center; justify-items: center; gap: 8px; min-height: 180px; padding: 16px 12px; text-align: center; cursor: pointer; }
  .profile-chemistry-slot-number { position: absolute; top: 12px; left: 14px; }
  .profile-chemistry-slot-plus { line-height: 1; }
  .profile-chemistry-slot-avatar { position: relative; width: 72px; height: 72px; overflow: hidden; }
  .profile-chemistry-slot-remove { min-height: 36px; padding: 0 12px; cursor: pointer; }
  .profile-chemistry-picker { display: grid; gap: 14px; padding: 16px; }
  .profile-chemistry-section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .profile-chemistry-section-head h3 { margin: 0; }
  /* 相性の候補：写真 → 名前 の順。高さは揃えない */
  .profile-chemistry-member-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 8px; }
  .profile-chemistry-member { display: grid; grid-template-rows: auto auto; align-self: start; align-content: start; align-items: start; gap: 8px; padding: 10px; text-align: left; cursor: pointer; }
  .profile-chemistry-member > img,
  .profile-chemistry-member > .profile-chemistry-photo-empty { position: relative; z-index: 0; display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
  .profile-chemistry-member > i { display: none; }
  .profile-chemistry-member > span { display: block; align-self: start; min-height: 16px; }
  .profile-chemistry-member > b { align-self: start; }
  .profile-chemistry-result { display: grid; gap: 12px; padding: 16px; }
  .profile-chemistry-score { display: flex; align-items: baseline; gap: 8px; }
  .profile-chemistry-compare { padding: 6px 16px; }
  .profile-chemistry-compare-head,
  .profile-chemistry-compare-row { display: grid; grid-template-columns: 96px 1fr 1fr; gap: 10px; padding: 10px 0; }
  .profile-chemistry-compare-row dd { margin: 0; }
  .profile-chemistry-compare-row.match dd { text-underline-offset: 4px; }

  /* ---- 発見 ---- */
  .profile-discover-ranking { display: grid; gap: 8px; }
  .profile-discover-rank-card { display: grid; grid-template-columns: 36px 52px 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; }
  .profile-discover-rank { text-align: center; }
  .profile-discover-avatar { position: relative; width: 52px; height: 52px; overflow: hidden; }
  .profile-discover-member { display: grid; gap: 2px; padding: 0; }
  .profile-discover-match,
  .profile-discover-count { display: grid; justify-items: end; gap: 2px; }
</style>
