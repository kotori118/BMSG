<style>
  /* メンバーの線の色・計測中の点の色を部品の --accent に渡す */
  .pt-member { --accent: var(--member-accent, var(--ui-line-strong)); }
  .pt-status-dot { --accent: var(--ui-text-sub); }
  .pt-timer-panel.is-running .pt-status-dot { --accent: var(--ui-text); }
  .pt-timer-panel.is-paused .pt-status-dot { --accent: var(--ui-line-strong); }

  body.performance-timer-active .cosmic-bg{display:none!important}
  .performance-timer-page{
    min-height:100%;padding:72px 16px calc(88px + env(safe-area-inset-bottom));
  }
  .performance-timer-header{max-width:760px;margin:0 auto 10px;display:flex;align-items:center;gap:12px;min-width:0}
  .performance-timer-back{width:46px;height:46px;min-width:46px;padding:0;line-height:1}
  .performance-timer-title-wrap{min-width:0}
  .performance-timer-title{margin:0}
  .performance-timer-app{max-width:760px;margin:0 auto;display:grid;gap:7px}
  .pt-panel{padding:12px}
  .pt-setup-panel{padding:9px}
  .pt-search-wrap{position:relative}
  .pt-search-line{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:7px}
  .pt-search-input{width:100%;min-height:46px;padding:0 13px}
  .pt-clear{width:44px;height:46px;min-width:44px;padding:0}
  .pt-song-results{position:absolute;z-index:40;left:0;right:51px;top:51px;display:grid;max-height:250px;overflow:auto}
  .pt-song-results[hidden]{display:none}
  .pt-song-option{min-height:48px;padding:9px 13px;text-align:left}
  .pt-song-empty{padding:14px}
  .pt-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
  .pt-type{min-height:44px}
  .pt-context{min-height:38px;padding:6px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pt-context strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-context span{flex:0 0 auto}
  .pt-timer-panel{min-height:88px;padding:9px 14px;display:grid;grid-template-columns:minmax(0,auto) 1fr;align-items:center;gap:12px}
  .pt-status-main{display:flex;align-items:center;gap:8px;min-width:0}
  .pt-status-dot{width:10px;height:10px;flex:0 0 10px}
  .pt-status-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt-status-label.is-member{overflow:visible;text-overflow:clip}
  .pt-total{text-align:right;font-variant-numeric:tabular-nums}
  .pt-actions-panel{padding:8px;order:3}
  .pt-main-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pt-main-actions .ui-btn{min-height:48px}
  .pt-secondary-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
  .pt-secondary-actions .ui-btn{min-height:44px;padding:0 8px}
  .pt-member-panel{padding:8px 10px;order:4}
  .pt-members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .pt-member{width:100%;min-height:62px;padding:7px 9px;display:grid!important;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;gap:4px 6px;text-align:left}
  .pt-member-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-member-time{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
  .pt-member-saved{grid-column:1/-1;text-align:right;white-space:nowrap}
  .pt-setup-panel,.pt-context{order:1}
  .pt-timer-panel{order:2}
  .pt-event-log-wrap{margin-top:8px;padding-top:7px}
  .pt-event-log-title{margin:0 0 5px}
  .pt-event-log{height:88px;max-height:88px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:3px;scrollbar-gutter:stable}
  .pt-log-row{min-height:24px;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:7px}
  .pt-log-row time{font-variant-numeric:tabular-nums}
  .pt-log-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-loading{min-height:140px;display:grid;place-items:center}
  .pt-error{padding:14px}
  .pt-dialog-backdrop{position:fixed;z-index:1600;inset:0;display:grid;place-items:center;padding:20px}
  .pt-dialog{width:min(100%,440px);max-height:min(80dvh,620px);overflow:auto;padding:17px}
  .pt-dialog h2{margin:0 0 8px}
  .pt-summary-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pt-summary-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-dialog-list{display:grid;gap:4px;margin:10px 0 14px;padding:0;list-style:none}
  .pt-dialog-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0}
  .pt-dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pt-dialog-actions .ui-btn{min-height:48px}
  @media(max-width:560px){
    .performance-timer-page{padding:68px 10px calc(84px + env(safe-area-inset-bottom))}
    .performance-timer-header{margin-bottom:7px;gap:10px}
    .performance-timer-app{gap:6px}
    .pt-setup-panel{padding:8px}
    .pt-timer-panel{min-height:78px;padding:7px 11px}
    .pt-member{min-height:60px;padding:6px 7px}
    .pt-member-time{min-width:54px}
    .pt-event-log{height:78px;max-height:78px}
  }
  @media(max-width:360px){
    .pt-member-time{min-width:50px}
    .pt-status-label{max-width:86px}
    .pt-status-label.is-member{max-width:none}
  }
  @media(prefers-reduced-motion:reduce){.performance-timer-page *{scroll-behavior:auto}}
</style>
