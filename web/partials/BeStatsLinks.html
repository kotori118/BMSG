<script>
  // BE:STATS つながり：推移 / 発売後 / 活動 / 長期 / 選曲
  const BS_LINK_TAGS = [['trend', '推移'], ['after', '発売後'], ['activity', '活動'], ['long', '長期'], ['select', '選曲']];
  const BS_LINK_DEFAULT_METRICS = ['youtube_subscribers', 'spotify_followers', 'instagram_followers_official', 'x_followers_official', 'tiktok_followers_official'];
  const BS_EVENT_KINDS = ['release', 'tv', 'year_end', 'summer'];
  const BS_LINK_STEP = 20;
  const BS_EXPOSURE_LABELS = {tv: 'TV', live: 'ライブ', normal: '動画', shorts: 'Shorts'};

  function bsLinksState_() {
    if (!beStatsState.linksView) {
      beStatsState.linksView = {tag: 'trend', metrics: BS_LINK_DEFAULT_METRICS.slice(), period: '365', year: '', kinds: {release: true, tv: true, year_end: true, summer: true}, focus: '', afterDays: 30, song: '', open: {}, shown: BS_LINK_STEP};
    }
    return beStatsState.linksView;
  }

  function setBeStatsLinkTag(tag) { const s = bsLinksState_(); s.tag = tag; s.shown = BS_LINK_STEP; renderBeStatsView(); }
  function setBeStatsLinkPeriod(p) { const s = bsLinksState_(); s.period = p; s.year = ''; renderBeStatsView(); }
  function setBeStatsLinkYear(y) { bsLinksState_().year = y; renderBeStatsView(); }
  function removeBeStatsLinkMetric(id) { const s = bsLinksState_(); s.metrics = s.metrics.filter(function (m) { return m !== id; }); renderBeStatsView(); }
  function addBeStatsLinkMetric(id) { const s = bsLinksState_(); if (id && s.metrics.indexOf(id) < 0) s.metrics.push(id); renderBeStatsView(); }
  function toggleBeStatsLinkKind(kind) { const s = bsLinksState_(); s.kinds[kind] = !s.kinds[kind]; renderBeStatsView(); }
  function setBeStatsLinkFocus(id) { bsLinksState_().focus = id; renderBeStatsView(); }
  function setBeStatsAfterDays(days) { const s = bsLinksState_(); s.afterDays = Number(days); s.shown = BS_LINK_STEP; renderBeStatsView(); }
  function toggleBeStatsLinkOpen(key) { const s = bsLinksState_(); s.open[key] = !s.open[key]; renderBeStatsView(); }
  function showMoreBeStatsLinks() { const s = bsLinksState_(); s.shown += BS_LINK_STEP; renderBeStatsView(); }
  function setBeStatsLinkSong(title) {
    const s = bsLinksState_(), want = String(title || '').trim().toLowerCase();
    const hit = beStatsState.data.songs.songs.find(function (x) { return String(x.Title).trim().toLowerCase() === want; });
    s.song = hit ? String(hit.SongID) : '';
    renderBeStatsView();
  }

  function bsSongs_() { return beStatsState.data.songs.songs; }
  function bsExposures_() {
    if (!beStatsState.exposures) beStatsState.exposures = bsSongExposures(bsSongs_(), beStatsState.data);
    return beStatsState.exposures;
  }

  function renderBeStatsLinks(panel) {
    const s = bsLinksState_();
    const chips = '<div class="bestats-tags" role="group" aria-label="内訳">' + BS_LINK_TAGS.map(function (t) {
      return '<button type="button" class="ui-chip" aria-pressed="' + (t[0] === s.tag ? 'true' : 'false') + '" onclick="setBeStatsLinkTag(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('') + '</div>';
    let body = '';
    if (s.tag === 'trend') body = renderBeStatsLinkTrend_(s);
    else if (s.tag === 'after') body = renderBeStatsLinkAfter_(s);
    else if (s.tag === 'activity') body = renderBeStatsLinkActivity_(s);
    else if (s.tag === 'long') body = renderBeStatsLinkLong_(s);
    else body = renderBeStatsLinkSelect_(s);
    panel.innerHTML = '<div class="bestats-controls">' + chips + '</div>' + body;
    const c = beStatsState.pendingLinkChart;
    if (c) { beStatsState.pendingLinkChart = null; if (c.kind === 'trend') drawBeStatsTrendChart_(c); else { drawBeStatsBarChart_(c); } }
  }

  // ---- 推移 ----
  function renderBeStatsLinkTrend_(s) {
    const d = beStatsState.data, dataEnd = (beStatsState.manifest || {}).dataEnd;
    const metrics = d.metrics.metrics, daily = d.metrics.daily;
    const byId = {}; metrics.forEach(function (m) { byId[m.id] = m; });
    s.metrics = s.metrics.filter(function (id) { return byId[id]; });
    const firstDate = daily.length ? daily[0].date : dataEnd;
    const years = Array.from(new Set(daily.map(function (r) { return r.date.slice(0, 4); }))).sort();
    const range = bsRange(firstDate, dataEnd, s.period, s.year);
    const rows = daily.filter(function (r) { return r.date >= range.from && r.date <= range.to; });

    const selectedChips = '<div class="bestats-tags">' + s.metrics.map(function (id) {
      return '<button type="button" class="ui-chip ui-chip-accent" style="--accent:' + bsMediaAccent(byId[id].media) + '" aria-label="' + escapeHtml(byId[id].name) + 'を外す" onclick="removeBeStatsLinkMetric(\'' + id + '\')">' + escapeHtml(byId[id].name) + ' ×</button>';
    }).join('') + '</div>';
    const rest = metrics.filter(function (m) { return s.metrics.indexOf(m.id) < 0; });
    const addSelect = rest.length ? '<select class="ui-input" aria-label="指標を追加する" onchange="addBeStatsLinkMetric(this.value)"><option value="">指標を追加する</option>'
      + rest.map(function (m) { return '<option value="' + escapeHtml(m.id) + '">' + escapeHtml(m.name) + '</option>'; }).join('') + '</select>' : '';
    const periodTabs = '<div class="ui-tabs bestats-periods" role="group" aria-label="期間">' + BS_PERIODS.map(function (p) {
      return '<button type="button" class="ui-tab' + (!s.year && s.period === p[0] ? ' active' : '') + '" onclick="setBeStatsLinkPeriod(\'' + p[0] + '\')">' + p[1] + '</button>';
    }).join('') + '</div>';
    const yearSelect = '<select class="ui-input" aria-label="年" onchange="setBeStatsLinkYear(this.value)"><option value="">年を選ぶ（指定なし）</option>'
      + years.map(function (y) { return '<option value="' + y + '"' + (String(s.year) === y ? ' selected' : '') + '>' + y + '年</option>'; }).join('') + '</select>';
    const kindChips = '<div class="bestats-tags" role="group" aria-label="出来事の種類">' + BS_EVENT_KINDS.map(function (k) {
      return '<button type="button" class="ui-chip" aria-pressed="' + (s.kinds[k] ? 'true' : 'false') + '" onclick="toggleBeStatsLinkKind(\'' + k + '\')">' + BS_EVENT_KIND_LABELS[k] + '</button>';
    }).join('') + '</div>';

    const events = bsEventsInRange(d.events.events, range.from, range.to).filter(function (e) { return s.kinds[e.kind]; });
    // 指標ごとに「期間の最初の日 = 100」にそろえた線。同じ媒体の2本目からは点線
    const seenMedia = {};
    const datasets = s.metrics.map(function (id) {
      const m = byId[id], n = seenMedia[m.media] = (seenMedia[m.media] || 0) + 1;
      return {label: m.name, media: m.media, dash: n > 1, data: bsNormalizeRows(rows, id)};
    });
    beStatsState.pendingLinkChart = {kind: 'trend', labels: rows.map(function (r) { return r.date; }), datasets: datasets,
      events: events.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })};

    if (s.metrics.indexOf(s.focus) < 0) s.focus = s.metrics[0] || '';
    const focusSelect = s.metrics.length ? '<select class="ui-input" aria-label="数字を見る指標" onchange="setBeStatsLinkFocus(this.value)">'
      + s.metrics.map(function (id) { return '<option value="' + escapeHtml(id) + '"' + (id === s.focus ? ' selected' : '') + '>' + escapeHtml(byId[id].name) + '</option>'; }).join('') + '</select>' : '';
    const series = s.focus ? bsSeries(daily, s.focus) : [];
    const list = events.length ? '<div class="ui-list">' + events.map(function (e) {
      const r = e.end ? bsDeltaBetween(series, e.date, e.end) : bsAfter30(series, e.date);
      const text = (e.end ? '期間の合計 ' : '後30日 ') + (r ? bsFormatSigned(r.delta) + (r.rate === null ? '' : '（' + bsFormatPercent(r.rate) + '）') : '—');
      return '<div class="ui-row ui-row-plain bestats-event"><span class="bestats-row-main"><span><span class="ui-muted">' + bsSlashDate(e.date) + '</span> <span class="ui-badge">' + escapeHtml(BS_EVENT_KIND_LABELS[e.kind] || e.kind) + '</span> <strong class="ui-strong">' + escapeHtml(e.name) + '</strong></span><span class="ui-muted">' + escapeHtml(text) + '</span></span></div>';
    }).join('') + '</div>' : '<div class="ui-empty">この期間に出来事はありません</div>';

    return '<div class="bestats-controls">' + periodTabs + yearSelect + '</div>'
      + '<section class="bestats-section"><h2 class="ui-label bestats-section-title">指標（期間の最初の日 = 100）</h2>' + (s.metrics.length ? selectedChips : '<div class="ui-empty">指標を選んでください</div>') + (addSelect ? '<div class="bestats-add">' + addSelect + '</div>' : '') + '</section>'
      + '<section class="bestats-section"><h2 class="ui-label bestats-section-title">出来事の種類</h2>' + kindChips + '<div class="ui-panel bestats-chart bestats-chart-top"><canvas id="beStatsTrendChart" aria-label="指標の推移"></canvas></div></section>'
      + '<section class="bestats-section"><h2 class="ui-label bestats-section-title">出来事（新しい順）</h2>' + (focusSelect ? '<div class="bestats-add">' + focusSelect + '</div>' : '') + list + '</section>';
  }

  function drawBeStatsTrendChart_(c) {
    destroyBeStatsChart();
    const canvas = document.getElementById('beStatsTrendChart');
    if (!canvas || typeof Chart === 'undefined') return;
    const sub = bsCssVar_('--ui-text-sub'), grid = bsCssVar_('--ui-line');
    beStatsChart = new Chart(canvas, {
      type: 'line',
      data: {labels: c.labels, datasets: c.datasets.map(function (ds) {
        return {label: ds.label, data: ds.data, borderColor: bsCssVar_('--ui-media-' + ds.media), borderWidth: 2, borderDash: ds.dash ? [6, 4] : [], pointRadius: 0, pointHoverRadius: 3, tension: 0.15, spanGaps: false};
      })},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: {mode: 'index', intersect: false},
        plugins: {legend: {display: false}, tooltip: {callbacks: {label: function (x) { return x.parsed.y === null ? '' : x.dataset.label + ' ' + x.parsed.y.toFixed(1); }}}, bsEvents: {events: c.events}},
        scales: {
          x: {grid: {display: false}, ticks: {color: sub, maxTicksLimit: 5, maxRotation: 0, callback: function (v) { return String(this.getLabelForValue(v)).slice(0, 7).replace('-', '/'); }}},
          y: {grid: {color: grid}, ticks: {color: sub, maxTicksLimit: 5, callback: function (v) { return Math.round(v); }}}
        }
      },
      plugins: [bsEventsPlugin]
    });
  }

  // ---- 発売後 ----
  function bsDaysTabs_(s) {
    return '<div class="ui-tabs bestats-periods" role="group" aria-label="発売後の日数">' + [30, 90, 365].map(function (n) {
      return '<button type="button" class="ui-tab' + (s.afterDays === n ? ' active' : '') + '" onclick="setBeStatsAfterDays(' + n + ')">発売後' + n + '日</button>';
    }).join('') + '</div>';
  }

  function renderBeStatsLinkAfter_(s) {
    const dataEnd = (beStatsState.manifest || {}).dataEnd;
    const r = bsAfterRelease(bsSongs_(), bsExposures_(), s.afterDays, dataEnd);
    const top = r.ranked.length ? Math.max(1, r.ranked[0].counts.total) : 1;
    const rows = r.ranked.slice(0, s.shown).map(function (x, i) {
      const c = x.counts;
      return '<div class="bestats-rank-row bestats-after-row"><span class="bestats-rank-label"><span class="ui-muted">' + (i + 1) + '</span>　' + escapeHtml(x.song.Title) + '</span><span class="ui-strong bestats-rank-count">' + c.total + '</span>'
        + '<span class="ui-muted bestats-rank-detail">' + Object.keys(BS_EXPOSURE_LABELS).map(function (k) { return BS_EXPOSURE_LABELS[k] + ' ' + c[k]; }).join('　') + '</span>'
        + '<span class="ui-progress bestats-rank-bar"><span class="ui-progress-fill" style="width:' + (c.total / top * 100).toFixed(1) + '%"></span></span></div>';
    }).join('');
    return '<div class="bestats-controls">' + bsDaysTabs_(s) + '</div><section class="bestats-section">'
      + '<p class="ui-muted bestats-source">露出 ＝ TV出演＋ライブ披露＋通常動画＋Shorts の件数</p>'
      + (rows ? '<div class="bestats-rank">' + rows + '</div>' : '<div class="ui-empty">順位に入れられる曲がありません</div>')
      + (r.ranked.length > s.shown ? '<button type="button" class="ui-btn ui-btn-wide bestats-more" onclick="showMoreBeStatsLinks()">もっと見る</button>' : '')
      + (r.pending.length ? '<p class="ui-muted bestats-legend">期間が終わっていないため入れていない：' + r.pending.map(escapeHtml).join('、') + '</p>' : '')
      + '</section>';
  }

  // ---- 活動 ----
  function renderBeStatsLinkActivity_(s) {
    const dataEnd = (beStatsState.manifest || {}).dataEnd, songs = bsSongs_();
    const song = songs.find(function (x) { return String(x.SongID) === s.song; });
    const input = '<input class="ui-input" type="search" list="beStatsSongList" placeholder="曲名を入力して選ぶ" aria-label="曲" value="' + escapeHtml(song ? song.Title : '') + '" onchange="setBeStatsLinkSong(this.value)">'
      + '<datalist id="beStatsSongList">' + songs.map(function (x) { return '<option value="' + escapeHtml(x.Title) + '"></option>'; }).join('') + '</datalist>';
    if (!song) return '<div class="bestats-controls">' + input + '</div><div class="ui-empty">曲を選ぶと、発売後30日・90日・365日の内訳が出ます</div>';
    if (!song.ReleaseDate) return '<div class="bestats-controls">' + input + '</div><div class="ui-empty">この曲は発売日が未登録です</div>';
    const wins = bsSongWindows(song, bsExposures_()[s.song], [30, 90, 365], dataEnd);
    const keys = Object.keys(BS_EXPOSURE_LABELS);
    beStatsState.pendingLinkChart = {kind: 'bar', labels: wins.map(function (w) { return '発売後' + w.days + '日' + (w.complete ? '' : '（途中）'); }), keys: keys,
      counts: Object.fromEntries(keys.map(function (k) { return [k, wins.map(function (w) { return w.counts[k]; })]; })), keyLabels: BS_EXPOSURE_LABELS, stacked: true,
      colors: ['--ui-series-1', '--ui-series-2', '--ui-series-3', '--ui-series-4']};
    const table = '<div class="bestats-table-wrap"><table class="ui-table"><thead><tr><th>期間</th>' + keys.map(function (k) { return '<th class="num">' + BS_EXPOSURE_LABELS[k] + '</th>'; }).join('') + '<th class="num">計</th></tr></thead><tbody>'
      + wins.map(function (w) { return '<tr><td>' + w.days + '日' + (w.complete ? '' : '（途中）') + '</td>' + keys.map(function (k) { return '<td class="num">' + w.counts[k] + '</td>'; }).join('') + '<td class="num">' + w.counts.total + '</td></tr>'; }).join('') + '</tbody></table></div>';
    return '<div class="bestats-controls">' + input + '</div><section class="bestats-section"><h2 class="ui-label bestats-section-title">' + escapeHtml(song.Title) + '　発売 ' + bsSlashDate(song.ReleaseDate) + '</h2>'
      + '<div class="ui-panel bestats-chart"><canvas id="beStatsBarChart" aria-label="発売後の内訳"></canvas></div></section><section class="bestats-section">' + table + '</section>';
  }

  // ---- 長期 ----
  function renderBeStatsLinkLong_(s) {
    const dataEnd = (beStatsState.manifest || {}).dataEnd;
    const rows = bsLongTerm(bsSongs_(), bsExposures_(), dataEnd);
    const top = rows.reduce(function (m, r) { return Math.max(m, r.first, r.later); }, 1);
    const html = rows.slice(0, s.shown).map(function (r) {
      return '<div class="bestats-long-row"><span class="bestats-rank-label">' + escapeHtml(r.song.Title) + '</span>'
        + '<span class="bestats-long-bar" style="--accent:var(--ui-series-1)"><span class="ui-progress"><span class="ui-progress-fill" style="width:' + (r.first / top * 100).toFixed(1) + '%"></span></span><span class="ui-strong bestats-rank-count">' + r.first + '</span></span>'
        + '<span class="bestats-long-bar" style="--accent:var(--ui-series-2)"><span class="ui-progress"><span class="ui-progress-fill" style="width:' + (r.later / top * 100).toFixed(1) + '%"></span></span><span class="ui-strong bestats-rank-count">' + r.later + '</span></span></div>';
    }).join('');
    return '<section class="bestats-section"><p class="ui-muted bestats-source">TVとライブの披露件数。<span class="bestats-key" style="--accent:var(--ui-series-1)"><span class="ui-dot"></span> 発売1年目</span>　<span class="bestats-key" style="--accent:var(--ui-series-2)"><span class="ui-dot"></span> 2年目以降</span></p>'
      + (html ? '<div class="bestats-rank">' + html + '</div>' : '<div class="ui-empty">2年目以降が来た曲がありません</div>')
      + (rows.length > s.shown ? '<button type="button" class="ui-btn ui-btn-wide bestats-more" onclick="showMoreBeStatsLinks()">もっと見る</button>' : '') + '</section>';
  }

  // ---- 選曲 ----
  function renderBeStatsLinkSelect_(s) {
    const b = bsSelectionBuckets(bsSongs_(), bsExposures_());
    const groups = [['both', 'TVとライブの両方'], ['liveOnly', 'ライブのみ'], ['tvOnly', 'TVのみ'], ['none', 'どちらもなし']];
    const total = bsSongs_().length;
    return '<section class="bestats-section"><p class="ui-muted bestats-source">TVとライブでの披露（全期間）。全 ' + total + ' 曲</p><div class="ui-list">' + groups.map(function (g) {
      const list = b[g[0]], open = !!s.open['sel-' + g[0]];
      return '<div class="bestats-acc"><button type="button" class="ui-row bestats-acc-head" aria-expanded="' + (open ? 'true' : 'false') + '" onclick="toggleBeStatsLinkOpen(\'sel-' + g[0] + '\')"><span class="bestats-row-main"><strong class="ui-strong">' + g[1] + '</strong></span><span class="ui-strong bestats-rank-count">' + list.length + '</span></button>'
        + (open ? '<div class="bestats-acc-body">' + (list.length ? list.map(function (x) { return '<p class="bestats-acc-line">' + escapeHtml(x.Title) + '</p>'; }).join('') : '<p class="ui-muted bestats-acc-line">なし</p>') + '</div>' : '') + '</div>';
    }).join('') + '</div></section>';
  }
</script>
