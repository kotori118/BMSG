<template id="cardPageTemplate">
  <section class="view card-page" id="cardPageRoot">
    <header class="card-header">
      <button type="button" class="ui-back" data-page-back onclick="if(!universeInnerBack())navigateTo('lab')" aria-label="LABへ戻る"><svg class="ui-back-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg><span class="ui-back-label">BACK</span></button>
      <div>
        <h1 class="ui-title card-title">TRADING CARD</h1>
      </div>
    </header>
    <div id="cardApp" class="card-app" aria-live="polite"></div>
    <div class="card-collection-entry">
      <button type="button" class="ui-btn ui-btn-wide card-collection-entry-btn" onclick="openCardCollection()">COLLECTION</button>
    </div>
  </section>

  <div id="cardReveal" class="card-reveal" aria-hidden="true">
    <div class="card-reveal-stars" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-a" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-b" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-c" aria-hidden="true"></div>
    <div class="card-reveal-burst" aria-hidden="true"></div>
    <div class="card-reveal-meteors" aria-hidden="true"></div>
    <div class="card-reveal-sparks" aria-hidden="true"></div>
    <button type="button" class="ui-back card-reveal-back" data-keep-back onclick="closeCardReveal()" aria-label="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg><span class="ui-back-label">BACK</span></button>
    <div class="card-reveal-stage">
      <div class="card-reveal-kicker" id="cardRevealKicker"></div>
      <div class="card-flip-wrap" id="cardFlipWrap">
        <div class="card-flip-inner">
          <div class="card-back-face" aria-label="BMSG Universe card back">
            <div class="card-back-design" aria-hidden="true">
              <div class="card-back-seal"><small>BMSG</small><strong>UNIVERSE</strong><i></i></div>
            </div>
          </div>
          <div class="card-front-face"><img id="cardRevealImage" alt="Trading card"></div>
        </div>
      </div>
      <div class="card-result-meta" id="cardResultMeta">
        <div class="card-result-rarity" id="cardResultRarity"></div>
        <div class="ui-heading card-result-name" id="cardResultName"></div>
        <div class="ui-badge ui-badge-solid card-result-new" id="cardResultNew"></div>
      </div>
      <div class="card-result-actions" id="cardResultActions">
        <button type="button" class="ui-btn ui-btn-solid" onclick="drawTradingCardFromReveal()">もう一度引く</button>
      </div>
    </div>
  </div>

  <div id="cardCollectionOverlay" class="ui-surface card-collection-overlay" aria-hidden="true">
    <div class="ui-surface card-collection-panel">
      <div class="ui-surface ui-divider card-collection-head">
        <div class="card-collection-head-main">
          <p class="ui-label">TRADING CARD</p>
          <h2 class="ui-title ui-title-sm">COLLECTION</h2>
          <div id="cardCollectionProgress" class="ui-muted card-collection-progress"></div>
          <div class="ui-progress card-collection-meter" aria-hidden="true"><span id="cardCollectionMeterFill" class="ui-progress-fill"></span></div>
        </div>
        <button type="button" class="ui-btn ui-btn-icon card-collection-close" onclick="closeCardCollection()" aria-label="コレクションを閉じる">×</button>
      </div>
      <div id="cardCollectionBody" class="card-collection-body"></div>
      <button id="cardResetCollectionBtn" type="button" class="ui-btn ui-btn-danger card-reset-btn" onclick="resetCardCollection()" hidden>コレクションをリセット</button>
    </div>
  </div>
</template>
